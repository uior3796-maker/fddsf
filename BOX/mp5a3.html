r .14s}\n.copt:hover{background:rgba(32,36,42,.94)}\n.copt.sel{border-color:#e8b45c;color:#ffd79a;background:rgba(232,180,92,.16)}\n.copt.bad{opacity:.38;border-style:dashed;cursor:not-allowed}\n\n#custStats{position:fixed;left:18px;top:84px;z-index:20;pointer-events:none;\n  width:238px;display:flex;flex-direction:column;gap:2px;\n  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}\n.cstat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;\n  padding:4px 10px;border-radius:5px;background:rgba(10,12,15,.78);\n  border-left:2px solid rgba(255,255,255,.18);font-size:11.5px;line-height:1.35}\n.cstat span{color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.cstat b{font-weight:600;font-variant-numeric:tabular-nums;color:#f0f2f5;white-space:nowrap}\n.cstat.up{border-left-color:#63c97a}\n.cstat.up b{color:#96e6a6}\n.cstat.dn{border-left-color:#e07a6a}\n.cstat.dn b{color:#f0a598}\n.cstat i{font-style:normal;font-size:10px;margin-left:5px;opacity:.85}\n\n#custHint{text-align:center;padding:0 16px 10px;font-size:11px;line-height:1.5;\n  color:rgba(255,255,255,.34);letter-spacing:.02em}\n#custWarn{text-align:center;padding:0 16px 6px;font-size:11.5px;line-height:1.45;\n  color:#e8b45c;min-height:16px}\n@media (max-width:760px){\n  .cslot{width:112px}\n  #custStats{width:190px;top:70px;left:10px}\n}\n";
const STAT_DEFS = [{"k":"vertRecoil","label":"Подброс","up":false,"d":2},{"k":"horizRecoil","label":"Увод","up":false,"d":2},{"k":"hipSpread","label":"Разброс от бедра","up":false,"d":2},{"k":"adsTime","label":"Вскидка, с","up":false,"d":3},{"k":"mobility","label":"Подвижность","up":true,"d":0},{"k":"reloadTime","label":"Перезарядка, с","up":false,"d":3},{"k":"muzzleVelocity","label":"Скорость, м/с","up":true,"d":0},{"k":"effectiveRange","label":"Дальность, м","up":true,"d":0},{"k":"loudness","label":"Громкость","up":false,"d":0},{"k":"flashVisible","label":"Заметность вспышки","up":false,"d":0},{"k":"weight","label":"Масса, г","up":false,"d":0},{"k":"magCap","label":"Ёмкость","up":true,"d":0}];

function createCustomizer(opts) {
  const style = document.createElement('style');
  style.textContent = CUST_CSS;
  document.head.appendChild(style);

  const host = document.createElement('div'); host.id = 'cust';
  const warn = document.createElement('div'); warn.id = 'custWarn';
  const list = document.createElement('div'); list.id = 'custList';
  const slots = document.createElement('div'); slots.id = 'custSlots';
  const hint = document.createElement('div'); hint.id = 'custHint';
  hint.textContent = 'TAB — панель · 1…9 — слот · ← → — модуль · B — сошки/приклад · L — фонарь · K — ЛЦУ';
  host.append(warn, list, slots, hint);
  document.body.appendChild(host);

  const statBox = document.createElement('div'); statBox.id = 'custStats';
  document.body.appendChild(statBox);

  let active = null, prevStats = null, flash = {};

  function renderSlots(defs, cfg) {
    slots.innerHTML = '';
    defs.forEach((s, i) => {
      const cur = cfg[s.key];
      const el = document.createElement('div');
      el.className = 'cslot' + (active === s.key ? ' on' : '') + (cur ? '' : ' empty');
      const k = document.createElement('div'); k.className = 'k';
      k.textContent = (i < 9 ? (i + 1) + ' · ' : '') + s.label;
      const v = document.createElement('div'); v.className = 'v';
      v.textContent = cur ? opts.nameOf(cur) : '—';
      v.title = v.textContent;
      el.append(k, v);
      el.onclick = () => { active = s.key; render(); };
      slots.appendChild(el);
      if (active === s.key) requestAnimationFrame(() => {
        el.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderOptions(cfg) {
    list.innerHTML = '';
    if (!active) return;
    let selected = null;
    for (const o of opts.optionsFor(active)) {
      const el = document.createElement('div');
      const isSel = (cfg[active] || null) === o.key;
      el.className = 'copt' + (isSel ? ' sel' : '') + (o.fits === false ? ' bad' : '');
      el.textContent = o.label;
      el.title = o.fits === false ? 'Не подходит этому слоту' : o.label;
      el.onclick = () => { if (o.fits !== false) { opts.setModule(active, o.key); render(); } };
      list.appendChild(el);
      if (isSel) selected = el;
    }
    if (selected) requestAnimationFrame(() => {
      selected.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }

  function renderStats() {
    const st = opts.getStats();
    statBox.innerHTML = '';
    for (const d of STAT_DEFS) {
      if (st[d.k] === undefined) continue;
      const v = st[d.k], pv = prevStats ? prevStats[d.k] : undefined;
      const changed = pv !== undefined && Math.abs(v - pv) > 1e-6;
      let cls = 'cstat';
      if (changed) cls += ((v > pv) === d.up) ? ' up' : ' dn';
      const row = document.createElement('div');
      row.className = cls;
      const name = document.createElement('span'); name.textContent = d.label;
      const val = document.createElement('b');
      val.textContent = v.toFixed(d.d);
      if (changed) {
        const diff = document.createElement('i');
        const delta = v - pv;
        diff.textContent = (delta > 0 ? '▲' : '▼') + Math.abs(delta).toFixed(d.d);
        val.appendChild(diff);
      }
      row.append(name, val);
      statBox.appendChild(row);
    }
  }

  function render() {
    const cfg = opts.getConfig(), defs = opts.getSlots();
    if (active && !defs.some((s) => s.key === active)) active = null;
    renderSlots(defs, cfg);
    renderOptions(cfg);
    renderStats();
    const w = opts.getWarnings();
    warn.textContent = w && w.length ? w.join(' · ') : '';
  }

  return {
    render,
    markStats() { prevStats = Object.assign({}, opts.getStats()); },
    setActive(k) { active = k; render(); },
    getActive() { return active; },
    toggle(on) {
      const show = on !== false;
      host.classList.toggle('hidden', !show);
      statBox.style.display = show ? '' : 'none';
      if (show) render();
    },
    visible() { return !host.classList.contains('hidden'); }
  };
}

const ATTACH_DEF = __ATTACH.SLOTS["mp5a3"];
const ATTACH_STATE = {

  asm: null, view: null, ui: null,
  toggles: { light: 0, laser: 0, ir: 0, deploy: {} }
};
/* деталь базовой модели -> слот, который её заменяет (для точечного скрытия) */
const ATTACH_HIDE_BY_NAME = {};

/* Список модулей, подходящих слоту (для интерфейса). */
function attachOptionsFor(slotKey) {
  const slot = attachSlots().find((s) => s.key === slotKey);
  if (!slot) return [];
  const accepts = slot.accepts || [slot.key];
  const out = [{ key: null, label: '— НЕТ —', fits: true }];
  for (const key of __ATTACH.REG.keys()) {
    let meta;
    try { meta = __ATTACH.REG.meta(key); } catch (e) { continue; }
    if (accepts.indexOf(meta.slot) < 0) continue;
    const fit = __ATTACH.SYS.checkFit(slot, Object.assign({ key }, meta),
      { caliber: ATTACH_DEF.caliber }, {});
    out.push({ key, label: meta.name, fits: fit.ok });
  }
  return out;
}

/* Слоты: статические из описания + динамические от цевья. */
function attachSlots() {
  const base = ATTACH_DEF.slots.slice();
  if (ATTACH_STATE.asm && ATTACH_STATE.asm.slotsDynamic)
    for (const d of ATTACH_STATE.asm.slotsDynamic)
      if (!base.some((b) => b.key === d.key)) base.push(d);
  return base;
}

function attachNameOf(key) {
  try { return __ATTACH.REG.meta(key).name; } catch (e) { return String(key); }
}

/* Пересборка: снять старую группу, собрать новую, вернуть узлы. */
function attachRebuild(THREE, parent, baseParts, weaponNodes) {
  if (ATTACH_STATE.view) {
    parent.remove(ATTACH_STATE.view.root);
    ATTACH_STATE.view.dispose();
  }
  const weapon = {
    caliber: ATTACH_DEF.caliber, weight: ATTACH_DEF.weight,
    ballistics: ATTACH_DEF.ballistics, stats: {},
    base: baseParts || [], nodes: weaponNodes || {}, slots: attachSlots()
  };
  const asm = __ATTACH.SYS.assemble(weapon, __ATTACH.REG, ATTACH_STATE.config);
  const view = __ATTACH.ADAPTER.build(THREE, asm, { scale: 0.001 });
  parent.add(view.root);
  ATTACH_STATE.asm = asm;
  ATTACH_STATE.view = view;
  /* вернуть прежние состояния переключателей */
  view.setBeam('light', ATTACH_STATE.toggles.light);
  view.setBeam('laser', ATTACH_STATE.toggles.laser);
  view.setBeam('ir', ATTACH_STATE.toggles.ir);
  for (const k in ATTACH_STATE.toggles.deploy) view.setDeploy(k, ATTACH_STATE.toggles.deploy[k]);
  return asm;
}

/* Скрытие заменяемых деталей базовой модели: зоны включаются по конфигурации.
   Вызывается после каждой пересборки, поэтому снятие модуля возвращает
   исходную деталь на место. */
function attachOcclude(THREE, host) {
  if (!host) return null;
  return __ATTACH.OCC.apply(THREE, host, "mp5a3", ATTACH_STATE.config, {
    names: ATTACH_HIDE_BY_NAME, groups: {}
  });
}

/* Публичный API: смена модулей из консоли, автотестов и внешнего интерфейса.
   Реальная функция подстановки регистрируется интеграцией оружия. */
window.ATTACH = {
  set(slotKey, moduleKey) {
    if (!ATTACH_STATE.apply) throw new Error('система ещё не готова');
    ATTACH_STATE.apply(slotKey, moduleKey);
    return window.__ATTACH_DEBUG();
  },
  get: () => Object.assign({}, ATTACH_STATE.config),
  slots: () => attachSlots().map((s) => s.key),
  options: (slotKey) => attachOptionsFor(slotKey),
  preset: {
    save: () => __ATTACH.SYS.presetCodec().encode(ATTACH_STATE.config),
    load(code) {
      const cfg = __ATTACH.SYS.presetCodec().decode(code);
      for (const k of attachSlots().map((s) => s.key))
        window.ATTACH.set(k, cfg[k] || null);
      return window.__ATTACH_DEBUG();
    }
  },
  beam: (kind, level) => ATTACH_STATE.view.setBeam(kind, level),
  deploy: (slotKey, t) => ATTACH_STATE.view.setDeploy(slotKey, t),
  stats: () => (ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {})
};

/* Отладочный хук: состояние сборки доступно из консоли и автотестов. */
window.__ATTACH_DEBUG = () => ({
  weapon: "mp5a3",
  config: ATTACH_STATE.config,
  modules: ATTACH_STATE.asm ? Object.keys(ATTACH_STATE.asm.modules) : [],
  parts: ATTACH_STATE.asm ? ATTACH_STATE.asm.parts.length : 0,
  errors: ATTACH_STATE.asm ? ATTACH_STATE.asm.errors : [],
  warnings: ATTACH_STATE.asm ? ATTACH_STATE.asm.warnings : [],
  stats: ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {}
});

/* Управление с клавиатуры: TAB — панель, цифры — слот, стрелки — перебор. */
function attachBindKeys(onChange) {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const ui = ATTACH_STATE.ui;
    if (e.code === 'Tab') { e.preventDefault(); if (ui) ui.toggle(!ui.visible()); return; }
    if (e.code === 'KeyL') { ATTACH_STATE.toggles.light = ATTACH_STATE.toggles.light ? 0 : 1;
      ATTACH_STATE.view.setBeam('light', ATTACH_STATE.toggles.light); return; }
    if (e.code === 'KeyK') { ATTACH_STATE.toggles.laser = ATTACH_STATE.toggles.laser ? 0 : 1;
      ATTACH_STATE.view.setBeam('laser', ATTACH_STATE.toggles.laser); return; }
    if (e.code === 'KeyB') {
      for (const sk in ATTACH_STATE.asm.modules) {
        const m = ATTACH_STATE.asm.modules[sk];
        if (!(m.meta.deploy || m.meta.fold || m.meta.flipAxis)) continue;
        const cur = ATTACH_STATE.toggles.deploy[sk] || 0;
        const next = cur > 0.5 ? 0 : 1;
        ATTACH_STATE.toggles.deploy[sk] = next;
        ATTACH_STATE.view.setDeploy(sk, next);
      }
      return;
    }
    if (!ui || !ui.visible()) return;
    const slots = attachSlots();
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= slots.length) { ui.setActive(slots[n - 1].key); return; }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      const act = ui.getActive();
      if (!act) return;
      e.preventDefault();
      const opts = attachOptionsFor(act).filter((o) => o.fits);
      const cur = ATTACH_STATE.config[act] || null;
      let i = opts.findIndex((o) => o.key === cur);
      if (i < 0) i = 0;
      i = (i + (e.code === 'ArrowRight' ? 1 : opts.length - 1)) % opts.length;
      onChange(act, opts[i].key);
      ui.render();
    }
  });
}

	}

	return buildRear(root, reg, frame);
}

/* ====================================================================== */
function recRing(sc, cy, inset) {
	const hw = 21 * sc, hh = 24 * sc, rt = 15 * sc, rb = 8 * sc;
	const pts = [];
	const yBot = -hh + rb, yTop = hh - rt, NY = 9;
	for (let i = 0; i <= NY; i++) pts.push([hw, yBot + (yTop - yBot) * i / NY]);
	pts.push(...arcPts(hw - rt, hh - rt, rt, 0, Math.PI / 2, 7).slice(1));
	pts.push(...arcPts(-hw + rt, hh - rt, rt, Math.PI / 2, Math.PI, 7).slice(1));
	for (let i = NY; i >= 0; i--) pts.push([-hw, yBot + (yTop - yBot) * i / NY]);
	pts.push(...arcPts(-hw + rb, -hh + rb, rb, Math.PI, Math.PI * 1.5, 5).slice(1));
	pts.push(...arcPts(hw - rb, -hh + rb, rb, Math.PI * 1.5, Math.PI * 2, 5).slice(1, -1));
	const out = pts.map(p => [p[0], p[1] + cy]);
	return inset ? offsetPoly(out, inset) : out;
}

		const btn = root.child('magButton', { pos: [21, -34, 143] });
		reg.magButton = btn;
		btn.put('black', cyl(5.5, 5.5, 7, 18, 0.6), { r: [0, 0, 90 * D2R] });
	}

	return buildMoving(root, reg, frame);
}

/* ====================================================================== */
function buildMoving(root, reg, frame) {

	/* ====================================================== COCKING HANDLE */
	{
		const g = root.child('chargingHandle', { pos: [-19.5, 19.5, -134] });
		reg.chargingHandle = g;
		const d = 45 * D2R, ux = -Math.sin(d), uy = Math.cos(d);
		g.put('steel', cyl(8.2, 8.2, 30, 22, 0.5), { r: [90 * D2R, 0, 0] });           // sleeve inside the tube
		g.put('black', extrude([[-5.5, 0], [5.5, 0], [4.4, 22], [-4.4, 22]], 13, 0.6), { p: [ux * 8, uy * 8, 0], r: [0, 0, d] });
		g.put('black', lathe([[0, -13], [5.5, -13], [7.4, -10], [7.4, 9], [6.2, 13], [0, 13]], 22), { p: [ux * 29, uy * 29, 0], r: [90 * D2R, 0, 0] });
		for (let k = 0; k < 14; k++)                                                    // knurled grip ring
			g.put('black', box(1.0, 1.0, 14, 0.2), { p: [ux * 29 + Math.sin(k * 25.7 * D2R) * 7.2, uy * 29 + Math.cos(k * 25.7 * D2R) * 7.2, 0], r: [0, 0, k * 25.7 * D2R] });
		g.put('black', lathe([[0, 0], [7.4, 0], [7.4, 2.4], [0, 2.4]], 22), { p: [ux * 29, uy * 29, 12 ], r: [90 * D2R, 0, 0] });  // flat slap face
	}

	/* ============================================================ BOLT GROUP */
	{
		const g = root.child('bolt');
		reg.bolt = g;
		g.put('steel', lathe([[0, -44], [9.4, -44], [9.4, -8], [13.0, -6], [13.0, 74], [9.0, 76], [9.0, 100], [0, 100]], 26), { r: [-90 * D2R, 0, 0] });
		g.put('black', lathe([[3.2, -44.2], [8.6, -44.2], [8.6, -42], [3.2, -42]], 24), { r: [-90 * D2R, 0, 0] });   // bolt face recess
		g.put('steel', cyl(1.1, 1.1, 2, 10), { p: [0, 0, 8], r: [90 * D2R, 0, 0] });        // firing pin
		for (const sx of [-1, 1]) g.put('steel', cyl(3.4, 3.4, 7.4, 16, 0.4), { p: [sx * 8.6, 0, 26] });  // delay rollers
		g.put('steel', extrude([[0, 0], [4, 0], [4, 12], [1.5, 12]], 4, 0.3), { p: [8.5, 7.5, 22], r: [0, 90 * D2R, 0] });   // extractor claw
		g.put('steel', box(7, 4, 16, 0.6), { p: [0, 12.5, 96] });                            // carrier rail
	}

	/* =============================================================== TRIGGER */
	{
		const g = root.child('trigger', { pos: [0, -34, 214] });
		reg.trigger = g;
		g.put('steel', extrude([[4, 3], [-4, 3], [-8, -6], [-8.5, -17], [-5, -24], [0.5, -22], [-1.5, -12], [1, -3], [4, -1]], 7.5, 0.9), { r: [0, -90 * D2R, 0] });
		g.put('steel', cyl(3.2, 3.2, 9, 14, 0.3), { r: [0, 0, 90 * D2R] });
	}

	/* ============================================================== SELECTOR */
	{
		for (const sx of [-1, 1]) {
			const g = root.child(sx < 0 ? 'selectorL' : 'selectorR', { pos: [sx * 19.5, -34, 228] });
			reg[sx < 0 ? 'selectorL' : 'selectorR'] = g;
			g.put('black', cyl(7.6, 7.6, 4.5, 20, 0.5), { p: [sx * 2.2, 0, 0], r: [0, 0, 90 * D2R] });
			g.put('black', extrude([[-5.5, 0], [5.5, 0], [6.5, -14], [4.5, -21], [-4.5, -21], [-6.5, -14]], 4.5, 0.8), { p: [sx * 2.2, 0, 0], r: [0, -90 * D2R, 0] });
			g.put('black', box(11, 3.2, 5, 0.6), { p: [sx * 4.6, -19, 0] });
		}
		// HK Navy pictograms: 0 / 1 / 3 / auto, stamped white on the housing
		const hs = frame.child('selectorMarks');
		// 12.4 mm arc swept forward-down from the spindle, so every glyph lands
		// on the polymer wall (top edge y = -26, rear edge z = 240), not in air
		const marks = [[-30, 0], [4, 1], [38, 3], [72, 5]];
		for (const sx of [-1, 1]) for (const [deg, n] of marks) {
			const a = deg * D2R, rr = 12.4, cnt = Math.max(n, 1);
			const cy = -34 - Math.cos(a) * rr, cz = 228 - Math.sin(a) * rr;
			const ty = -Math.sin(a), tz = Math.cos(a);
			for (let k = 0; k < cnt; k++) {
				const off = (k - (cnt - 1) / 2) * 1.9;
				hs.put(n === 0 ? 'red' : 'white',
					box(0.55, n === 0 ? 3.6 : 2.6, n === 0 ? 1.2 : 0.85, 0),
					{ p: [sx * 18.85, cy + ty * off, cz + tz * off], r: [a, 0, 0] });
			}
			if (n === 0) hs.put('red', box(0.55, 1.1, 5.0, 0), { p: [sx * 18.85, cy, cz], r: [a + 38 * D2R, 0, 0] });
		}
	}

	/* ============================================================= MAGAZINE */
	{
		const g = root.child('magazine', { pos: [0, -14, 118] });
		reg.magazine = g;
		const R = 430, N = 12, aMax = 0.40;
		const pt = (a, u, v) => [u, -R * Math.sin(a) + v * -Math.sin(a), -R * (1 - Math.cos(a)) + v * Math.cos(a)];
		const secs = [];
		for (let i = 0; i <= N; i++) {
			const a = aMax * i / N, w = 31.5, d = 21.5 - (i === N ? 0.6 : 0);
			secs.push(roundRectPoly(w, d, 4.5, 4).map(([u, v]) => pt(a, u, v)));
		}
		g.put('park', loft(secs, { closed: true, crease: 40 }));
		g.put('park', extrude(roundRectPoly(31.5, 21.5, 4.5, 4), 1.5, 0.4), { p: pt(0, 0, 0), r: [0, 0, 0] });
		// floorplate
		const aE = aMax;
		g.put('park', box(35, 5.5, 26, 1.0), { p: pt(aE + 0.008, 0, 0), r: [-aE, 0, 0] });
		g.put('poly', box(31, 3.0, 22, 0.8), { p: pt(aE + 0.022, 0, 0), r: [-aE, 0, 0] });
		// pressed ribs down the front and back faces: overlapping segments so
		// the ridge reads as one continuous line instead of a row of dashes
		for (let i = 0; i <= N * 2; i++) {
			const a = aMax * i / (N * 2);
			g.put('park', box(4.2, 20, 1.1, 0.35), { p: pt(a, 0, -10.9), r: [-a, 0, 0] });
			g.put('park', box(4.2, 20, 1.1, 0.35), { p: pt(a, 0, 10.9), r: [-a, 0, 0] });
		}
		// witness holes down the right flank
		for (let i = 0; i < 5; i++) {
			const a = aMax * (0.12 + i * 0.17);
			g.put('black', cyl(2.1, 2.1, 1.4, 12), { p: pt(a, 15.7, 0), r: [0, 0, 90 * D2R] });
		}
		// catch notch + feed lips + top cartridge
		g.put('park', box(9, 4, 5, 0.6), { p: [0, -3, 11.5] });
		for (const sx of [-1, 1]) g.put('park', box(4, 7, 20, 0.6), { p: [sx * 13.8, 3.5, 0] });
		const rnd = g.child('topRound', { pos: [0, 2.2, 0] });
		reg.topRound = rnd;
		cartridge(rnd, 'live');
	}

	/* ================================================== RETRACTABLE STOCK A3 */
	{
		const g = root.child('stock');
		reg.stock = g;
		for (const sx of [-1, 1]) {
			g.put('park', cyl(6.4, 6.4, 226, 20, 0.8), { p: [sx * 27.5, -18, 180], r: [90 * D2R, 0, 0] });
			g.put('park', cyl(7.6, 7.6, 7, 18, 0.5), { p: [sx * 27.5, -18, 80], r: [90 * D2R, 0, 0] });   // travel stop
		}
		g.put('park', box(66, 13, 12, 1.4), { p: [0, -18, 286] });                                       // rear yoke
		
		// A3 butt cap: 40 x 48 mm, centred on the strut plane and overlapping
		// both tubes and the yoke, so nothing hangs off the back in mid air
		const bp = g.child('buttplate', { pos: [0, -18, 295], rot: [-3 * D2R, 0, 0] });
		reg.buttplate = bp;
		bp.put('park', extrude(roundRectPoly(40, 48, 9, 4), 11, 1.2), { p: [0, 0, 1] });
		bp.put('park', box(30, 15, 10, 1.0), { p: [0, 0, -4.5] });
		bp.put('rubber', extrude(roundRectPoly(38, 46, 9, 4), 6, 1.6), { p: [0, 0, 9] });
		for (const sy of [-1, 1]) bp.put('rubber', box(34, 1.8, 2.6, 0.5), { p: [0, sy * 12, 12.3] });
		bp.put('park', torus(7.0, 2.0, 20, 10), { p: [0, -26, 2], r: [90 * D2R, 0, 0] });
		// release latch on the left strut
		const latch = g.child('stockLatch', { pos: [-27.5, -21.5, 258] });
		reg.stockLatch = latch;
		latch.put('black', extrude([[-14, 0], [14, 0], [12, -7], [-12, -7]], 6, 0.6), { r: [0, -90 * D2R, 0] });
	}

	return { root, reg };
}

/** 9x19 mm Parabellum — live round or fired case */
function cartridge(node, kind) {
	const L = 19.15;
	node.put('brass', lathe([[0, 0], [4.85, 0], [4.96, 0.9], [4.96, 2.4], [4.4, 2.4], [4.4, 1.2],
		[4.55, 3.0], [4.62, L - 1.5], [4.55, L], [4.3, L], [4.3, 3.0]], 22), { r: [-90 * D2R, 0, 0] });
	if (kind === 'live') {
		node.put('copper', lathe([[0, L - 1.0], [4.4, L - 1.0], [4.5, L], [4.5, L + 5.5],
			[4.1, L + 8.5], [3.0, L + 10.4], [1.4, L + 11.4], [0, L + 11.6]], 22), { r: [-90 * D2R, 0, 0] });
	} else {
		node.put('black', lathe([[0, L - 0.6], [4.3, L - 0.6], [4.3, L - 0.2], [0, L - 0.2]], 20), { r: [-90 * D2R, 0, 0] });
	}
	node.put('brass', lathe([[0, 0.2], [2.2, 0.2], [2.2, 0.5], [0, 0.5]], 18), { r: [-90 * D2R, 0, 0] });  // primer
	return node;
}

/* ======================= src/audio.mjs ======================= */
// ============================================================================
//  audio.mjs — offline-rendered procedural gun audio.
//
//  Everything is synthesised sample-by-sample into AudioBuffers ONCE, at the
//  first user gesture, and then played back as one-shots. Nothing is built
//  from long-decaying sine oscillators, because that is exactly what makes
//  a gun sound like a toy bell. The building blocks are:
//
//    · noise excitation  — brown/white noise shaped by a state-variable
//                          filter whose cutoff can sweep inside the event
//    · modal impacts     — 2-pole resonators with a SHORT T60 (8…60 ms),
//                          struck with a 0.3 ms noise pulse. Real steel
//                          parts hitting each other ring for a few tens of
//                          milliseconds, no longer.
//    · blast model       — 0.4 ms overpressure spike, a broadband body that
//                          decays in ~25 ms, a 55 ms low thump and a room
//                          tail. Tanh saturation adds the crunch of a mic
//                          being slammed by 160 dB.
//    · mechanics         — the roller-delayed action is audible BEHIND the
//                          report: unlock (4 ms), carrier to the buffer
//                          (26 ms), return and lock-up (58 ms).
//
//  Every buffer is rendered in a few variants so full-auto never phases.
// ============================================================================

/* --------------------------------------------------------- tiny utilities */
function mulberry(seed) {
	let s = seed >>> 0;
	return function () {
		s = (s + 0x6D2B79F5) | 0;
		let t = Math.imul(s ^ (s >>> 15), 1 | s);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}
const dbg = db => Math.pow(10, db / 20);

/* ==========================================================================
   Canvas: a stereo scratch buffer with the primitives used by every sound.
   ========================================================================== */
class Canvas2 {
	constructor(sr, seconds, rnd) {
		this.sr = sr;
		this.n = Math.ceil(sr * seconds);
		this.l = new Float32Array(this.n);
		this.r = new Float32Array(this.n);
		this.rnd = rnd || Math.random;
	}
	_pan(p) {                                   // equal-power pan
		const a = (Math.max(-1, Math.min(1, p || 0)) + 1) * Math.PI / 4;
		return [Math.cos(a), Math.sin(a)];
	}

	/* ---- filtered noise burst; cutoff may sweep, envelope is exponential -- */
	noise(o) {
		const sr = this.sr, rnd = this.rnd;
		const i0 = Math.max(0, Math.floor((o.t || 0) * sr));
		const dur = Math.max(0.001, o.dur || 0.05);
		const len = Math.min(this.n - i0, Math.ceil(dur * sr));
		if (len <= 0) return this;
		const atk = Math.max(1, Math.floor((o.atk === undefined ? 0.0006 : o.atk) * sr));
		const tau = (o.tau === undefined ? dur * 0.28 : o.tau) * sr;
		const tau2 = (o.tau2 || 0) * sr;                 // optional slow tail
		const mix2 = o.mix2 || 0;
		const g = o.gain === undefined ? 0.5 : o.gain;
		const f0 = o.f0 || 1200, f1 = o.f1 === undefined ? f0 : o.f1;
		const q = o.q === undefined ? 0.9 : o.q;
		const type = o.type || 'bp';
		const brown = o.brown || 0;
		const [pl, pr] = this._pan(o.pan);
		let lp = 0, bp = 0, bn = 0;
		const k = 1 / q;
		for (let i = 0; i < len; i++) {
			const x = i / len;
			let w = rnd() * 2 - 1;
			if (brown) { bn = (bn + brown * w) / (1 + brown); w = w * (1 - brown) + bn * 3.2 * brown; }
			// state-variable filter, cutoff swept exponentially f0 -> f1
			const fc = f0 * Math.pow(f1 / f0, x);
			const f = 2 * Math.sin(Math.PI * Math.min(fc, sr * 0.45) / sr);
			const hp = w - lp - k * bp;
			bp += f * hp;
			lp += f * bp;
			const y = type === 'lp' ? lp : type === 'hp' ? hp : type === 'bp' ? bp : w;
			let env = i < atk ? i / atk : Math.exp(-(i - atk) / tau);
			if (mix2) env = env * (1 - mix2) + mix2 * (i < atk ? i / atk : Math.exp(-(i - atk) / (tau2 || tau)));
			const s = y * env * g;
			const j = i0 + i;
			this.l[j] += s * pl;
			this.r[j] += s * pr * (o.wide ? (1 + (rnd() - 0.5) * 0.5) : 1);
		}
		return this;
	}

	/* ---- modal impact: short noise pulse through N damped resonators ------ */
	impact(o) {
		const sr = this.sr, rnd = this.rnd;
		const i0 = Math.max(0, Math.floor((o.t || 0) * sr));
		const modes = o.modes || [[900, 0.02, 1]];
		const g = o.gain === undefined ? 0.4 : o.gain;
		const exc = Math.max(2, Math.floor((o.exc === undefined ? 0.0006 : o.exc) * sr));
		const [pl, pr] = this._pan(o.pan);
		const spread = o.spread === undefined ? 0.03 : o.spread;
		// excitation: very short noise pulse (the strike itself)
		const pulse = new Float32Array(exc);
		for (let i = 0; i < exc; i++) pulse[i] = (rnd() * 2 - 1) * (1 - i / exc);
		for (const [fRaw, t60, aRaw] of modes) {
			const f = fRaw * (1 + (rnd() - 0.5) * spread);
			if (f > sr * 0.45) continue;
			const a = aRaw === undefined ? 1 : aRaw;
			const len = Math.min(this.n - i0, Math.ceil(t60 * 1.6 * sr) + exc);
			if (len <= 0) continue;
			const w = 2 * Math.PI * f / sr;
			const rr = Math.exp(-6.9078 / (t60 * sr));    // ln(1000)/T60
			const c1 = 2 * rr * Math.cos(w), c2 = -rr * rr;
			let y1 = 0, y2 = 0;
			for (let i = 0; i < len; i++) {
				const x = i < exc ? pulse[i] : 0;
				const y = x + c1 * y1 + c2 * y2;
				y2 = y1; y1 = y;
				const s = y * a * g * (1 - rr) * 4;
				const j = i0 + i;
				this.l[j] += s * pl;
				this.r[j] += s * pr;
			}
		}
		// the contact click itself — broadband, 1 ms, this is what sells "steel"
		if (o.click !== 0) this.noise({
			t: o.t, dur: 0.004, atk: 0.00008, tau: 0.0006, f0: o.clickF || 5200,
			f1: (o.clickF || 5200) * 0.35, q: 0.6, type: 'bp', gain: g * (o.click || 0.9), pan: o.pan,
		});
		return this;
	}

	/* ---- low body: pitch-dropping sine, always short (punch, never bell) -- */
	thump(o) {
		const sr = this.sr;
		const i0 = Math.max(0, Math.floor((o.t || 0) * sr));
		const dur = o.dur || 0.06;
		const len = Math.min(this.n - i0, Math.ceil(dur * sr));
		const f0 = o.f0 || 110, f1 = o.f1 === undefined ? f0 * 0.5 : o.f1;
		const g = o.gain === undefined ? 0.4 : o.gain;
		const tau = (o.tau || dur * 0.3) * sr;
		const atk = Math.max(1, Math.floor((o.atk || 0.0008) * sr));
		const [pl, pr] = this._pan(o.pan);
		let ph = 0;
		for (let i = 0; i < len; i++) {
			const x = i / len;
			const f = f0 * Math.pow(f1 / f0, x);
			ph += 2 * Math.PI * f / sr;
			const env = (i < atk ? i / atk : Math.exp(-(i - atk) / tau));
			const s = Math.sin(ph) * env * g;
			const j = i0 + i;
			this.l[j] += s * pl;
			this.r[j] += s * pr;
		}
		return this;
	}

	/* ---- sliding steel: noise through a moving comb + light amplitude grain */
	rasp(o) {
		const sr = this.sr, rnd = this.rnd;
		const i0 = Math.max(0, Math.floor((o.t || 0) * sr));
		const dur = o.dur || 0.2;
		const len = Math.min(this.n - i0, Math.ceil(dur * sr));
		const g = o.gain === undefined ? 0.25 : o.gain;
		const f0 = o.f0 || 700, f1 = o.f1 || 2200;
		const [pl, pr] = this._pan(o.pan);
		const dl = new Float32Array(1024);
		let wi = 0, lp = 0, bp = 0;
		const grainHz = o.grain || 260;
		for (let i = 0; i < len; i++) {
			const x = i / len;
			const w = rnd() * 2 - 1;
			const fc = f0 * Math.pow(f1 / f0, x);
			const f = 2 * Math.sin(Math.PI * Math.min(fc, sr * 0.45) / sr);
			const hp = w - lp - 0.8 * bp;
			bp += f * hp; lp += f * bp;
			// comb gives the "ribbed metal" character
			const d = 40 + Math.floor(60 * (1 - x));
			const ri = (wi - d + 1024) % 1024;
			const y = bp + dl[ri] * 0.55;
			dl[wi] = y; wi = (wi + 1) % 1024;
			const grain = 0.72 + 0.28 * Math.abs(Math.sin(i / sr * grainHz * 6.283));
			const env = Math.min(1, i / (sr * 0.012)) * Math.min(1, (len - i) / (sr * 0.02)) * (o.swell ? (0.35 + x) : 1);
			const s = y * env * grain * g;
			const j = i0 + i;
			this.l[j] += s * pl;
			this.r[j] += s * pr;
		}
		return this;
	}

	/* ---- baked early reflections: makes a dry shot sit in a real space ---- */
	room(taps, amount) {
		const sr = this.sr;
		const src = this.l.slice(), srcR = this.r.slice();
		for (const [ms, gain, pan] of taps) {
			const d = Math.floor(ms * 0.001 * sr);
			const [pl, pr] = this._pan(pan);
			let lpL = 0, lpR = 0;
			for (let i = d; i < this.n; i++) {
				lpL += 0.35 * (src[i - d] - lpL);        // reflections are duller
				lpR += 0.35 * (srcR[i - d] - lpR);
				this.l[i] += lpL * gain * amount * pl * 1.4;
				this.r[i] += lpR * gain * amount * pr * 1.4;
			}
		}
		return this;
	}

	/* ---- tanh drive; a real muzzle blast always clips something ---------- */
	drive(k, from, to) {
		const i0 = Math.floor((from || 0) * this.sr), i1 = to ? Math.floor(to * this.sr) : this.n;
		const n = Math.tanh(k);
		for (let i = i0; i < i1; i++) {
			this.l[i] = Math.tanh(this.l[i] * k) / n;
			this.r[i] = Math.tanh(this.r[i] * k) / n;
		}
		return this;
	}

	/* ---- dc block + hard trim so nothing pops ---------------------------- */
	finish(peak) {
		let mx = 0;
		let dl = 0, dr = 0, xl = 0, xr = 0;
		for (let i = 0; i < this.n; i++) {
			const il = this.l[i], ir = this.r[i];
			dl = il - xl + 0.997 * dl; xl = il; this.l[i] = dl;
			dr = ir - xr + 0.997 * dr; xr = ir; this.r[i] = dr;
			const a = Math.max(Math.abs(dl), Math.abs(dr));
			if (a > mx) mx = a;
		}
		const want = peak === undefined ? 0.92 : peak;
		if (mx > 0) {
			const k = want / mx;
			for (let i = 0; i < this.n; i++) { this.l[i] *= k; this.r[i] *= k; }
		}
		// 1 ms fade-out kills end-of-buffer clicks
		const f = Math.floor(this.sr * 0.002);
		for (let i = 0; i < f; i++) {
			const k = i / f, j = this.n - 1 - i;
			this.l[j] *= k; this.r[j] *= k;
		}
		return this;
	}
}

/* ==========================================================================
   The sound bank. Each entry returns an array of variants.
   ========================================================================== */
const BANK = {

	/* ------------------------------------------------------------- gunshot */
	// 9x19 from a 225 mm barrel: ~390 m/s, so there IS a supersonic crack,
	// but the dominant character is the flat, dry SLAP of a submachine gun
	// fired indoors, immediately followed by the roller-delayed action.
	shot(sr, seed, opt) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 1.15, rnd);
		const v = 0.94 + rnd() * 0.12;

		// 1. overpressure spike — 0.35 ms, this is the "snap" that reads as rifle
		c.noise({ t: 0, dur: 0.0035, atk: 0.00004, tau: 0.00045, f0: 9000 * v, f1: 4200, q: 0.5, type: 'hp', gain: 1.0 });
		// 2. supersonic crack
		c.noise({ t: 0.0004, dur: 0.010, atk: 0.00008, tau: 0.0016, f0: 5200 * v, f1: 1800, q: 0.9, gain: 0.85 });
		// 3. blast body — broadband, sweeping down, 25 ms core + 90 ms tail
		c.noise({ t: 0.0006, dur: 0.20, atk: 0.0004, tau: 0.022, tau2: 0.085, mix2: 0.35, f0: 6400 * v, f1: 420, q: 0.75, type: 'lp', gain: 0.95, brown: 0.15, wide: true });
		c.noise({ t: 0.0008, dur: 0.09, atk: 0.0003, tau: 0.012, f0: 1500 * v, f1: 700, q: 1.4, gain: 0.55 });
		// 4. muzzle-gas low body — short, this is punch not boom
		c.thump({ t: 0.0005, f0: 128 * v, f1: 52, dur: 0.075, tau: 0.016, gain: 0.62 });
		c.thump({ t: 0.0015, f0: 62, f1: 38, dur: 0.11, tau: 0.028, gain: 0.24 });
		// 5. stamped receiver shell answering the shot (very short T60)
		c.impact({ t: 0.0012, gain: 0.11, pan: 0, click: 0, modes: [[1830, 0.012, 1], [2670, 0.008, 0.6], [3910, 0.006, 0.35]] });
		// 6. the action — audible behind the report
		mech(c, 0.004, opt && opt.auto ? 0.62 : 0.5, 0.1, rnd);
		// 7. room
		c.room([[7, 0.30, -0.5], [13, 0.24, 0.55], [23, 0.18, -0.2], [37, 0.13, 0.3], [61, 0.09, 0], [97, 0.05, -0.35]], opt && opt.auto ? 0.75 : 1.0);
		c.noise({ t: 0.02, dur: 0.55, atk: 0.006, tau: 0.10, f0: 900, f1: 260, q: 0.5, type: 'lp', gain: 0.10, wide: true });
		c.drive(1.7);
		return c.finish(0.95);
	},

	/* --------------------------------------------- action cycle on its own */
	cycle(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.42, rnd);
		mech(c, 0, 1.0, 1.0, rnd);
		c.room([[9, 0.2, -0.3], [19, 0.14, 0.3]], 0.6);
		return c.finish(0.7);
	},

	/* ------------------------------------------------------------ dry fire */
	dry(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.28, rnd);
		c.impact({ t: 0, gain: 0.5, clickF: 4200, modes: [[2350, 0.010, 1], [3400, 0.006, 0.5], [980, 0.016, 0.7]] });
		c.thump({ t: 0.0008, f0: 190, f1: 110, dur: 0.035, tau: 0.008, gain: 0.22 });
		c.noise({ t: 0.001, dur: 0.03, atk: 0.0002, tau: 0.006, f0: 1700, f1: 700, q: 1.1, gain: 0.18 });
		c.room([[8, 0.16, 0], [17, 0.1, 0.2]], 0.5);
		return c.finish(0.7);
	},

	/* ------------------------------------------------- trigger press/reset */
	trigPress(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.09, rnd);
		c.impact({ t: 0, gain: 0.13, clickF: 3800, click: 0.7, modes: [[3100, 0.004, 1], [1500, 0.005, 0.5]] });
		return c.finish(0.35);
	},
	trigReset(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.09, rnd);
		c.impact({ t: 0, gain: 0.11, clickF: 5200, click: 0.8, modes: [[4200, 0.003, 1], [2100, 0.004, 0.4]] });
		return c.finish(0.3);
	},

	/* ---------------------------------------------------- selector detent */
	selector(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.2, rnd);
		c.noise({ t: 0, dur: 0.012, atk: 0.0004, tau: 0.003, f0: 2400, f1: 900, q: 1.2, gain: 0.16, pan: -0.25 });
		c.impact({ t: 0.010, gain: 0.42, pan: -0.25, clickF: 4400, modes: [[1950, 0.012, 1], [2830, 0.008, 0.55], [820, 0.018, 0.5]] });
		c.thump({ t: 0.010, f0: 210, f1: 130, dur: 0.03, tau: 0.007, gain: 0.14, pan: -0.25 });
		c.room([[9, 0.14, 0]], 0.4);
		return c.finish(0.62);
	},

	/* ------------------------------------------------------------- reload */
	magRelease(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.2, rnd);
		c.impact({ t: 0, gain: 0.34, pan: -0.1, clickF: 3600, modes: [[1450, 0.014, 1], [2280, 0.009, 0.5], [700, 0.02, 0.6]] });
		c.noise({ t: 0.002, dur: 0.03, atk: 0.001, tau: 0.008, f0: 1200, f1: 500, q: 1.0, gain: 0.12, pan: -0.1 });
		return c.finish(0.55);
	},

	magOut(sr, seed) {                        // steel magazine sliding out of the well
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.3, rnd);
		c.rasp({ t: 0, dur: 0.105, f0: 1500, f1: 620, gain: 0.20, pan: -0.08, grain: 340 });
		c.noise({ t: 0, dur: 0.11, atk: 0.004, tau: 0.05, f0: 700, f1: 300, q: 0.8, type: 'lp', gain: 0.13, pan: -0.08 });
		c.impact({ t: 0.098, gain: 0.16, pan: -0.08, clickF: 2600, click: 0.5, modes: [[860, 0.016, 1], [1420, 0.01, 0.5]] });
		return c.finish(0.5);
	},

	magFloor(sr, seed) {                      // 30-round steel mag hitting concrete
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.85, rnd);
		const hit = (t, g, f) => {
			c.impact({
				t, gain: g, pan: -0.12 + (rnd() - 0.5) * 0.2, clickF: 3400, spread: 0.06,
				modes: [[f, 0.030, 1], [f * 1.63, 0.020, 0.55], [f * 2.41, 0.013, 0.3], [f * 3.9, 0.008, 0.15]],
			});
			c.thump({ t, f0: 150, f1: 70, dur: 0.05, tau: 0.011, gain: g * 0.8 });
			c.noise({ t, dur: 0.05, atk: 0.0002, tau: 0.008, f0: 3000, f1: 900, q: 0.7, gain: g * 0.5 });
		};
		hit(0, 0.55, 330);
		hit(0.098 + rnd() * 0.02, 0.24, 405);
		hit(0.171 + rnd() * 0.02, 0.11, 470);
		hit(0.223 + rnd() * 0.02, 0.05, 520);
		c.room([[11, 0.28, -0.4], [23, 0.2, 0.4], [41, 0.14, 0], [77, 0.08, 0.2]], 1.0);
		return c.finish(0.75);
	},

	magIn(sr, seed) {                         // guide in, seat, tug-check
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.45, rnd);
		c.rasp({ t: 0, dur: 0.085, f0: 600, f1: 1700, gain: 0.17, pan: -0.06, swell: true });
		c.impact({ t: 0.088, gain: 0.62, pan: -0.06, clickF: 4000, modes: [[520, 0.030, 1], [980, 0.018, 0.7], [1720, 0.011, 0.4], [2900, 0.007, 0.2]] });
		c.thump({ t: 0.088, f0: 165, f1: 72, dur: 0.075, tau: 0.016, gain: 0.42 });
		c.impact({ t: 0.105, gain: 0.22, pan: -0.06, clickF: 5200, click: 0.7, modes: [[1980, 0.010, 1], [3300, 0.006, 0.4]] });   // catch snaps over
		c.impact({ t: 0.30, gain: 0.13, pan: -0.06, clickF: 2400, click: 0.5, modes: [[720, 0.014, 1], [1180, 0.009, 0.4]] });     // tug
		c.room([[9, 0.22, -0.3], [19, 0.15, 0.3], [37, 0.1, 0]], 0.8);
		return c.finish(0.8);
	},

	/* --------------------------------------------------- charging handle */
	chargeBack(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.45, rnd);
		c.rasp({ t: 0, dur: 0.155, f0: 380, f1: 1500, gain: 0.30, pan: -0.3, grain: 190, swell: true });
		c.noise({ t: 0.005, dur: 0.16, atk: 0.012, tau: 0.09, f0: 2400, f1: 4600, q: 0.6, type: 'hp', gain: 0.09, pan: -0.3 });
		// recoil spring being compressed — a rising, slightly ringing wash
		for (let i = 0; i < 7; i++)
			c.impact({ t: 0.02 + i * 0.019, gain: 0.05 + i * 0.005, pan: -0.28, click: 0.4, spread: 0.25, modes: [[1300 + i * 190, 0.008, 1], [2400 + i * 240, 0.005, 0.4]] });
		// bolt group hits the rear buffer
		c.impact({ t: 0.163, gain: 0.66, pan: -0.26, clickF: 4200, modes: [[430, 0.032, 1], [790, 0.020, 0.65], [1310, 0.012, 0.4], [2250, 0.007, 0.2]] });
		c.thump({ t: 0.163, f0: 132, f1: 58, dur: 0.085, tau: 0.018, gain: 0.44 });
		c.room([[8, 0.24, -0.4], [17, 0.17, 0.3], [33, 0.1, 0]], 0.85);
		return c.finish(0.85);
	},

	notch(sr, seed) {                          // handle rotated up into the notch
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.2, rnd);
		c.impact({ t: 0, gain: 0.40, pan: -0.28, clickF: 4800, modes: [[2050, 0.010, 1], [3120, 0.006, 0.5], [1180, 0.014, 0.6]] });
		c.noise({ t: 0, dur: 0.02, atk: 0.0002, tau: 0.004, f0: 3200, f1: 1200, q: 0.9, gain: 0.16, pan: -0.28 });
		return c.finish(0.6);
	},

	boltHome(sr, seed) {                       // the famous HK CLACK
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.6, rnd);
		c.noise({ t: 0, dur: 0.028, atk: 0.0006, tau: 0.006, f0: 3400, f1: 1100, q: 0.8, gain: 0.34, pan: 0.05 });    // carrier running forward
		c.impact({ t: 0.022, gain: 0.95, pan: 0.05, clickF: 5200, modes: [[360, 0.038, 1], [700, 0.024, 0.7], [1180, 0.015, 0.45], [2050, 0.009, 0.25], [3300, 0.006, 0.12]] });
		c.thump({ t: 0.022, f0: 148, f1: 58, dur: 0.10, tau: 0.020, gain: 0.55 });
		c.impact({ t: 0.030, gain: 0.30, pan: 0.08, clickF: 6000, click: 0.6, modes: [[1650, 0.011, 1], [2400, 0.007, 0.4]] });   // rollers seating
		c.noise({ t: 0.026, dur: 0.09, atk: 0.001, tau: 0.02, f0: 900, f1: 320, q: 0.7, type: 'lp', gain: 0.12 });
		c.room([[8, 0.3, -0.4], [16, 0.22, 0.35], [31, 0.15, 0], [59, 0.08, 0.2]], 1.0);
		return c.finish(0.92);
	},

	slap(sr, seed) {                           // palm on the cocking lever
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.25, rnd);
		c.noise({ t: 0, dur: 0.05, atk: 0.0008, tau: 0.010, f0: 900, f1: 260, q: 0.7, type: 'lp', gain: 0.42, pan: -0.3 });
		c.thump({ t: 0, f0: 210, f1: 90, dur: 0.05, tau: 0.012, gain: 0.3, pan: -0.3 });
		c.impact({ t: 0.002, gain: 0.2, pan: -0.3, click: 0.5, clickF: 2600, modes: [[1250, 0.009, 1]] });
		return c.finish(0.65);
	},

	/* -------------------------------------------------------------- stock */
	stockBtn(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.15, rnd);
		c.impact({ t: 0, gain: 0.3, pan: -0.3, clickF: 3400, modes: [[1550, 0.010, 1], [2400, 0.006, 0.4]] });
		return c.finish(0.5);
	},
	stockSlide(sr, seed, opt) {
		const out = !opt || opt.out !== false;
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.6, rnd);
		c.rasp({ t: 0.01, dur: 0.20, f0: out ? 420 : 1100, f1: out ? 1300 : 420, gain: 0.26, pan: 0.16, grain: 150, swell: out });
		for (let i = 0; i < 5; i++)
			c.impact({ t: 0.03 + i * 0.036, gain: 0.05, pan: 0.16, click: 0.4, spread: 0.3, modes: [[900 + rnd() * 700, 0.007, 1]] });
		c.impact({ t: 0.215, gain: 0.60, pan: 0.14, clickF: 4200, modes: [[400, 0.030, 1], [760, 0.019, 0.6], [1320, 0.012, 0.35]] });
		c.thump({ t: 0.215, f0: 140, f1: 62, dur: 0.08, tau: 0.017, gain: 0.36 });
		c.room([[9, 0.22, 0.3], [18, 0.15, -0.3], [35, 0.09, 0]], 0.8);
		return c.finish(0.8);
	},

	/* -------------------------------------------- 9 mm brass on concrete */
	// Short, bright, noisy taps with a tiny bit of ring — NOT a sine bell.
	brass(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.9, rnd);
		const base = 2600 + rnd() * 1400;
		let t = 0, g = 0.5;
		const n = 4 + (rnd() * 3 | 0);
		for (let i = 0; i < n; i++) {
			const f = base * (1 + i * 0.06) * (0.9 + rnd() * 0.2);
			c.impact({
				t, gain: g, pan: 0.35 + rnd() * 0.25, clickF: 7000, click: 1.0, spread: 0.08,
				modes: [[f, 0.014, 1], [f * 1.57, 0.009, 0.5], [f * 2.3, 0.006, 0.25], [f * 0.44, 0.018, 0.35]],
			});
			c.noise({ t, dur: 0.012, atk: 0.0001, tau: 0.0022, f0: 8000, f1: 3000, q: 0.6, type: 'hp', gain: g * 0.55, pan: 0.4 });
			t += (0.055 + rnd() * 0.05) * (1 + i * 0.35);
			g *= 0.5 + rnd() * 0.12;
		}
		// final spin on the floor
		for (let i = 0; i < 9; i++)
			c.impact({ t: t + i * (0.026 - i * 0.0018), gain: 0.035 * Math.pow(0.82, i), pan: 0.45, click: 1, clickF: 9000, modes: [[base * 1.2, 0.006, 1]] });
		c.room([[13, 0.16, 0.4], [27, 0.1, -0.2]], 0.7);
		return c.finish(0.5);
	},

	/* --------------------------------------------------- downrange impacts */
	/* ------------------------------------- rear sight drum detent (small) */
	drumClick(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.14, rnd);
		c.impact({ t: 0, gain: 0.26, pan: 0.1, clickF: 5600, click: 0.8, spread: 0.05,
			modes: [[2950, 0.008, 1], [4400, 0.005, 0.45], [6900, 0.003, 0.2]] });
		c.noise({ t: 0, dur: 0.006, atk: 0.00006, tau: 0.0012, f0: 6800, f1: 2400, q: 0.7, type: 'hp', gain: 0.12, pan: 0.1 });
		return c.finish(0.42);
	},

	/* ------------------- a single case bouncing once, for the case physics */
	brassTap(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.3, rnd);
		const f = 2500 + rnd() * 1600;
		c.impact({ t: 0, gain: 0.55, pan: 0.3, clickF: 7600, click: 1.0, spread: 0.09,
			modes: [[f, 0.013, 1], [f * 1.6, 0.008, 0.5], [f * 2.35, 0.005, 0.22], [f * 0.45, 0.017, 0.32]] });
		c.noise({ t: 0, dur: 0.010, atk: 0.00008, tau: 0.0018, f0: 8600, f1: 3200, q: 0.6, type: 'hp', gain: 0.3, pan: 0.3 });
		c.room([[12, 0.14, 0.35], [26, 0.08, -0.2]], 0.6);
		return c.finish(0.45);
	},

	hitSteel(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 1.4, rnd);
		c.noise({ t: 0, dur: 0.02, atk: 0.00006, tau: 0.0025, f0: 8000, f1: 2600, q: 0.6, type: 'hp', gain: 0.7 });
		const f = 620 + rnd() * 260;
		c.impact({                                    // a hanging plate really does ring
			t: 0, gain: 0.85, clickF: 6000, spread: 0.05,
			modes: [[f, 0.55, 1], [f * 1.59, 0.42, 0.6], [f * 2.14, 0.3, 0.35], [f * 3.01, 0.22, 0.2], [f * 4.3, 0.15, 0.1], [f * 0.5, 0.6, 0.3]],
		});
		c.thump({ t: 0, f0: 240, f1: 120, dur: 0.09, tau: 0.02, gain: 0.3 });
		c.finish(0.8);
		return c;
	},
	hitDirt(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.5, rnd);
		c.noise({ t: 0, dur: 0.13, atk: 0.0006, tau: 0.022, f0: 2200, f1: 240, q: 0.7, type: 'lp', gain: 0.7, brown: 0.3 });
		c.thump({ t: 0, f0: 170, f1: 70, dur: 0.09, tau: 0.02, gain: 0.4 });
		c.noise({ t: 0.01, dur: 0.22, atk: 0.004, tau: 0.05, f0: 900, f1: 300, q: 0.5, type: 'lp', gain: 0.12 });
		return c.finish(0.6);
	},

	/* --------------------------------------------------------- misc foley */
	clothShift(sr, seed) {
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.35, rnd);
		c.noise({ t: 0, dur: 0.22, atk: 0.03, tau: 0.06, f0: 1800, f1: 700, q: 0.5, type: 'bp', gain: 0.09, brown: 0.5 });
		return c.finish(0.3);
	},
	safetyBlock(sr, seed) {                    // trigger against a locked sear
		const rnd = mulberry(seed);
		const c = new Canvas2(sr, 0.12, rnd);
		c.impact({ t: 0, gain: 0.16, clickF: 2400, click: 0.6, modes: [[1150, 0.006, 1], [640, 0.008, 0.5]] });
		return c.finish(0.4);
	},
};

/* the roller-delayed action, shared by shot() and cycle() ------------------ */
function mech(c, t0, g, roomAmt, rnd) {
	// unlock: rollers cammed out of the trunnion recesses
	c.noise({ t: t0, dur: 0.014, atk: 0.0002, tau: 0.003, f0: 2600, f1: 1200, q: 1.3, gain: 0.16 * g, pan: 0.12 });
	// carrier accelerating rearwards — spring wash
	c.noise({ t: t0 + 0.006, dur: 0.028, atk: 0.002, tau: 0.010, f0: 1500, f1: 3200, q: 0.7, gain: 0.09 * g, pan: 0.1 });
	// carrier bottoms out on the buffer (~26 ms after ignition)
	c.impact({ t: t0 + 0.026, gain: 0.42 * g, pan: 0.14, clickF: 4200, modes: [[420, 0.026, 1], [820, 0.016, 0.6], [1380, 0.010, 0.35], [2400, 0.006, 0.18]] });
	c.thump({ t: t0 + 0.026, f0: 118, f1: 56, dur: 0.06, tau: 0.013, gain: 0.26 * g });
	// spring returning
	c.noise({ t: t0 + 0.034, dur: 0.026, atk: 0.003, tau: 0.009, f0: 2600, f1: 1300, q: 0.8, gain: 0.07 * g, pan: 0.06 });
	// feed + lock-up clack (~58 ms)
	c.impact({ t: t0 + 0.052, gain: 0.20 * g, pan: 0.02, clickF: 3600, click: 0.6, modes: [[980, 0.012, 1], [1620, 0.008, 0.5]] });
	c.impact({ t: t0 + 0.062, gain: 0.46 * g, pan: 0.06, clickF: 5200, modes: [[560, 0.022, 1], [1060, 0.014, 0.6], [1840, 0.009, 0.35], [3100, 0.005, 0.15]] });
	c.thump({ t: t0 + 0.062, f0: 132, f1: 62, dur: 0.055, tau: 0.012, gain: 0.20 * g });
}

/* ==========================================================================
   Playback engine
   ========================================================================== */
class WeaponAudio {
	constructor() {
		this.ctx = null; this.ready = false; this.muted = false;
		this.buf = {}; this.pick = {};
		this.volume = 0.9;
	}
	get t() { return this.ctx ? this.ctx.currentTime : 0; }

	init() {
		if (this.ctx) return;
		const AC = window.AudioContext || window.webkitAudioContext;
		if (!AC) return;
		const ctx = this.ctx = new AC({ latencyHint: 'interactive' });
		const sr = ctx.sampleRate;

		/* master: gain -> gentle bus compression -> limiter -> out */
		const master = ctx.createGain(); master.gain.value = this.volume;
		const comp = ctx.createDynamicsCompressor();
		comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
		comp.attack.value = 0.004; comp.release.value = 0.22;
		const lim = ctx.createDynamicsCompressor();
		lim.threshold.value = -1.5; lim.knee.value = 0; lim.ratio.value = 20;
		lim.attack.value = 0.0008; lim.release.value = 0.09;
		master.connect(comp); comp.connect(lim); lim.connect(ctx.destination);
		this.master = master;

		/* one shared indoor-range tail */
		this.verb = ctx.createConvolver();
		this.verb.buffer = this._ir(1.35, 2.4);
		const vg = ctx.createGain(); vg.gain.value = 0.5;
		const vf = ctx.createBiquadFilter(); vf.type = 'lowpass'; vf.frequency.value = 2600;
		this.verb.connect(vf); vf.connect(vg); vg.connect(master);
		this.verbGain = vg;

		/* render the bank */
		const add = (name, fn, seeds, opt) => {
			this.buf[name] = seeds.map(s => this._toBuffer(fn(sr, s, opt)));
			this.pick[name] = 0;
		};

	_toBuffer(c) {
		const b = this.ctx.createBuffer(2, c.n, this.sr || this.ctx.sampleRate);
		b.copyToChannel(c.l, 0); b.copyToChannel(c.r, 1);
		return b;
	}

	_ir(dur, decay) {
		const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
		const buf = ctx.createBuffer(2, len, sr);
		for (let ch = 0; ch < 2; ch++) {
			const d = buf.getChannelData(ch);
			let lp = 0;
			for (let i = 0; i < len; i++) {
				const x = i / len;
				const n = (Math.random() * 2 - 1) * Math.pow(1 - x, decay);
				lp += 0.42 * (n - lp);
				d[i] = lp * 0.9 + n * 0.1;
			}
			// a handful of discrete early reflections keeps it from sounding like a hiss
			for (const [ms, g] of [[11, 0.7], [19, -0.55], [31, 0.45], [47, -0.34], [73, 0.24]]) {
				const i = Math.floor(sr * ms * 0.001 * (1 + ch * 0.09));
				if (i < len) d[i] += g;
			}
		}
		return buf;
	}

	/* one-shot playback: buffer -> gain -> pan -> (dry + verb send) */
	play(name, o = {}) {
		if (!this.ready || this.muted) return null;
		const list = this.buf[name]; if (!list || !list.length) return null;
		const ctx = this.ctx;
		let idx;
		if (list.length === 1) idx = 0;
		else { idx = (this.pick[name] + 1 + (Math.random() * (list.length - 1) | 0)) % list.length; this.pick[name] = idx; }
		const src = ctx.createBufferSource();
		src.buffer = list[idx];
		src.playbackRate.value = o.rate || (1 + (Math.random() - 0.5) * (o.jitter === undefined ? 0.035 : o.jitter));
		const g = ctx.createGain();
		g.gain.value = o.gain === undefined ? 1 : o.gain;
		let node = g;
		src.connect(g);
		if (ctx.createStereoPanner && o.pan) {
			const p = ctx.createStereoPanner();
			p.pan.value = Math.max(-1, Math.min(1, o.pan));
			g.connect(p); node = p;
		}
		node.connect(this.master);
		const send = o.room === undefined ? 0.25 : o.room;
		if (send > 0) {
			const sg = ctx.createGain(); sg.gain.value = send;
			node.connect(sg); sg.connect(this.verb);
		}
		const when = ctx.currentTime + (o.delay || 0);
		src.start(when);
		return src;
	}

	setMuted(m) {
		this.muted = m;
		if (this.master) this.master.gain.setTargetAtTime(m ? 0 : this.volume, this.t, 0.01);
	}

	/* ------------------------------------------------------------ library */
	shot(o = {}) {
		const auto = o.mode === 'auto' || o.mode === 'burst';
		this.play(auto ? 'shotAuto' : 'shot', { gain: auto ? 0.88 : 0.95, pan: o.pan || 0, room: auto ? 0.22 : 0.3, jitter: 0.05 });
		if (o.heat > 0.5 && Math.random() < 0.4)
			this.play('cloth', { gain: 0.25 * o.heat, delay: 0.05, room: 0.2 });
	}
	cycleSound(g = 1) { this.play('cycle', { gain: g, room: 0.25 }); }
	dryFire() { this.play('dry', { gain: 0.8, room: 0.2 }); }
	triggerPull() { this.play('trigPress', { gain: 0.55, room: 0.12 }); }
	triggerReset() { this.play('trigReset', { gain: 0.45, room: 0.12 }); }
	safetyClick() { this.play('safety', { gain: 0.6, room: 0.12 }); }
	selector() { this.play('selector', { gain: 0.85, pan: -0.18, room: 0.2 }); }
	magRelease() { this.play('magRelease', { gain: 0.8, pan: -0.08, room: 0.18 }); }
	magOut() { this.play('magOut', { gain: 0.85, pan: -0.06, room: 0.22 }); }
	magDrop(delay = 0.3) { this.play('magFloor', { gain: 0.9, pan: -0.12, delay, room: 0.45 }); }
	magInsert() { this.play('magIn', { gain: 0.95, pan: -0.05, room: 0.25 }); }
	chargeBack() { this.play('chargeBack', { gain: 0.9, pan: -0.26, room: 0.28 }); }
	notchLock() { this.play('notch', { gain: 0.8, pan: -0.26, room: 0.2 }); }
	boltHome(force = 1) { this.play('boltHome', { gain: 0.85 * force, pan: 0.05, room: 0.3 }); }
	hkSlap() { this.play('slap', { gain: 0.9, pan: -0.3, room: 0.2 }); this.play('boltHome', { gain: 1.0, pan: 0.05, delay: 0.045, room: 0.32 }); }
	stockButton() { this.play('stockBtn', { gain: 0.7, pan: -0.28, room: 0.16 }); }
	stockSlide(dur, out) { this.play(out ? 'stockOut' : 'stockIn', { gain: 0.8, pan: 0.14, room: 0.25 }); }
	brass(pan = 0.4, delay = 0) { this.play('brass', { gain: 0.55, pan, delay, room: 0.35, jitter: 0.12 }); }
	brassHit(pan = 0.4, gain = 1, delay = 0) {
		this.play('brassTap', { gain: 0.5 * gain, pan, delay, room: 0.35, jitter: 0.22 });
	}
	drumClick() { this.play('drum', { gain: 0.5, pan: 0.1, room: 0.14 }); }
	click(when, f, g, q, dur) { this.play('drum', { gain: 0.5 * (g === undefined ? 1 : g), room: 0.14 }); }
	impact(kind, dist, pan = 0) {
		const d = Math.max(0, dist) / 343;
		const att = 1 / (1 + dist * 0.055);
		if (kind === 'steel') this.play('hitSteel', { gain: 0.95 * att, pan, delay: d, room: 0.6, jitter: 0.08 });
		else this.play('hitDirt', { gain: 0.8 * att, pan, delay: d, room: 0.5, jitter: 0.1 });
	}
	cloth(g = 1) { this.play('cloth', { gain: 0.5 * g, room: 0.2 }); }
}

	const c = document.createElement('canvas'); c.width = c.height = 128;

	const img = x.createImageData(128, 128);
	for (let i = 0; i < 128 * 128; i++) {
		const px = i % 128, py = i / 128 | 0;
		const d = Math.hypot(px - 64, py - 64) / 64;
		let n = 0, amp = 1, f = 3.1;
		for (let o = 0; o < 4; o++) { n += amp * Math.abs(Math.sin(px * f * 0.06 + o * 2.3) * Math.cos(py * f * 0.06 - o * 1.7)); amp *= 0.55; f *= 2.1; }
		const a = clamp((1 - d) * 1.5, 0, 1) * clamp(n * 0.7, 0, 1);
		img.data[i * 4] = 220; img.data[i * 4 + 1] = 220; img.data[i * 4 + 2] = 224;
		img.data[i * 4 + 3] = a * 255;
	}

	return new THREE.CanvasTexture(c);
}
