	const c = caseObj.clone(true);
	c.scale.setScalar(MM); c.visible = false;
	c.userData = { vel: new THREE.Vector3(), spin: new THREE.Vector3(), life: 0, bounces: 0 };
	scene.add(c); cases.push(c);
}
let caseIdx = 0;
function ejectCase() {
	const c = cases[caseIdx = (caseIdx + 1) % cases.length];
	const port = new THREE.Vector3(23, 8, DIM.ejectZ);
	nodes.mp5.localToWorld(port);
	c.position.copy(port);
	c.visible = true; c.userData.life = 0; c.userData.bounces = 0;
	// real MP5 throws brass hard to the right and slightly forward-up
	const dir = new THREE.Vector3(1, 0.55, 0.12).normalize();
	dir.applyQuaternion(nodes.mp5.getWorldQuaternion(new THREE.Quaternion()));
	c.userData.vel.copy(dir).multiplyScalar(rnd(3.4, 4.6)).add(new THREE.Vector3(0, rnd(0, 0.5), 0));
	c.userData.spin.set(rnd(-26, 26), rnd(-18, 18), rnd(-30, 30));
	c.quaternion.copy(nodes.mp5.getWorldQuaternion(new THREE.Quaternion()));
	c.rotateZ(rnd(0, 6.28));
}

/* -------------------------------- bullets ------------------------------- */
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffcf88, toneMapped: false, transparent: true, opacity: 0.95 });
const tracerMat = new THREE.MeshBasicMaterial({ color: 0xff9c3c, toneMapped: false, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
const bullets = [];
for (let i = 0; i < 24; i++) {
	const g = new THREE.Group();
	const core = new THREE.Mesh(new THREE.SphereGeometry(0.0048, 8, 6), bulletMat);
	core.scale.set(1, 1, 3.4);
	const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0009, 1, 6, 1, true), tracerMat);
	tr.rotation.x = Math.PI / 2; tr.position.z = -0.5;
	g.add(core); g.add(tr);
	g.visible = false;
	g.userData = { vel: new THREE.Vector3(), life: 0, prev: new THREE.Vector3(), tr };
	scene.add(g); bullets.push(g);
}
const V0 = 375;                                        // m/s, 9x19 from a 225 mm barrel
function spawnBullet() {
	const b = bullets.find(x => !x.visible); if (!b) return;
	const p = new THREE.Vector3(0, 0, DIM.muzzleZ);
	nodes.mp5.localToWorld(p);
	const d = new THREE.Vector3(0, 0, -1).applyQuaternion(nodes.mp5.getWorldQuaternion(new THREE.Quaternion()));
	// cone of fire: mechanical accuracy plus the current stance / bloom cone
	const sig = W.spread * 0.42 + 0.00035;
	const ang = Math.random() * Math.PI * 2, rad = Math.sqrt(Math.random()) * sig;
	d.x += Math.cos(ang) * rad; d.y += Math.sin(ang) * rad;
	b.position.copy(p); b.userData.prev.copy(p);
	b.userData.vel.copy(d).normalize().multiplyScalar(V0);
	b.userData.life = 0; b.visible = true;
}

/* ========================= weapon state machine ========================= */
const audio = new WeaponAudio();
const MODES = ['\u041f\u0420\u0415\u0414\u041e\u0425\u0420.', '\u041e\u0414\u0418\u041d\u041e\u0427\u041d\u042b\u0419', '\u041e\u0427\u0415\u0420\u0415\u0414\u042c 3', '\u0410\u0412\u0422\u041e'];
const CYCLE = 60 / 800;                               // 800 rpm → 75 ms per cycle
const W = {
	mag: 30, magMax: 30, chambered: true, mode: 1,
	triggerHeld: false, burstLeft: 0, nextShot: 0, lastTrigger: false,
	cycle: -1, ejected: false, fed: false,
	reload: null, reloadT: 0,
	charge: 0, chargeLocked: false, chargeAnim: null,
	magT: 0, magDrop: null, magVisible: true,
	stockT: 1, stockTarget: 1, latchT: 0, paddleT: 0, btnT: 0,
	ads: false, adsT: 0, drum: 0, heat: 0, sel: 1,
	triggerT: 0, shots: 0, hit: 0, spread: 0.0075,
	rec: { z: { x: 0, v: 0 }, p: { x: 0, v: 0 }, r: { x: 0, v: 0 }, y: { x: 0, v: 0 } },
	cam: { p: { x: 0, v: 0 }, y: { x: 0, v: 0 } },
	fps: true, muted: false,
};

/* --------------------------------------------------------------- recoil
   9x19 from a 2.9 kg gun: 8.0 g bullet at 375 m/s plus ~0.32 g of gas gives
   about 3.4 kg*m/s, i.e. 1.17 m/s of free recoil. The shoulder eats nearly
   all of it; what the shooter actually sees is ~11 mm of rearward travel and
   roughly 1.4 deg of muzzle rise, because the bore sits 28 mm above the butt.
   Both are modelled as CRITICALLY DAMPED springs, so every impulse decays
   back to exactly zero: the point of aim after a 30-round burst is the point
   of aim before it. The camera only gets a token 0.3 deg punch that is fully
   subtracted again during recovery, so the reticle never walks up the screen. */
const REC = {
	back: 0.0115, rise: 1.40 * D2R, roll: 0.55 * D2R, yaw: 0.26 * D2R,
	camP: 0.30 * D2R, camY: 0.09 * D2R,
	wGun: 46, wCam: 30,                 // rad/s (settling time ~ 4/w)
	adsK: 0.55, foldK: 1.34, maxGun: 2.4, maxCam: 2.0,
};
const SPREAD = {
	hipBase: 0.0075, adsBase: 0.0011,   // rad, half-angle of the cone of fire
	perShot: 0.0026, perShotAds: 0.0012,
	max: 0.030, recover: 3.6,
};
function kick(s, peak, w, cap) {
	s.v += peak * w * Math.E;           // critically damped peak = v / (w * e)
	const amp = Math.abs(s.x) + Math.abs(s.v) / w;
	if (cap && amp > cap) { const k = cap / amp; s.x *= k; s.v *= k; }
}
function spring(s, w, dt) {
	s.v += (-s.x * w * w - s.v * 2 * w) * dt;
	s.x += s.v * dt;
	if (Math.abs(s.x) < 2e-7 && Math.abs(s.v) < 2e-6) { s.x = 0; s.v = 0; }
}
const restOf = n => nodes[n].userData.rest;

/* ------------------------------------------------------------- shooting */
function canFire() { return W.mode > 0 && W.cycle < 0 && !W.reload && !W.chargeAnim; }

function pullTrigger() {
	if (W.reload || W.chargeAnim) return;
	W.triggerHeld = true;
	if (W.mode === 0) { audio.safetyClick(); return; }              // safety blocks the trigger
	if (W.mode === 2 && W.burstLeft === 0) W.burstLeft = 3;
	if (W.mode === 1 || W.mode === 2) W.nextShot = 0;
}
function releaseTrigger() {
	W.triggerHeld = false;
	if (W.mode > 0 && W.triggerT > 0.4) audio.triggerReset();
}

function fireOnce() {
	if (!W.chambered) {                                             // hammer falls on an empty chamber
		audio.dryFire(); W.triggerT = 1;
		W.burstLeft = 0; W.nextShot = 0.35;
		return;
	}
	W.chambered = false;
	W.cycle = 0; W.ejected = false; W.fed = false;
	W.triggerT = 1;
	W.heat = Math.min(1, W.heat + 0.085);
	audio.shot({ mode: W.mode === 3 ? 'auto' : W.mode === 2 ? 'burst' : 'semi', heat: W.heat });

	// muzzle blast
	flashT = 1;
	flashLight.intensity = 26;
	for (const f of flashes) { f.visible = true; f.rotation.z = Math.random() * 6.28; f.scale.setScalar(rnd(0.8, 1.25)); }
	flashCore.visible = true; flashCore.scale.setScalar(rnd(0.85, 1.2));

	const mp = new THREE.Vector3(0, 0, DIM.muzzleZ - 10); nodes.mp5.localToWorld(mp);
	const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(nodes.mp5.getWorldQuaternion(new THREE.Quaternion()));
	for (let i = 0; i < 2 + (W.heat * 4 | 0); i++)
		puff(mp, fwd.clone().multiplyScalar(rnd(0.8, 2.6)).add(new THREE.Vector3(rnd(-.4, .4), rnd(.1, .7), rnd(-.4, .4))),
			rnd(0.05, 0.11), rnd(0.5, 1.1), rnd(0.10, 0.26));
	spark(mp, fwd, 5, 2.2, 0.14);
	spawnBullet();

	// recoil impulse: rearward travel, muzzle rise about the butt pad, a
	// little roll out of the shoulder, and a token camera punch
	const k = (W.ads ? REC.adsK : 1) * (W.stockT < 0.5 ? REC.foldK : 1) * (1 + W.heat * 0.10);
	W.shots++;
	kick(W.rec.z, REC.back * k, REC.wGun, REC.back * REC.maxGun);
	kick(W.rec.p, REC.rise * k * rnd(0.88, 1.12), REC.wGun, REC.rise * REC.maxGun);
	kick(W.rec.r, REC.roll * k * rnd(0.5, 1.3), REC.wGun, REC.roll * REC.maxGun);
	kick(W.rec.y, REC.yaw * k * rnd(-1, 1), REC.wGun, REC.yaw * REC.maxGun);
	kick(W.cam.p, REC.camP * k * rnd(0.8, 1.2), REC.wCam, REC.camP * REC.maxCam);
	kick(W.cam.y, REC.camY * k * rnd(-1, 1), REC.wCam, REC.camY * REC.maxCam);
	W.spread = Math.min(SPREAD.max, W.spread + (W.ads ? SPREAD.perShotAds : SPREAD.perShot));
}

/* --------------------------------------------------------- action cycle */
function stepCycle(dt) {
	if (W.cycle < 0) return;
	W.cycle += dt;
	const t = W.cycle;
	if (!W.ejected && t >= 0.020) { W.ejected = true; ejectCase(); audio.brassHit(rnd(0.5, 0.85), 0.30, 0.014); }
	if (!W.fed && t >= 0.052) {
		W.fed = true;
		if (W.mag > 0) { W.mag--; W.chambered = true; }              // strip the top round, feed it
	}
	if (t >= CYCLE) W.cycle = -1;
}
function boltOffset() {
	let b = 0;
	if (W.cycle >= 0) {
		const t = W.cycle;
		b = t < 0.030 ? easeOut(t / 0.030) : 1 - ease((t - 0.030) / (CYCLE - 0.030));
	}
	return Math.max(b, W.charge);
}

/* ------------------------------------------------------- charging handle */
function chargeHandle(lock) {
	if (W.chargeAnim || W.reload) return;
	W.chargeAnim = { t: 0, lock: !!lock, phase: 0 };
	audio.chargeBack();
}
function slapRelease() {
	if (!W.chargeLocked || W.chargeAnim) return;
	W.chargeAnim = { t: 0, phase: 2 };
	audio.hkSlap();
}
function stepCharge(dt) {
	const a = W.chargeAnim; if (!a) return;
	a.t += dt;
	if (a.phase === 0) {                                            // pulling back
		W.charge = easeOut(clamp(a.t / 0.19, 0, 1));
		if (a.t >= 0.19) {
			if (a.lock) { W.chargeLocked = true; audio.notchLock(); W.chargeAnim = null; W.charge = 1; }
			else { a.phase = 1; a.t = 0; }
		}
	} else if (a.phase === 1) {                                     // held, then released
		if (a.t >= 0.09) { a.phase = 2; a.t = 0; audio.boltHome(1); releaseBolt(); }
	} else {                                                        // flying forward
		if (W.chargeLocked) { W.chargeLocked = false; releaseBolt(); }
		W.charge = 1 - ease(clamp(a.t / 0.075, 0, 1));
		if (a.t >= 0.075) { W.charge = 0; W.chargeAnim = null; }
	}
}
function releaseBolt() {
	if (W.mag > 0 && !W.chambered) { W.mag--; W.chambered = true; }
	else if (W.chambered) { ejectCase(); audio.brassHit(0.55, 0.28, 0.02); }   // ejects the loaded round
}

/* --------------------------------------------------------------- reload */
function startReload() {
	if (W.reload || W.chargeAnim || (W.mag === W.magMax && W.chambered)) return;
	const empty = !W.chambered;
	W.reload = { empty, t: 0, s: 0 };
	W.burstLeft = 0;
}
function stepReload(dt) {
	const r = W.reload; if (!r) return;
	r.t += dt;
	const hit = (time, fn) => {  if (r.t >= time && !r['d' + time]) { r['d' + time] = 1; fn(); } };
	hit(0.00, () => { W.paddleT = 1; W.btnT = 1; audio.magRelease(); audio.cloth(0.5); });
	hit(0.09, () => { W.magDrop = { t: 0 }; audio.magOut(); audio.magDrop(0.30); });
	hit(0.66, () => { W.magT = 1; W.magDrop = null; W.magVisible = true; audio.magInsert(); });
	hit(0.84, () => { W.mag = W.magMax; });
	if (r.t >= 0.66) W.magT = 1 - easeOut(clamp((r.t - 0.66) / 0.18, 0, 1));
	// a magazine change with a round still in the chamber never touches the bolt
	if (!r.empty) { if (r.t >= 1.00) { W.reload = null; audio.cloth(0.45); } return; }
	// dry gun: the MP5 has no bolt hold-open, so the handle has to be worked
	hit(1.06, () => {
		if (W.chargeLocked) slapRelease();
		else { W.chargeAnim = { t: 0, lock: false, phase: 0 }; audio.chargeBack(); }
	});
	if (r.t >= 1.54) { W.reload = null; audio.cloth(0.45); }
}

/* ------------------------------------------------------------ selectors */
function cycleMode(dir) {
	W.mode = (W.mode + (dir || 1) + 4) % 4;
	W.burstLeft = 0;
	audio.selector(W.mode);
	syncHud();
}
function toggleStock() {
	W.stockTarget = W.stockTarget > 0.5 ? 0 : 1;
	W.latchT = 1;
	audio.stockButton();
	audio.stockSlide(0.30, W.stockTarget > 0.5);
	syncHud();
}
function setDrum(i) {
	if (i === W.drum) return;
	W.drum = i; audio.drumClick();
	syncHud();
}

/* ---------------------------------------- round being stripped and fed */
const feedProto = new Node('feedRound');
cartridge(feedProto, 'live');
const feedObj = toObject(feedProto);
feedObj.visible = false;
nodes.mp5.add(feedObj);

/* ============================== per-frame pose ========================== */
function applyPose(dt) {
	const b = boltOffset();
	nodes.bolt.position.z = restOf('bolt').p.z + b * DIM.boltTravel;

	const ch = nodes.chargingHandle;
	ch.position.z = restOf('chargingHandle').p.z + W.charge * DIM.chTravel;
	ch.rotation.z = restOf('chargingHandle').r.z - (W.chargeLocked ? 0.34 : 0);

	nodes.trigger.rotation.x = restOf('trigger').r.x - W.triggerT * 13 * D2R;
	const selA = (-30 + W.mode * 34) * D2R;    // sweeps 0 / 1 / 3 / F, forward-down
	nodes.selectorL.rotation.x = selA;
	nodes.selectorR.rotation.x = selA;
	nodes.rearDrum.rotation.x = -W.drum * 90 * D2R;

	// magazine: slides straight down out of the well, then falls free
	let fall = 0, tilt = 0;
	if (W.magDrop) {
		W.magDrop.t += dt;
		const t = W.magDrop.t;
		W.magT = Math.min(1, t / 0.10);
		const f = Math.max(0, t - 0.10);
		fall = 900 * f * f * 9.81 * 0.5 * 0.02 + f * 220;
		tilt = f * 1.5;
		W.magVisible = t < 0.55;
	}
	const mg = nodes.magazine;
	mg.visible = W.magVisible;
	mg.position.y = restOf('magazine').p.y - W.magT * 74 - fall;
	mg.position.z = restOf('magazine').p.z + W.magT * 5;
	mg.rotation.x = tilt;
	nodes.topRound.visible = W.mag > 0;

	// the round leaving the magazine on the closing stroke
	if (W.cycle >= 0 && W.cycle > 0.030 && W.cycle < 0.062 && W.mag > 0) {
		const k = (W.cycle - 0.030) / 0.032;
		feedObj.visible = true;
		feedObj.position.set(0, lerp(-9, 0.5, ease(k)), lerp(126, 24, ease(k)));
		feedObj.rotation.x = lerp(0.22, 0, k);
	} else feedObj.visible = false;

	// stock
	W.stockT += (W.stockTarget - W.stockT) * Math.min(1, dt * 9.5);
	nodes.stock.position.z = restOf('stock').p.z + W.stockT * DIM.stockTravel;
	W.latchT = Math.max(0, W.latchT - dt * 5);
	nodes.stockLatch.position.x = restOf('stockLatch').p.x + W.latchT * 2.6;

	// release paddle + right-hand button
	W.paddleT = Math.max(0, W.paddleT - dt * 4.5);
	W.btnT = Math.max(0, W.btnT - dt * 4.5);
	nodes.magPaddle.rotation.x = W.paddleT * 15 * D2R;
	nodes.magButton.position.x = restOf('magButton').p.x - W.btnT * 2.2;
}

/* ================================ update ================================ */
const clock = new THREE.Clock();
let tGlobal = 0;
const hipPos = new THREE.Vector3(0.088, -0.118, -0.20);
const adsPos = new THREE.Vector3(0, -DIM.sightY * MM, -0.285);
const tmpV = new THREE.Vector3();

function update(dt) {
	tGlobal += dt;
	stepCycle(dt); stepCharge(dt); stepReload(dt);
	W.nextShot -= dt;

	const ready = W.cycle < 0 && W.nextShot <= 0 && !W.reload && !W.chargeAnim && !W.chargeLocked;
	if (W.mode === 1 && W.triggerHeld && !W.semiLatch && ready) { W.semiLatch = true; fireOnce(); W.nextShot = 0.05; }
	if (W.mode === 2 && W.burstLeft > 0 && ready) { W.burstLeft--; fireOnce(); W.nextShot = CYCLE * 0.02; }
	if (W.mode === 3 && W.triggerHeld && ready) { fireOnce(); W.nextShot = CYCLE * 0.02; }
	if (!W.triggerHeld) W.semiLatch = false;
	const tt = (W.mode > 0 && W.triggerHeld && (W.mode !== 1 || W.semiLatch)) || W.burstLeft > 0 ? 1 : 0;
	W.triggerT += (tt - W.triggerT) * Math.min(1, dt * 22);

	// recoil springs — critically damped, so they land back on exactly zero
	const wg = REC.wGun * (W.ads ? 1.14 : 1);
	spring(W.rec.z, wg, dt); spring(W.rec.p, wg, dt);
	spring(W.rec.r, wg * 0.9, dt); spring(W.rec.y, wg * 0.9, dt);
	spring(W.cam.p, REC.wCam, dt); spring(W.cam.y, REC.wCam, dt);
	const sBase = W.ads ? SPREAD.adsBase : SPREAD.hipBase;
	W.spread += (sBase - W.spread) * Math.min(1, dt * SPREAD.recover);
	W.hit = Math.max(0, W.hit - dt);

	W.heat = Math.max(0, W.heat - dt * 0.075);
	if (W.heat > 0.55 && Math.random() < dt * W.heat * 6) {
		tmpV.set(0, 12, DIM.muzzleZ + 40); nodes.mp5.localToWorld(tmpV);
		puff(tmpV, new THREE.Vector3(rnd(-.05, .05), rnd(.15, .4), rnd(-.05, .05)), 0.035, 1.4, 0.09);
	}
	if (matLib.barrelHot) matLib.barrelHot.emissiveIntensity = Math.max(0, W.heat - 0.45) * 1.4;

	// ADS + hold placement
	W.adsT += ((W.ads ? 1 : 0) - W.adsT) * Math.min(1, dt * 13);
	const a = ease(W.adsT);
	hold.position.lerpVectors(hipPos, adsPos, a);
	hold.rotation.set(lerp(0.055, 0, a), lerp(-0.16, 0, a), lerp(0.06, 0, a));
	// breathing and hold wobble, almost gone once there is a cheek weld
	const sw = (1 - a * 0.88);
	hold.position.x += Math.sin(tGlobal * 0.83) * 0.0032 * sw;
	hold.position.y += Math.sin(tGlobal * 1.27 + 1) * 0.0026 * sw;
	hold.position.z += Math.sin(tGlobal * 0.61 + 2) * 0.0016 * sw;
	hold.rotation.z += Math.sin(tGlobal * 0.7) * 0.010 * sw;
	hold.rotation.x += Math.sin(tGlobal * 1.09 + 0.6) * 0.0035 * sw;
	// recoil, applied about the butt pad
	kickG.position.set(0, W.rec.z.x * 0.16, W.rec.z.x);
	kickG.rotation.set(W.rec.p.x, W.rec.y.x, W.rec.r.x);
	const fov = lerp(58, 40, a);
	if (Math.abs(camFPS.fov - fov) > 0.01) { camFPS.fov = fov; camFPS.updateProjectionMatrix(); }
	pitchG.rotation.x = W.pitch + W.cam.p.x;
	rig.rotation.y = W.yaw + W.cam.y.x;

	applyPose(dt);

	/* ---- muzzle flash decay ---- */
	if (flashT > 0) {
		flashT -= dt * 22;
		const k = Math.max(0, flashT);
		flashMat.opacity = k;
		flashCore.material.opacity = k * k;
		flashLight.intensity = 26 * k * k;
		if (flashT <= 0) { flashes.forEach(f => f.visible = false); flashCore.visible = false; flashLight.intensity = 0; }
	}

	/* ---- bullets ---- */
	for (const b of bullets) {
		if (!b.visible) continue;
		const u = b.userData;
		u.life += dt;
		u.prev.copy(b.position);
		u.vel.y -= 9.81 * dt;
		u.vel.multiplyScalar(1 - 0.42 * dt);
		b.position.addScaledVector(u.vel, dt);
		b.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tmpV.copy(u.vel).normalize());
		u.tr.scale.z = clamp(u.prev.distanceTo(b.position) * 1.6, 0.1, 4);
		let hit = null, kind = 'dirt', norm = new THREE.Vector3(0, 0, 1);
		for (const p of plates) {
			if (u.prev.z > p.center.z && b.position.z <= p.center.z) {
				const k = (u.prev.z - p.center.z) / (u.prev.z - b.position.z);
				const px = lerp(u.prev.x, b.position.x, k), py = lerp(u.prev.y, b.position.y, k);
				if (Math.hypot(px - p.center.x, py - p.center.y) < p.radius) {
					hit = new THREE.Vector3(px, py, p.center.z); kind = 'steel';
					p.vel += 7.5; W.hit = 0.35; break;
				}
			}
		}
		if (!hit && b.position.y <= 0.005) {
			hit = b.position.clone(); hit.y = 0.005; norm.set(0, 1, 0);
		}
		if (!hit && b.position.z <= -31.6) { hit = b.position.clone(); }
		if (hit) {
			b.visible = false;
			const d = hit.distanceTo(camFPS.getWorldPosition(tmpV.clone()));
			audio.impact(kind, d, clamp(hit.x / 6, -1, 1));
			spark(hit, norm, kind === 'steel' ? 16 : 8, kind === 'steel' ? 3.2 : 1.6, 0.4);
			puff(hit, new THREE.Vector3(rnd(-.3, .3), rnd(.3, .9), rnd(0, .6)), 0.16, 0.9, kind === 'steel' ? 0.10 : 0.28);
		} else if (u.life > 2.2) b.visible = false;
	}
	for (const p of plates) {
		p.vel += (-p.ang * 42 - p.vel * 1.9) * dt;
		p.ang += p.vel * dt;
		p.pivot.rotation.x = p.ang;
	}

	/* ---- brass ---- */
	for (const c of cases) {
		if (!c.visible) continue;
		const u = c.userData;
		u.life += dt;
		u.vel.y -= 9.81 * dt;
		c.position.addScaledVector(u.vel, dt);
		c.rotation.x += u.spin.x * dt; c.rotation.y += u.spin.y * dt; c.rotation.z += u.spin.z * dt;
		if (c.position.y < 0.008 && u.vel.y < 0) {
			c.position.y = 0.008;
			u.vel.y *= -0.42; u.vel.x *= 0.68; u.vel.z *= 0.68;
			u.spin.multiplyScalar(0.55);
			if (++u.bounces <= 5 && Math.abs(u.vel.y) > 0.22)
				audio.brassHit(clamp((c.position.x - rig.position.x) * 0.55, -1, 1),
					clamp(Math.abs(u.vel.y) * 0.55, 0.10, 1));
			if (Math.abs(u.vel.y) < 0.25) u.vel.set(0, 0, 0);
		}
		if (u.life > 6) c.visible = false;
	}

	/* ---- particles ---- */
	for (const s of smokes) {
		if (!s.visible) continue;
		const u = s.userData;
		u.life += dt;
		const k = u.life / u.ttl;
		if (k >= 1) { s.visible = false; continue; }
		s.position.addScaledVector(u.vel, dt);
		u.vel.multiplyScalar(1 - 1.9 * dt);
		u.vel.y += 0.55 * dt;
		s.scale.setScalar(u.size * (1 + k * 2.6));
		s.material.opacity = u.op * (1 - k) * (1 - k);
		s.material.rotation += dt * 0.5;
	}
	for (const s of sparks) {
		if (!s.visible) continue;
		const u = s.userData;
		u.life += dt;
		const k = u.life / u.ttl;
		if (k >= 1) { s.visible = false; continue; }
		u.vel.y -= 12 * dt;
		u.vel.multiplyScalar(1 - 3.4 * dt);
		s.position.addScaledVector(u.vel, dt);
		s.material.opacity = (1 - k) * (1 - k);
	}
}

/* ================================== HUD ================================= */
const $ = id => document.getElementById(id);
const RANGES = ['100', '200', '300', '400'];
function syncHud() {
	$('ammo').textContent = W.mag + (W.chambered ? '+1' : '');
	$('ammoBar').style.width = (W.mag / W.magMax * 100) + '%';
	$('mode').textContent = MODES[W.mode];
	$('mode').className = 'v ' + (W.mode === 0 ? 'safe' : W.mode === 3 ? 'auto' : '');
	$('stockv').textContent = W.stockTarget > 0.5 ? '\u0420\u0410\u0421\u041b\u041e\u0416\u0415\u041d' : '\u0421\u041b\u041e\u0416\u0415\u041d';
	$('drumv').textContent = RANGES[W.drum] + ' \u043c';
	const hv = $('heatv');
	hv.textContent = W.heat < 0.22 ? '\u0425\u041e\u041b\u041e\u0414\u041d\u042b\u0419'
		: W.heat < 0.5 ? '\u0422\u0401\u041f\u041b\u042b\u0419'
		: W.heat < 0.78 ? '\u0413\u041e\u0420\u042f\u0427\u0418\u0419' : '\u0420\u0410\u0421\u041a\u0410\u041b\u0401\u041d';
	hv.className = 'v ' + (W.heat > 0.78 ? 'safe' : W.heat > 0.5 ? 'auto' : '');
	$('b-mode').textContent = MODES[W.mode];
	$('b-stock').textContent = W.stockTarget > 0.5 ? '\u041f\u0420\u0418\u041a\u041b\u0410\u0414 \u2014 \u0421\u041b\u041e\u0416\u0418\u0422\u042c' : '\u041f\u0420\u0418\u041a\u041b\u0410\u0414 \u2014 \u0420\u0410\u0417\u041b\u041e\u0416\u0418\u0422\u042c';
}

/* ================================ input ================================= */
W.yaw = 0; W.pitch = 0; W.semiLatch = false;
let locked = false;

function firstGesture() { audio.init(); if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); }
window.addEventListener('pointerdown', firstGesture, { once: true });
window.addEventListener('keydown', firstGesture, { once: true });

function setView(fps) {
	W.fps = fps;
	orbit.enabled = !fps;
	if (fps) { rig.position.set(0, 1.56, 3.4); rig.rotation.set(0, 0, 0); }
	else {
		rig.position.set(0, 1.5, 0); rig.rotation.set(0, 0, 0); pitchG.rotation.set(0, 0, 0);
		W.yaw = 0; W.pitch = 0; W.ads = false;
		if (document.pointerLockElement) document.exitPointerLock();
	}
	$('b-view').textContent = fps ? '\u0420\u0415\u0416\u0418\u041c: \u0421\u0422\u0420\u0415\u041b\u042c\u0411\u0410' : '\u0420\u0415\u0416\u0418\u041c: \u041e\u0421\u041c\u041e\u0422\u0420';
	ret.style.display = fps ? '' : 'none';
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
	if (!W.fps) return;
	if (!locked && e.pointerType === 'mouse') { canvas.requestPointerLock(); return; }
	if (e.button === 0) pullTrigger();
	if (e.button === 2) { W.ads = true; }
});
window.addEventListener('pointerup', e => {
	if (e.button === 0) releaseTrigger();
	if (e.button === 2) W.ads = false;
});
document.addEventListener('pointerlockchange', () => {
	locked = document.pointerLockElement === canvas;
	$('hint').style.opacity = locked ? '0' : '1';
});
window.addEventListener('mousemove', e => {
	if (!locked || !W.fps) return;
	const s = W.ads ? 0.0011 : 0.0021;
	W.yaw -= e.movementX * s;
	W.pitch = clamp(W.pitch - e.movementY * s, -0.62, 0.55);
});

const KEYS = {
	KeyR: () => startReload(),
	KeyV: () => { W.ads = !W.ads; },
	KeyX: () => toggleStock(),
	KeyB: () => cycleMode(1),
	KeyC: () => { if (W.chargeLocked) slapRelease(); else chargeHandle(true); },
	KeyT: () => slapRelease(),
	KeyF: () => setView(!W.fps),
	KeyM: () => { W.muted = !W.muted; audio.setMuted(W.muted); $('b-mute').textContent = W.muted ? '\u0417\u0412\u0423\u041a: \u0412\u042b\u041a\u041b' : '\u0417\u0412\u0423\u041a: \u0412\u041a\u041b'; },
	Digit1: () => setDrum(0), Digit2: () => setDrum(1), Digit3: () => setDrum(2), Digit4: () => setDrum(3),
};
window.addEventListener('keydown', e => {
	if (e.repeat) return;
	if (e.code === 'Space') { e.preventDefault(); pullTrigger(); return; }
	const f = KEYS[e.code]; if (f) { e.preventDefault(); f(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') releaseTrigger(); });

/* on-screen controls */
const press = (id, down, up) => {
	const el = $(id);
	el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); down(); });
	if (up) { const end = () => { el.classList.remove('on'); up(); }; el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end); el.addEventListener('pointercancel', end); }
	else { const end = () => el.classList.remove('on'); el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end); }
};
press('b-fire', () => pullTrigger(), () => releaseTrigger());
press('b-reload', () => startReload());
press('b-mode', () => cycleMode(1));
press('b-stock', () => toggleStock());
press('b-ads', () => { W.ads = !W.ads; $('b-ads').classList.toggle('act', W.ads); });
press('b-charge', () => { if (W.chargeLocked) slapRelease(); else chargeHandle(true); });
press('b-slap', () => slapRelease());
press('b-drum', () => setDrum((W.drum + 1) % 4));
press('b-view', () => setView(!W.fps));
press('b-mute', () => KEYS.KeyM());

/* ================================ reticle ===============================
   An honest reticle: the gap is the real cone of fire, converted through the
   camera's focal length, so what you see is where the rounds can go. It never
   inherits recoil (the camera punch is a separate, self-cancelling spring) and
   it disappears completely as the iron sights come up.
   ======================================================================== */
const ret = $('reticle'), rctx = ret.getContext('2d');
function retResize() {
	const dpr = Math.min(devicePixelRatio || 1, 2);
	ret.width = Math.round(innerWidth * dpr);
	ret.height = Math.round(innerHeight * dpr);
	rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawReticle() {
	const w = innerWidth, h = innerHeight;
	rctx.clearRect(0, 0, w, h);
	if (!W.fps) return;
	const fade = 1 - clamp((W.adsT - 0.10) / 0.28, 0, 1);
	if (fade <= 0.01) return;
	const cx = Math.round(w / 2) + 0.5, cy = Math.round(h / 2) + 0.5;
	const focal = (h / 2) / Math.tan(camFPS.fov * 0.5 * D2R);      // px per radian
	const gap = clamp(focal * W.spread * 0.5, 5, h * 0.34);
	const len = clamp(gap * 0.40, 6, 22);
	const tint = W.mode === 0 ? '198,124,112' : '236,240,244';
	for (let pass = 0; pass < 2; pass++) {
		rctx.strokeStyle = pass ? 'rgba(' + tint + ',' + (0.92 * fade) + ')' : 'rgba(0,0,0,' + (0.5 * fade) + ')';
		rctx.lineWidth = pass ? 1.7 : 3.7;
		rctx.beginPath();
		rctx.moveTo(cx, cy - gap); rctx.lineTo(cx, cy - gap - len);
		rctx.moveTo(cx, cy + gap); rctx.lineTo(cx, cy + gap + len);
		rctx.moveTo(cx - gap, cy); rctx.lineTo(cx - gap - len, cy);
		rctx.moveTo(cx + gap, cy); rctx.lineTo(cx + gap + len, cy);
		rctx.stroke();
	}
	rctx.fillStyle = 'rgba(0,0,0,' + (0.45 * fade) + ')';
	rctx.beginPath(); rctx.arc(cx, cy, 2.2, 0, 6.2832); rctx.fill();
	rctx.fillStyle = 'rgba(' + tint + ',' + (0.95 * fade) + ')';
	rctx.beginPath(); rctx.arc(cx, cy, 1.05, 0, 6.2832); rctx.fill();
	if (W.hit > 0) {                                               // steel hit marker
		const k = clamp(W.hit / 0.35, 0, 1), r0 = 7 + (1 - k) * 4, r1 = r0 + 7;
		rctx.strokeStyle = 'rgba(255,236,206,' + (0.95 * k) + ')';
		rctx.lineWidth = 2;
		rctx.beginPath();
		for (const s of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
			rctx.moveTo(cx + s[0] * r0, cy + s[1] * r0);
			rctx.lineTo(cx + s[0] * r1, cy + s[1] * r1);
		}
		rctx.stroke();
	}
}

/* ================================= loop ================================= */
function resize() {
	const w = innerWidth, h = innerHeight;
	renderer.setSize(w, h, false);
	camFPS.aspect = camOrb.aspect = w / h;
	camFPS.updateProjectionMatrix(); camOrb.updateProjectionMatrix();
	retResize();
}
addEventListener('resize', resize);
resize();
setView(true);
syncHud();

let acc = 0;
function frame() {
	requestAnimationFrame(frame);
	const dt = Math.min(clock.getDelta(), 0.05);
	// fixed sub-steps keep the 75 ms action cycle exact even at low frame rates
	acc += dt;
	let guard = 0;
	while (acc > 0.004 && guard++ < 24) { update(0.004); acc -= 0.004; }
	if (!W.fps) orbit.update();
	syncHud();
	drawReticle();
	renderer.render(scene, W.fps ? camFPS : camOrb);
}
frame();

window.MP5 = { W, nodes, audio, scene };

</script>
</body>
