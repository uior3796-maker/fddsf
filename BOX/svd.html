<!DOCTYPE html>
<html lang="ru">
<head>

<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08090b;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color:#e8eaed;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

/* ---------- виньетка ---------- */
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.55) 100%)}

/* ---------- сетка ---------- */
#reticle{position:fixed;pointer-events:none;opacity:0;transition:opacity .18s ease;z-index:5;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}
body.aiming #reticle{opacity:1}
#reticle #ret-g{stroke:#0d0e10}
#reticle.lit #ret-g{stroke:#ff5a2b;filter:drop-shadow(0 0 2.5px rgba(255,90,43,.9))}
#reticle text{fill:#0d0e10;stroke:none}
#reticle.lit text{fill:#ff5a2b;stroke:none}

/* ---------- шапка ---------- */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 18px;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,9,.72),rgba(6,7,9,0))}
#top .title b{display:block;font-size:19px;letter-spacing:.22em;font-weight:700}
#top .title span{display:block;font-size:10.5px;letter-spacing:.09em;color:#8b9099;margin-top:3px;text-transform:uppercase}
#top .stats{font-size:11px;color:#7d838c;font-variant-numeric:tabular-nums;letter-spacing:.05em}
body.aiming #top{opacity:.25}

/* ---------- боковая панель ---------- */
#side{position:fixed;top:74px;left:18px;z-index:10;display:flex;flex-direction:column;gap:9px;width:212px}
.card{background:rgba(12,14,17,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:11px 13px}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8b9099;
  letter-spacing:.05em;text-transform:uppercase;margin:3px 0}
.card .row b{color:#f0f2f4;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-transform:none}
#ammo-pips{display:flex;gap:3px;margin:9px 0 7px}
#ammo-pips i{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.10);transition:background .18s}
#ammo-pips i.on{background:linear-gradient(180deg,#e9b449,#c07f22);box-shadow:0 0 6px rgba(225,160,60,.45)}
.hint{font-size:10.5px;line-height:1.85;color:#787e88;letter-spacing:.03em}
.hint kbd{display:inline-block;min-width:17px;padding:1px 5px;margin-right:2px;border-radius:4px;text-align:center;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10);color:#c8ccd2;font-size:9.5px;font-family:inherit}
body.aiming #side{opacity:.22;transition:opacity .2s}

/* ---------- нижняя панель ---------- */
#bar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:8px;justify-content:center;align-items:center;
  flex-wrap:wrap;padding:16px 16px 20px;background:linear-gradient(0deg,rgba(6,7,9,.80),rgba(6,7,9,0))}
#bar button{font:inherit;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#c9ced5;cursor:pointer;
  padding:10px 17px;border-radius:9px;border:1px solid rgba(255,255,255,.11);background:rgba(20,23,27,.72);

#bar button:hover{background:rgba(34,38,44,.85);color:#fff;border-color:rgba(255,255,255,.2)}
#bar button:active{transform:translateY(1px) scale(.985)}
#bar button.active{background:rgba(224,150,50,.16);border-color:rgba(224,150,50,.5);color:#f0be74}
#bar button.off{opacity:.5}
#bar .big{font-weight:700;padding:12px 26px;font-size:12.5px}
#bar #btn-fire{background:linear-gradient(180deg,#8e2f1d,#66200f);border-color:rgba(255,120,70,.35);color:#ffe2d4;

#bar #btn-fire:hover{background:linear-gradient(180deg,#a83a24,#7a2713)}
#bar .alt{background:linear-gradient(180deg,#2b3138,#1d2126);color:#dfe3e8}

#hit.show{opacity:1;transform:translate(-50%,-200%) scale(1)}
#hit b{display:block;font-size:34px;font-weight:800;color:#ffcf7a;text-shadow:0 2px 14px rgba(0,0,0,.85);line-height:1}
#hit span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#cfd4da;margin-top:4px;
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);z-index:11;pointer-events:none;
  opacity:0;transition:all .2s;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#e4e7ea;
  background:rgba(14,16,19,.82);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:8px 15px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- служебное ---------- */
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;
  background:#08090b;color:#7d838c;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.12);border-top-color:#c9903c;border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;max-width:88vw;max-height:70vh;
  overflow:auto;background:rgba(28,12,12,.96);border:1px solid rgba(255,90,70,.35);border-radius:12px;padding:18px 20px;
  color:#ffd9d0;font-size:12px}
#err b{display:block;margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#ff9b83}
#err pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55}

@media (max-width:820px){
  #side{display:none}
  #top{padding:12px 14px}
  #top .title b{font-size:16px}
  #top .title span{font-size:9px}
  #bar{gap:6px;padding:12px 10px 16px}
  #bar button{padding:9px 12px;font-size:10px;letter-spacing:.08em}
  #bar .big{padding:11px 18px;font-size:11px}
}

var CH_ENV = [

var CH_PBR = [
  'const float PI=3.14159265;',
  'float D_GGX(float NoH,float a){float a2=a*a;float d=NoH*NoH*(a2-1.0)+1.0;return a2/max(1e-7,PI*d*d);}',

  'vec3 F_Schlick(vec3 f0,float u){float f=pow(1.0-u,5.0);return f0+(vec3(1.0)-f0)*f;}',
  'vec3 envBRDF(vec3 f0,float rough,float NoV){',
  ' vec4 c0=vec4(-1.0,-0.0275,-0.572,0.022), c1=vec4(1.0,0.0425,1.04,-0.04);',
  ' vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*NoV))*r.x+r.y;',
  ' vec2 ab=vec2(-1.04,1.04)*a004+r.zw; return f0*ab.x+ab.y;}',
  'vec3 shadeLight(vec3 N,vec3 V,vec3 L,vec3 col,vec3 albedo,float metal,float rough,vec3 f0){',
  ' vec3 H=normalize(V+L);',
  ' float NoL=max(dot(N,L),0.0), NoV=max(dot(N,V),1e-4), NoH=max(dot(N,H),0.0), VoH=max(dot(V,H),0.0);',

  ' float a=max(0.0025,rough*rough);',
  ' vec3 F=F_Schlick(f0,VoH);',
  ' vec3 spec=F*(D_GGX(NoH,a)*V_Smith(NoV,NoL,a));',
  ' vec3 kd=(vec3(1.0)-F)*(1.0-metal);',
  ' return (kd*albedo/PI+spec)*col*NoL;}'
].join('\n');

function checkerPanel(w, h, cell, depth, rot) {
  var m = new Mesh(), nx = Math.max(1, Math.round(w / cell)), ny = Math.max(1, Math.round(h / cell));
  var s = cell * 0.5;
  for (var i = 0; i < nx; i++) for (var j = 0; j < ny; j++) {
    var cx = -w / 2 + cell * (i + 0.5), cy = -h / 2 + cell * (j + 0.5);
    if (Math.hypot(cx / (w / 2), cy / (h / 2)) > 1.02) continue;
    var p = new Mesh();
    var a = p.v(-s, -s, 0, 0, 0, -1), b = p.v(s, -s, 0, 0, 0, -1), c = p.v(s, s, 0, 0, 0, -1), d = p.v(-s, s, 0, 0, 0, -1);
    var t = p.v(0, 0, depth, 0, 0, 1, 0, 0, 1);
    p.tri(a, t, b); p.tri(b, t, c); p.tri(c, t, d); p.tri(d, t, a);
    p.tri(a, b, c); p.tri(a, c, d);
    m.merge(p, Mmul(Mtrans(cx, cy, 0), MrotZ(PI / 4)));
  }
  return rot ? xf(m, MrotZ(rot)) : m;
}

/* ========================= МОДЕЛЬ СВД ========================= */
/* =========================================================================
   Геометрия построена по реальным пропорциям 7,62-мм снайперской винтовки
   Драгунова (СВД, инд. 6В1).
   Оси: X — вправо, Y — вверх, Z — назад. Ось канала ствола: x=0, y=0.

     общая длина ................. 1225 мм  (−906 … +330)
     длина ствола ................ 620  мм  (зеркало затвора −232 … дуло −852)
     прицельная линия ............ 587  мм  (мушка −820 … целик −233)
     линия механического прицела . +41 мм над каналом ствола
     оптическая ось ПСО-1 ........ +72 мм над каналом ствола
     ширина ствольной коробки .... 32 мм

   Всё, что должно быть симметричным, строится ОДИН раз для правой стороны
   и зеркалится mirX(): так исключены расхождения левой и правой половин.
   ========================================================================= */
var GEO = {
  Z_RB: mm(62), Z_RF: mm(-232),          // ствольная коробка: зад / перед
  RY_B: mm(-34), RY_T: mm(22),           // низ / верх коробки
  Z_MUZ: mm(-852), Z_FH: mm(-906),       // дульный срез / срез пламегасителя
  Z_FS: mm(-822), Z_RS: mm(-233),        // ось мушки / прорезь целика
  Y_IRON: mm(41), Y_OPT: mm(72), Y_GAS: mm(23),
  HG_B: mm(-298), HG_F: mm(-498),        // ствольные накладки
  MAG_Z: mm(-139),                       // ось шахты магазина
  RAIL_Z0: mm(-158), RAIL_Z1: mm(-44)    // боковая планка под кронштейн
};

/* ---------- зеркалирование меша по X (с разворотом обхода треугольников) ---------- */
function mirX(src) {
  var o = new Mesh(), i;
  for (i = 0; i < src.p.length; i += 3) {
    o.p.push(-src.p[i], src.p[i + 1], src.p[i + 2]);
    o.n.push(-src.n[i], src.n[i + 1], src.n[i + 2]);
  }
  for (i = 0; i < src.t.length; i++) o.t.push(src.t[i]);
  for (i = 0; i < src.e.length; i++) o.e.push(src.e[i]);
  for (i = 0; i < src.i.length; i += 3) o.i.push(src.i[i], src.i[i + 2], src.i[i + 1]);
  return o;
}
function both(m) { var o = new Mesh(); o.merge(m); o.merge(mirX(m)); return o; }
// плита в плоскости ZY, правая сторона: x ∈ [xIn, xIn+t]
function slabR(shape, holes, t, xIn, opt) { return exZY(shape, holes, t, xIn + t, opt); }
// симметричная пара одинаковых плит
function slabPair(shape, holes, t, xIn, opt) { return both(slabR(shape, holes, t, xIn, opt)); }

/* =========================================================================

            газоотвод, открытый прицел, ствольные накла����к��
   ========================================================================= */

  var ZB = GEO.Z_RB, ZF = GEO.Z_RF, RB = GEO.RY_B, RT = GEO.RY_T;

  /* ---------------- 1. СТВОЛЬНАЯ КОРОБКА ---------------- */
  // нижняя (сплошная) часть коробки: от низа до y = −5

    var p = new Path();
    p.move(ZF, RB);
    p.line(mm(-194), RB);
    p.quad(mm(-190), RB, mm(-188), mm(-40));      // прилив шахты магазина
    p.line(mm(-90), mm(-40));
    p.quad(mm(-86), RB, mm(-82), RB);
    p.line(mm(-46), RB);
    p.quad(mm(-42), RB, mm(-40), mm(-43));        // корпус УСМ
    p.line(mm(42), mm(-43));
    p.quad(mm(56), mm(-43), mm(60), mm(-28));     // хвостовик под приклад
    p.line(ZB, mm(-12));
    p.line(ZB, mm(-5));
    p.line(ZF, mm(-5));
    return p.done();
  })();
  add(exZYc(lowP, [], mm(32), 0, { bevel: mm(1.4) }), MAT.blue, body);

  // верхние стенки коробки (между ними ходит затворная рама)

    p.move(ZF, mm(-7));

  // окно выброса гильз (справа) и паз рукоятки перезаряжания

  add(slabR(upP, [portH, slotH], mm(8), mm(8), { bevel: mm(1.0) }), MAT.blue, body);
  add(mirX(slabR(upP, [], mm(8), mm(8), { bevel: mm(1.0) })), MAT.blue, body);
  // отражатель: приподнятая окантовка окна выброса
  add(slabR(roundRect(mm(66), mm(25), mm(6), mm(-178), mm(4)), [portH], mm(1.6), mm(16), { bevel: mm(0.5) }),

  // передняя опора ствола (вкладыш)

  // задний хвостовик коробки — площадка под приклад

  /* шахта магазина — сквозное окно снизу */
  // exXZ: профиль лежит в (x, z), экструзия идёт ВНИЗ от указанной высоты
  add(exXZ(roundRect(mm(40), mm(100), mm(9), 0, GEO.MAG_Z),

  /* защёлка магазина (позади шахты, перед скобой) */
  add(exZYc(roundRect(mm(15), mm(26), mm(5), mm(-80), mm(-46)), [], mm(18), 0, { bevel: mm(1.4) }), MAT.blueS, body);
  add(both(xf(boxRound(mm(3), mm(18), mm(9), mm(1.2), mm(0.5)), Mtrans(mm(9.5), mm(-48), mm(-80)))), MAT.blueS, body);

  /* штифты УСМ и цапфы */
  add(pinX(mm(2.6), mm(34), mm(-24), mm(-16)), MAT.bright, body);

  /* ---------------- 2. КРЫШКА СТВОЛЬНОЙ КОРОБКИ ---------------- */

  add(exXY(cov, [], mm(266), mm(-214), { bevel: mm(0.8) }), MAT.blue, dust);
  // продольные рёбра жёсткости
  add(both(xf(boxRound(mm(3.4), mm(3.0), mm(240), mm(1.0), mm(0.5)), Mtrans(mm(13.6), mm(28.5), mm(-90)))), MAT.blue, dust);

  /* ---------------- 3. СТВОЛ ---------------- */
  var brl = [
    [mm(64), 0], [mm(64), mm(16.5), true],
    [mm(-150), mm(16.5), true], [mm(-158), mm(14.4), true],
    [ZF, mm(14.4), true], [mm(-240), mm(12.6), true],
    [mm(-300), mm(12.2)], [mm(-472), mm(11.5)],
    [mm(-480), mm(12.6), true], [mm(-546), mm(12.6), true], [mm(-554), mm(10.4), true],
    [mm(-660), mm(9.9)], [mm(-780), mm(9.3)],
    [mm(-796), mm(9.2), true], [mm(-800), mm(10.4), true], [mm(-846), mm(10.4), true],
    [mm(-849), mm(9.3), true],
    [GEO.Z_MUZ, mm(9.3), true], [GEO.Z_MUZ, mm(4.7), true], [GEO.Z_MUZ + mm(5), mm(3.9), true],
    [mm(-700), mm(3.9)], [mm(64), mm(3.9)], [mm(64), 0]
  ];
  add(revolveZ(brl, 40, { smooth: 30 }), MAT.blue, body);
  // нарезы у дульного среза (4 шт.)
  for (var g = 0; g < 4; g++) {
    add(xf(boxRound(mm(1.5), mm(0.9), mm(44), mm(0.3), mm(0.15)),
      Mmuls(MrotZ(g / 4 * TAU + 0.4), Mtrans(0, mm(4.3), GEO.Z_MUZ + mm(23)))), MAT.dark, body);

  /* ---------------- 4. ПЛАМЕГАСИТЕЛЬ (щелевой, 5 окон) ---------------- */
  add(xf(tubeZ(mm(12.4), mm(9.0), mm(18), 28), Mtrans(0, 0, mm(-864))), MAT.blueS, body);

    add(xf(exXY(pp.done(), [], mm(38), mm(-902), { bevel: mm(0.5) }), MrotZ(a0)), MAT.blueS, body);
  }
  add(xf(tubeZ(mm(12.0), mm(9.0), mm(7), 28), Mtrans(0, 0, GEO.Z_FH)), MAT.blueS, body);

  /* ---------------- 5. ОСНОВАНИЕ МУШКИ С ПРЕДОХРАНИТЕЛЕМ ---------------- */
  add(xf(tubeZ(mm(14.6), mm(9.6), mm(46), 30), Mtrans(0, 0, mm(-846))), MAT.blue, body);

/* =========================================================================
   ЧАСТЬ 2: приклад, щека, рукоятка, УСМ, магазин, затворная рама, ПСО-1
   ========================================================================= */
function buildSVD2(add, N) {
  var body = N.body, bolt = N.bolt, trig = N.trig, mag = N.mag;
  var safety = N.safety, scope = N.scope;

  /* ---------------- 9. ДЕРЕВЯННЫЙ РАМОЧНЫЙ ПРИКЛАД СВД ----------------
     Одна цельная деталь: шейка — рукоятка — нижняя ветвь — затылок,
     внутри — большое окно-«скелет» под большой палец. Гребень выбран из
     массива и плавно поднимается к пятке — никаких накладок и хомутов сверху:
     на штатной СВД щека ложится прямо на дерево гребня. */
  var st = (function () {
    var p = new Path();
    p.move(mm(44), mm(16));
    p.quad(mm(64), mm(27), mm(96), mm(30));            // подъём на гребень
    p.quad(mm(150), mm(33), mm(212), mm(35));          // гребень
    p.quad(mm(268), mm(37), mm(296), mm(34));
    p.quad(mm(314), mm(32), mm(317), mm(21));          // пятка
    p.line(mm(319), mm(-16));
    p.quad(mm(318), mm(-28), mm(305), mm(-30));        // носок
    p.line(mm(236), mm(-31));
    p.quad(mm(178), mm(-32), mm(146), mm(-30));        // нижняя ветвь рамы
    p.quad(mm(124), mm(-29), mm(114), mm(-38));
    p.quad(mm(105), mm(-47), mm(100), mm(-64));        // задняя грань рукоятки
    p.line(mm(86), mm(-106));

/* ---------------- патрон 7,62×54R ---------------- */
function buildCartridge() {
  var m = new Mesh();
  var pr = [
    [0, 0], [0, mm(6.7), true], [mm(1.6), mm(6.9), true], [mm(2.4), mm(6.2), true],
    [mm(4.2), mm(6.2), true], [mm(4.8), mm(5.9)], [mm(38), mm(5.85)],
    [mm(43), mm(5.6)], [mm(46.5), mm(4.2)], [mm(48.5), mm(3.9), true], [mm(53.5), mm(3.87), true]
  ];
  m.merge(revolveZ(pr, 30));
  var bul = [
    [mm(53.5), 0], [mm(53.5), mm(3.9), true], [mm(60), mm(3.9)], [mm(66), mm(3.75)],
    [mm(70), mm(3.4)], [mm(73), mm(2.8)], [mm(75.5), mm(1.9)], [mm(77), mm(0.9)], [mm(77.5), 0]
  ];
  var b = revolveZ(bul, 30, { smooth: 50 });
  m.merge(b);
  return m;
}

/* ===== 06_audio.js ===== */
/* =========================================================================
   ПРОЦЕД��РНЫЙ ЗВУКОВОЙ ДВИЖО��
   Ни одного чистого тона с длинным затуханием — только шумовые транзиенты,
   резонансные фильтры с негармоническими частотами и короткими спадами,
   нелинейное насыщение и свёртка — именно так звучит металл и выстрел.
   ========================================================================= */
var AU = {
  ctx: null, ready: false, muted: false, env: 'outdoor',
  init: function () {
    if (this.ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    var c = this.ctx = new AC({ latencyHint: 'interactive' });
    var sr = c.sampleRate;

    // ---------- шумовые буферы ----------
    this.nz = c.createBuffer(2, sr * 2, sr);
    for (var ch = 0; ch < 2; ch++) {
      var d = this.nz.getChannelData(ch);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    // розовый шум (для низов и хвоста)
    this.pk = c.createBuffer(2, sr * 2, sr);
    for (ch = 0; ch < 2; ch++) {
      var o = this.pk.getChannelData(ch), b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (i = 0; i < o.length; i++) {
        var w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        o[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    }

    // ---------- шины ----------
    this.master = c.createGain(); this.master.gain.value = 0.85;
    this.limiter = c.createDynamicsCompressor();
    this.limiter.threshold.value = -10; this.limiter.knee.value = 4;
    this.limiter.ratio.value = 14; this.limiter.attack.value = 0.002; this.limiter.release.value = 0.22;
    this.drive = c.createWaveShaper();
    var n = 2048, curve = new Float32Array(n), k = 2.2;
    for (i = 0; i < n; i++) { var x = i / (n - 1) * 2 - 1; curve[i] = Math.tanh(x * k) / Math.tanh(k); }
    this.drive.curve = curve; this.drive.oversample = '4x';
    this.bus = c.createGain(); this.bus.gain.value = 1.0;
    this.bus.connect(this.drive); this.drive.connect(this.limiter);
    this.limiter.connect(this.master); this.master.connect(c.destination);

    // ---------- свёртка (реверберация открытого пространства) ----------
    var IRL = Math.floor(sr * 2.4);
    var ir = c.createBuffer(2, IRL, sr);
    for (ch = 0; ch < 2; ch++) {
      var a = ir.getChannelData(ch), lp = 0;
      for (i = 0; i < IRL; i++) {
        var t = i / sr;
        var decay = Math.pow(1 - i / IRL, 2.6);
        var v = (Math.random() * 2 - 1) * decay;
        lp += (v - lp) * (0.30 - 0.22 * (i / IRL));   // с временем глуше
        a[i] = lp * 0.9;
      }
      // ранние отражения
      [[0.021, 0.55], [0.037, 0.42], [0.058, 0.36], [0.089, 0.30], [0.131, 0.24], [0.187, 0.18], [0.256, 0.14]].forEach(function (er) {
        var idx = Math.floor((er[0] + (ch ? 0.004 : 0)) * sr);
        if (idx < IRL) a[idx] += er[1] * (ch ? -1 : 1);
      });
    }
    this.conv = c.createConvolver(); this.conv.buffer = ir;
    this.verbSend = c.createGain(); this.verbSend.gain.value = 0.55;
    this.verbLP = c.createBiquadFilter(); this.verbLP.type = 'lowpass'; this.verbLP.frequency.value = 3200;
    this.verbSend.connect(this.verbLP); this.verbLP.connect(this.conv); this.conv.connect(this.bus);

    // ---------- многократное эхо (раскат выстрела по местности) ----------
    this.echoSend = c.createGain(); this.echoSend.gain.value = 1.0;
    var taps = [[0.19, 0.30, 1500], [0.42, 0.20, 850], [0.72, 0.13, 520], [1.15, 0.075, 340]];
    this.taps = taps.map(function (tp) {
      var dl = c.createDelay(2.0); dl.delayTime.value = tp[0];

      var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = tp[2]; f.Q.value = 0.5;
      var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
      var pan = c.createStereoPanner(); pan.pan.value = (Math.random() * 2 - 1) * 0.6;
      AU.echoSend.connect(dl); dl.connect(f); f.connect(hp); hp.connect(g); g.connect(pan); pan.connect(AU.bus);
      return { dl: dl, g: g, f: f };
    });

    this.ready = true;
    return true;
  },
  resume: function () { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  now: function () { return this.ctx.currentTime; },
  setEnv: function (e) {

    this.env = e;
    var t = this.ctx.currentTime, indoor = e === 'studio';
    this.verbSend.gain.setTargetAtTime(indoor ? 0.30 : 0.60, t, 0.1);
    this.echoSend.gain.setTargetAtTime(indoor ? 0.12 : 1.0, t, 0.1);

  /* ---------- примитивы ---------- */
  src: function (pink, rate) {

  // шумовой всплеск с огибающей
  burst: function (t, dur, atk, peak, chain, pink, curveExp) {
    var c = this.ctx, s = this.src(pink);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    if (curveExp === 2) {
      g.gain.setTargetAtTime(0.0001, t + atk, dur * 0.22);
    } else {
      g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dur);
    }
    s.connect(g);
    var last = g;
    (chain || []).forEach(function (nd) { last.connect(nd); last = nd; });
    s.start(t + Math.random() * 0.001, Math.random() * 1.5);
    s.stop(t + atk + dur + 0.12);
    return last;
  },
  bq: function (type, f, q, gainDb) {
    var b = this.ctx.createBiquadFilter();
    b.type = type; b.frequency.value = f; if (q !== undefined) b.Q.value = q;
    if (gainDb !== undefined) b.gain.value = gainDb;

  gain: function (v) { var g = this.ctx.createGain(); g.gain.value = v; return g; },
  pan: function (v) { var p = this.ctx.createStereoPanner(); p.pan.value = v; return p; },

    if (verb) { var v = this.gain(verb); node.connect(v); v.connect(this.verbSend); }
    if (echo) { var e = this.gain(echo); node.connect(e); e.connect(this.echoSend); }

  /* ---------- удар металла о металл ----------
     Ключ к реализму: плотный набор НЕГАРМОНИЧЕСКИХ резонансов с КОРОТКИМ
     затуханием + широкополосный щелчок удара. Длинные чистые тоны = колокольчики. */
  metal: function (t, o) {
    o = o || {};
    var c = this.ctx, gain = o.gain === undefined ? 1 : o.gain;
    var pan = this.pan(o.pan || 0);
    var mix = this.gain(gain);
    pan.connect(mix);
    this.out(mix, o.dry === undefined ? 1 : o.dry, o.verb === undefined ? 0.25 : o.verb, o.echo || 0);
    var freqs = o.freqs || [730, 1290, 2170, 3310, 4870, 6900];
    var dec = o.decay === undefined ? 0.055 : o.decay;

      var d = dec * Math.pow(0.72, i) * (0.7 + Math.random() * 0.6);
      var bp = this.bq('bandpass', Math.min(f, 18000), q);
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(1 / (1 + i * 0.55), t + 0.0006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.0006 + d);
      var s = this.src(false);
      s.connect(bp); bp.connect(g); g.connect(pan);
      s.start(t, Math.random() * 1.5); s.stop(t + d + 0.05);
    }
    // широкополосный транзиент удара
    var hp = this.bq('highpass', o.clickHP || 1400, 0.7);
    var lpc = this.bq('lowpass', 12000, 0.6);
    this.burst(t, o.click === undefined ? 0.004 : o.click, 0.0004, o.clickGain === undefined ? 0.85 : o.clickGain, [hp, lpc, pan]);
    // низкочастотное тело удара (масса детали)
    if (body > 0) {
      var lp = this.bq('lowpass', o.bodyF || 220, 1.1);
      var pk = this.bq('peaking', o.bodyF || 180, 1.4, 8);
      this.burst(t, o.bodyDec || 0.075, 0.0015, body, [lp, pk, pan], true);
    }
  },

  // трение / скольжение металла
  scrape: function (t, dur, o) {
    o = o || {};
    var c = this.ctx, s = this.src(false, 1);
    var bp = this.bq('bandpass', o.f0 || 900, o.q || 3.2);
    bp.frequency.setValueAtTime(o.f0 || 900, t);

    g.gain.linearRampToValueAtTime((o.gain || 0.3), t + Math.min(0.02, dur * 0.2));
    // шероховатость: случайные микроскачки амплитуды
    var steps = Math.max(4, Math.floor(dur / 0.008));
    for (var i = 1; i < steps; i++) {
      var tt = t + dur * i / steps;
      g.gain.setValueAtTime((o.gain || 0.3) * (0.35 + Math.random() * 0.9) * (1 - i / steps * 0.55), tt);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.02);
    var pan = this.pan(o.pan || 0);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(pan);
    this.out(pan, 1, 0.18, 0);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.06);
  },

  // звон возвратной пружины (короткий, с быстрым тремоло, не колокол)
  spring: function (t, o) {
    o = o || {};
    var c = this.ctx, pan = this.pan(o.pan || 0.25);
    var mix = this.gain(o.gain === undefined ? 0.16 : o.gain);
    pan.connect(mix); this.out(mix, 1, 0.2, 0);
    var base = o.f || 1750;
    for (var i = 0; i < 4; i++) {
      var s = this.src(false);
      var bp = this.bq('bandpass', base * (1 + i * 0.61) * (0.9 + Math.random() * 0.2), 26);
      var g = c.createGain();
      var dur = (o.dur || 0.20) * (0.7 + Math.random() * 0.5);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.9 / (1 + i), t + 0.002);
      // быстрое дрожание амплитуды — витки пружины
      var k = 0;
      for (var tt = 0.004; tt < dur; tt += 0.0065 + Math.random() * 0.004) {
        k++;
        g.gain.setValueAtTime((0.9 / (1 + i)) * Math.exp(-tt * 14) * (0.3 + Math.random()), t + tt);
      }
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(pan);
      s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    }
  },

  /* ================== ВЫСТРЕЛ ================== */
  shot: function (when) {
    if (!this.ready || this.muted) return;
    var c = this.ctx, t = (when || c.currentTime) + 0.004;
    var vary = 0.94 + Math.random() * 0.12;

    // 1. УДАРНАЯ ВОЛНА — основа звука. Шум с мгновенной атакой и сваливающимся ФНЧ
    var lp = this.bq('lowpass', 11000, 0.9);
    lp.frequency.setValueAtTime(11000, t);
    lp.frequency.exponentialRampToValueAtTime(1400, t + 0.055);
    lp.frequency.exponentialRampToValueAtTime(260, t + 0.30);
    var pk1 = this.bq('peaking', 118, 1.1, 11);
    var pk2 = this.bq('peaking', 430, 1.6, -5);
    var hp0 = this.bq('highpass', 42, 0.6);
    var blastG = this.gain(1.05 * vary);
    this.burst(t, 0.34, 0.0006, 1.0, [lp, pk1, pk2, hp0, blastG]);
    this.out(blastG, 1.0, 0.85, 0.95);

    // 2. СВЕРХЗВУКОВОЙ ЩЁЛЧОК — очень короткий высокий транзиент
    var bpC = this.bq('bandpass', 3100, 0.85);
    var hpC = this.bq('highpass', 1500, 0.7);
    var crackG = this.gain(0.55 * vary);
    this.burst(t, 0.016, 0.00025, 1.0, [bpC, hpC, crackG]);
    this.out(crackG, 1.0, 0.25, 0.35);

    // 3. СРЕДНИЙ «ШЛЕПОК» — тело звука
    var bpM = this.bq('bandpass', 760, 0.55);
    var mg = this.gain(0.7 * vary);
    this.burst(t + 0.001, 0.085, 0.0008, 1.0, [bpM, mg]);
    this.out(mg, 1.0, 0.4, 0.5);

    // 4. НИЗКИЙ ТОЛЧОК — давление в груди (короткий свип, не тон)
    var so = c.createOscillator(); so.type = 'sine';
    so.frequency.setValueAtTime(135, t);
    so.frequency.exponentialRampToValueAtTime(42, t + 0.085);
    var sg = c.createGain();
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.linearRampToValueAtTime(0.85 * vary, t + 0.003);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    var slp = this.bq('lowpass', 320, 0.7);
    so.connect(sg); sg.connect(slp);
    this.out(slp, 1.0, 0.2, 0.3);
    so.start(t); so.stop(t + 0.2);

    // 5. ХВОСТ — глухой шум, уходящий в окружение
    var tlp = this.bq('lowpass', 1100, 0.5);
    var thp = this.bq('highpass', 110, 0.5);
    var tg = this.gain(0.34);
    this.burst(t + 0.02, 0.55, 0.02, 1.0, [tlp, thp, tg], true, 2);
    this.out(tg, 0.45, 1.0, 1.0);

    // 6. МЕХАНИКА АВТОМАТИКИ (газоотвод работает после выстрела)
    this.metal(t + 0.019, { freqs: [640, 1180, 1940, 3020, 4600], decay: 0.030, gain: 0.30, pan: 0.18, clickGain: 0.5, body: 0.25, bodyF: 190, verb: 0.12 });
    this.metal(t + 0.052, { freqs: [420, 890, 1520, 2480, 3900], decay: 0.045, gain: 0.42, pan: 0.10, body: 0.55, bodyF: 145, bodyDec: 0.10, clickGain: 0.6, verb: 0.15 });
    this.metal(t + 0.094, { freqs: [520, 980, 1760, 2900, 4400, 6100], decay: 0.038, gain: 0.46, pan: -0.06, body: 0.48, bodyF: 165, clickGain: 0.75, verb: 0.15 });
    this.spring(t + 0.055, { gain: 0.10, dur: 0.16, f: 2100, pan: 0.2 });
  },

  /* ---------- бряцанье патронов в СТАЛЬНОМ корпусе магазина ----------

      });

  // совместимость: старое имя (используется в impact)

  /* ================== ПЕРЕЗАРЯДКА ==================
     Разобрано по реальным фазам смены магазина СВД. Временная сетка

    this.metal(t + 0.10, {

      clickGain: 0.55, clickHP: 1500, body: 0.16, bodyF: 230, bodyDec: 0.028, pan: P
    });

    this.scrape(t + 0.155, 0.13, { f0: 300, f1: 820, q: 2.2, gain: 0.20, pan: P });
    this.magRattle(t + 0.17, 0.14, 0.075, P);
    // передний зацеп выходит из гнезда — глухой деревянный «клак», без звона

      body: 0.62, bodyF: 118, bodyDec: 0.085, clickGain: 0.30, clickHP: 700, pan: P, verb: 0.2
    });
    // магазин уходит вниз в руке: затухающее бряцанье патронов + шорох
    this.magRattle(t + 0.335, 0.26, 0.055, P - 0.06);
    this.cloth(t + 0.38, 0.22, { gain: 0.055, f: 750, pan: P - 0.1 });

    // рука в подсумке, магазин вытягивают из подсумка

    this.magRattle(t + 0.78, 0.22, 0.070, Q + 0.08);

    // передний зацеп заходит в гнездо — тяжёлый глухо�� удар массы
    this.thud(t + 1.075, { gain: 0.42, f: 128, dur: 0.10, pan: Q, verb: 0.3 });

    });
    this.magRattle(t + 1.09, 0.13, 0.085, Q);

    this.scrape(t + 1.16, 0.085, { f0: 520, f1: 1150, q: 2.6, gain: 0.17, pan: Q });

    });

    // рывок ладонью на контроль посадки — два глухих толчка
    this.thud(t + 1.40, { gain: 0.17, f: 160, dur: 0.05, pan: Q });
    this.cloth(t + 1.40, 0.09, { gain: 0.055, f: 1000, pan: Q });
    this.thud(t + 1.475, { gain: 0.12, f: 168, dur: 0.045, pan: Q });

    if (!withBolt) return;

    /* ---- ЦИКЛ ЗАТВОРА (только если рама была на затворной задержке) ---- */
    this.cloth(t + 1.72, 0.11, { gain: 0.075, f: 1100, pan: 0.34 });
    this.metal(t + 1.795, { freqs: [880, 1620, 2700, 4200], decay: 0.016, q: 14, gain: 0.26, clickGain: 0.5, pan: 0.36 });
    this.scrape(t + 1.805, 0.125, { f0: 640, f1: 2450, q: 3.2, gain: 0.30, pan: 0.32 });
    this.spring(t + 1.83, { gain: 0.15, dur: 0.20, f: 1600, pan: 0.36 });
    // рама бьёт в задний упор
    this.thud(t + 1.965, { gain: 0.55, f: 115, dur: 0.11, pan: 0.2, verb: 0.35 });
    this.metal(t + 1.968, {
      freqs: [330, 640, 1180, 2000, 3200], decay: 0.048, q: 11, gain: 0.52,
      body: 0.80, bodyF: 118, bodyDec: 0.10, clickGain: 0.65, pan: 0.2, verb: 0.35
    });
    // накат вперёд и ЗАПИРАНИЕ — самый громкий лязг всей перезарядки
    this.scrape(t + 2.10, 0.055, { f0: 1150, f1: 470, q: 2.3, gain: 0.22, pan: 0.14 });
    this.metal(t + 2.155, {
      freqs: [410, 790, 1450, 2500, 4050, 6100], decay: 0.070, q: 12, gain: 0.88,
      body: 1.0, bodyF: 126, bodyDec: 0.13, clickGain: 1.0, clickHP: 1150, pan: 0.05, verb: 0.45, echo: 0.15
    });
    this.metal(t + 2.192, { freqs: [1540, 2680, 4200, 6400], decay: 0.026, q: 18, gain: 0.32, clickGain: 0.45, pan: 0.1 });
  },
  dryFire: function (when) {
    if (!this.ready || this.muted) return;
    var t = when || this.ctx.currentTime;

  },

  },
  // зв��к попадания с учётом задержки звука (343 м/с)

      var g2 = this.gain(0.30 * Math.min(1, 60 / dist));

  },

    if (!this.ready || this.amb) return;

    var hp = this.bq('highpass', 120, 0.5);

    s.connect(lp); lp.connect(hp); hp.connect(g); g.connect(this.bus);
    s.start(0);
    // медленные порывы
    var lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
    var lg = c.createGain(); lg.gain.value = 0.5;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start(0);

  },
  setAmbience: function (v) {
    if (this.amb) this.amb.g.gain.setTargetAtTime(v * 0.05, this.ctx.currentTime, 0.4);
  }
};

/* ================= ОКРУЖЕНИЕ, МИШЕНИ, ЧАСТИЦЫ, ГИЛЬЗЫ ================= */
var GROUND_Y = -1.55;
var TARGETS = [];

function buildEnvironment(add, N) {
  /* ---- земля ---- */
  var g = new Mesh(), S = 700, SEG = 36;
  for (var i = 0; i < SEG; i++) for (var j = 0; j < SEG; j++) {
    var x0 = -S / 2 + S * i / SEG, x1 = -S / 2 + S * (i + 1) / SEG;
    var z0 = -S * 0.78 + S * j / SEG, z1 = -S * 0.78 + S * (j + 1) / SEG;
    function hgt(x, z) {
      var d = Math.hypot(x, z + 60);
      return Math.sin(x * 0.055) * 0.22 + Math.cos(z * 0.041) * 0.28 + Math.sin((x + z) * 0.017) * 0.55
        - Math.exp(-d * d / 9000) * 0.4;
    }
    // аналитическая нормаль рельефа: без неё земля выглядит плоским серым листом
    function nrm(x, z) {
      var e = 0.75;
      var dx = (hgt(x + e, z) - hgt(x - e, z)) / (2 * e);
      var dz = (hgt(x, z + e) - hgt(x, z - e)) / (2 * e);
      var L = Math.sqrt(dx * dx + 1 + dz * dz);
      return [-dx / L, 1 / L, -dz / L];
    }
    var na = nrm(x0, z0), nb = nrm(x1, z0), nc = nrm(x1, z1), nd = nrm(x0, z1);
    var a = g.v(x0, GROUND_Y + hgt(x0, z0), z0, na[0], na[1], na[2], x0 * 0.1, z0 * 0.1);
    var b = g.v(x1, GROUND_Y + hgt(x1, z0), z0, nb[0], nb[1], nb[2], x1 * 0.1, z0 * 0.1);
    var c = g.v(x1, GROUND_Y + hgt(x1, z1), z1, nc[0], nc[1], nc[2], x1 * 0.1, z1 * 0.1);
    var d2 = g.v(x0, GROUND_Y + hgt(x0, z1), z1, nd[0], nd[1], nd[2], x0 * 0.1, z1 * 0.1);
    g.tri(a, b, c); g.tri(a, c, d2);
  }
  add(g, MAT.ground, N.range, { shadow: false });

  /* ---- дальние холмы ---- */
  var hills = new Mesh();
  for (var h = 0; h < 9; h++) {
    var ang = -1.35 + h * 0.34 + Math.sin(h * 5.1) * 0.06;
    var dist = 620 + Math.sin(h * 3.7) * 180;
    var hx = Math.sin(ang) * dist, hz = -Math.cos(ang) * dist;
    var hh = 55 + Math.sin(h * 2.3) * 30, hr = 210 + Math.cos(h * 1.7) * 90;
    var m = new Mesh(), rings = 6, seg = 20;
    for (var r = 0; r <= rings; r++) {
      for (var s = 0; s <= seg; s++) {
        var t = r / rings, aa = s / seg * TAU;
        var rad2 = hr * (1 - t * t * 0.92);
        var y = hh * Math.sin(t * PI * 0.5) * (0.85 + 0.3 * Math.sin(aa * 3 + h));
        m.v(Math.cos(aa) * rad2 * (1 + 0.18 * Math.sin(aa * 2.7 + h)), y - 12, Math.sin(aa) * rad2 * (1 + 0.14 * Math.cos(aa * 3.1)), 0, 1, 0, s / seg, t);
      }
    }
    for (r = 0; r < rings; r++) for (s = 0; s < seg; s++) {
      var i0 = r * (seg + 1) + s, i1 = i0 + 1, i2 = i0 + seg + 1, i3 = i2 + 1;
      m.tri(i0, i2, i1); m.tri(i1, i2, i3);
    }
    hills.merge(m, Mtrans(hx, GROUND_Y, hz));
  }
  add(hills, new Mat({ base: hex(0x3c4432), metal: 0, rough: 1.0, kind: 7, wear: 0 }), N.range, { shadow: false });

  /* ---- мишени ---- */
  var dists = [100, 200, 300, 400];
  dists.forEach(function (d, idx) {
    var node = N['target' + idx];
    var scale = 1 + idx * 0.30;
    var w = 0.62 * scale, hh2 = 0.62 * scale;
    var post = new Mesh();
    post.merge(xf(boxRound(0.075, 1.25, 0.075, 0.02, 0.008), Mtrans(-w * 0.36, GROUND_Y + 0.62, 0)));
    post.merge(xf(boxRound(0.075, 1.25, 0.075, 0.02, 0.008), Mtrans(w * 0.36, GROUND_Y + 0.62, 0)));
    post.merge(xf(boxRound(w * 1.1, 0.06, 0.05, 0.015, 0.006), Mtrans(0, GROUND_Y + 1.16, 0)));
    add(post, MAT.woodPost, node, { shadow: idx < 2 });
    var board = exXY(roundRect(w, hh2, 0.03, 0, GROUND_Y + 1.52), [], 0.028, 0.014, { bevel: 0.006 });
    add(board, MAT.paper, node, { shadow: idx < 2 });
    // чёрные концентрические кольца
    var rings2 = new Mesh();
    for (var k = 0; k < 4; k++) {
      var ro = (0.235 - k * 0.052) * scale, ri = (0.205 - k * 0.052) * scale;
      if (ri <= 0.004) break;
      rings2.merge(exXY(ellipseRing(ro, ro, 0, GROUND_Y + 1.52, 40), [ellipseRing(ri, ri, 0, GROUND_Y + 1.52, 40)], 0.002, 0.012));
    }
    rings2.merge(exXY(ellipseRing(0.030 * scale, 0.030 * scale, 0, GROUND_Y + 1.52, 24), [], 0.002, 0.012));
    add(rings2, MAT.paperB, node, { shadow: false });
    // табличка с дистанцией
    add(exXY(roundRect(0.26, 0.10, 0.02, 0, GROUND_Y + 1.10), [], 0.02, 0.02), MAT.paperB, node, { shadow: false });
    TARGETS.push({ node: node, z: -d, dist: d, w: w, h: hh2, cy: GROUND_Y + 1.52, scale: scale });
  });

  /* ---- стол для студийного режима ---- */
  var tbl = new Mesh();
  tbl.merge(xf(boxRound(3.4, 0.05, 2.0, 0.02, 0.006), Mtrans(0, -0.30, 0)));
  add(tbl, new Mat({ base: hex(0x1a1a1d), metal: 0.05, rough: 0.62, kind: 4, wear: 0 }), N.studio, { shadow: false });
}

var SHELLS = { pool: [], idx: 0 };
function initShells(add, mkNode) {
  var caseMesh = buildCase();
  for (var i = 0; i < 8; i++) {
    var n = mkNode('shell' + i);
    var b = add(caseMesh, MAT.brass, n, { shadow: false });
    b.visible = false;
    SHELLS.pool.push({ node: n, batch: b, alive: false, p: [0, 0, 0], v: [0, 0, 0], q: [Math.random(), Math.random(), Math.random()], w: [0, 0, 0], t: 0, landed: 0 });
  }
}
function buildCase() {
  var m = new Mesh();
  m.merge(revolveZ([
    [0, 0], [0, mm(6.7), true], [mm(1.6), mm(6.9), true], [mm(2.4), mm(6.2), true],
    [mm(4.2), mm(6.2), true], [mm(4.8), mm(5.9)], [mm(38), mm(5.85)],
    [mm(43), mm(5.6)], [mm(46.5), mm(4.2)], [mm(48.5), mm(3.95), true], [mm(53.5), mm(3.92), true],
    [mm(53.5), mm(3.35), true], [mm(46), mm(3.5)], [mm(6), mm(5.3), true], [mm(6), 0]
  ], 26));
  return m;
}
function ejectShell(pos, vel, spin) {
  var s = SHELLS.pool[SHELLS.idx % SHELLS.pool.length]; SHELLS.idx++;
  s.alive = true; s.batch.visible = true; s.t = 0; s.landed = 0;
  s.p = [pos[0], pos[1], pos[2]];
  s.v = [vel[0], vel[1], vel[2]];
  s.q = [Math.random() * TAU, Math.random() * TAU, Math.random() * TAU];
  s.w = [(Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin * 0.6, (Math.random() - 0.5) * spin];
  return s;
}
function updateShells(dt) {
  for (var i = 0; i < SHELLS.pool.length; i++) {
    var s = SHELLS.pool[i];
    if (!s.alive) continue;
    s.t += dt;
    if (s.t > 7) { s.alive = false; s.batch.visible = false; continue; }
    if (s.landed < 3) {
      s.v[1] -= 9.81 * dt;
      s.p[0] += s.v[0] * dt; s.p[1] += s.v[1] * dt; s.p[2] += s.v[2] * dt;
      s.q[0] += s.w[0] * dt; s.q[1] += s.w[1] * dt; s.q[2] += s.w[2] * dt;
      var floor = GROUND_Y + 0.012;
      if (s.p[1] < floor) {
        s.p[1] = floor; s.landed++;
        s.v[1] = -s.v[1] * 0.34; s.v[0] *= 0.6; s.v[2] *= 0.6;
        s.w[0] *= 0.5; s.w[1] *= 0.5; s.w[2] *= 0.5;
        if (s.landed === 1) AU.shellLand();
        if (Math.abs(s.v[1]) < 0.35) { s.landed = 3; s.q[0] = PI / 2; s.w = [0, 0, 0]; }
      }
    }
    Mmuls2(s.node.local, Mtrans(s.p[0], s.p[1], s.p[2]), MrotY(s.q[1]), MrotX(s.q[0]), MrotZ(s.q[2]), Mtrans(0, 0, -mm(27)));
  }
}

        P.add('clampNut', 'steelDk', tr(cylX(6.6, 6.6, xHead, xHead + O.side * 3.4, 22), 0, -RAIL.bevel - 1.4, zc));
        P.addAll(knurlBand({ r: 6.6, seg: 22, n: 18, depth: 0.55, axis: 'x',
          a0: xHead, a1: xHead + O.side * 3.4, at: [0, -RAIL.bevel - 1.4, zc], mat: 'steelDk' }));
      } else if (O.style === 'qd') {

        P.add('qdSpring', 'steel', tr(cylX(3.1, 3.1, ax + O.side * 5.0, ax + O.side * 6.2, 16), 0, -RAIL.bevel - 1.4, zc));

      }

  /* шестигранная головка вдоль X (толщина t, «размер под ключ» 2r) */

    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + PI / 6; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
    const g = extrudeX(round(pts, 0.18), { z0: 0, z1: (dir < 0 ? -t : t), ch: 0.25 });
    /* утопленный шестигранник под ключ */
    const key = [];
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; key.push([Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52]); }
    const hole = extrudeX(round(key, 0.1), { z0: (dir < 0 ? -t * 0.98 : t * 0.98), z1: (dir < 0 ? -t * 0.25 : t * 0.25), ch: 0.1 });
    return merge([g, hole]);
  }

  /* винт с цилиндрической головкой и шлицем Torx, ось +Z */
  function capScrew(d, len, headH) {
    const r = d / 2, hR = r * 1.55, hH = headH === undefined ? r * 0.95 : headH;
    const g = [cyl(r, r, -len, 0, 18, true), cyl(hR, hR, 0, hH, 22, true)];
    /* шлиц Torx — шесть лепестков-впадин */
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      g.push(tr(cyl(hR * 0.19, hR * 0.19, hH - 0.55, hH + 0.02, 10, true), Math.cos(a) * hR * 0.42, Math.sin(a) * hR * 0.42, 0));
    }
    g.push(cyl(hR * 0.36, hR * 0.36, hH - 0.55, hH + 0.02, 14, true));

  /* Кольцевая насечка: n продольных или ромбических валиков по радиусу r.
     axis: 'z' (по умолчанию) | 'x'; для 'x' задаются a0/a1 и точка at. */
  function knurlBand(o) {
    const O = Object.assign({ r: 10, z0: 0, z1: 10, n: 24, depth: 0.42, seg: 8, mat: 'steel', axis: 'z', at: [0, 0, 0] }, o);
    const P = bag();
    const zA = O.axis === 'x' ? O.a0 : O.z0, zB = O.axis === 'x' ? O.a1 : O.z1;
    const len = Math.abs(zB - zA);
    const g = [];
    for (let i = 0; i < O.n; i++) {
      const a = i / O.n * TAU;
      const rib = cyl(O.depth, O.depth * 0.75, Math.min(zA, zB) + 0.3, Math.max(zA, zB) - 0.3, 6, false);
      g.push(tr(rib, Math.cos(a) * O.r, Math.sin(a) * O.r, 0));
    }
    let m = merge(g);
    if (O.axis === 'x') m = tr(ry(m, PI / 2), O.at[0], O.at[1], O.at[2]);

    return P.list;
  }

  /* Продольные рифления на плоскости y = const (кнопки, площадки) */
  function ribsZ(n, z0, z1, x0, x1, y, h, w) {
    const g = [];
    for (let i = 0; i < n; i++) {
      const zc = z0 + (z1 - z0) * (i + 0.5) / n;
      g.push(boxZ(x0, y - h, x1, y + h * 0.1, zc - w / 2, zc + w / 2, w * 0.45, 0.1));
    }
    return merge(g);
  }

  /* -------------------------------------------------------- резьба */
  /* Витки резьбы как наклонная спираль — видно на срезе дульного устройства. */
  function threadHelix(rOut, rIn, z0, z1, pitch, seg) {
    const turns = Math.abs(z1 - z0) / pitch;
    const steps = Math.max(12, Math.round(turns * (seg || 26)));
    const rings = [];
    const K = 7;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, a = t * turns * TAU, z = z0 + (z1 - z0) * t;
      const cx = Math.cos(a), cy = Math.sin(a);
      const ring = [];
      const rm = (rOut + rIn) / 2, w = (rOut - rIn) / 2, h = pitch * 0.34;
      for (let k = 0; k < K; k++) {
        const b = k / K * TAU;
        const dr = Math.cos(b) * w, dz = Math.sin(b) * h;
        ring.push([cx * (rm + dr), cy * (rm + dr), z + dz]);
      }
      rings.push(ring);
    }
    return loft(rings, true, true);
  }

  /* ------------------------------------------------------- оптика */
  /* Линза: двояковыпуклое стекло радиуса r, стрелка прогиба sag, центр в z. */
  function lens(r, thick, sagF, sagB, seg) {

  /* Кольцо-оправа линзы с резьбовым буртиком */
  function lensRing(rIn, rOut, z0, z1) {
    return lathe([
      { r: rIn, z: z0 }, { r: rOut, z: z0 }, { r: rOut, z: z1 }, { r: rIn, z: z1 }
    ], 48, true);
  }

  /* Сетка прицела как набор плоских полос в плоскости z = zR */
  function reticleShapes(list, zR) {
    const g = [];
    for (const s of list) {
      if (s.k === 'bar') g.push(boxZ(s.x0, s.y0, s.x1, s.y1, zR, zR + 0.05, 0, 0));
      else if (s.k === 'dot') g.push(tr(cyl(s.r, s.r, zR, zR + 0.05, 16, true), s.x || 0, s.y || 0, 0));
      else if (s.k === 'ring') g.push(tr(tube(s.r - s.w, s.r, zR, zR + 0.05, 64), s.x || 0, s.y || 0, 0));
      else if (s.k === 'chevron') {
        const t = s.w, h = s.h, x = s.x || 0, y = s.y || 0;
        g.push(tr(extrude(round([[-h, -h], [-h + t, -h], [0, -t * 0.4], [h - t, -h], [h, -h], [0, t * 0.6]], 0), { z0: zR, z1: zR + 0.05 }), x, y, 0));
      }
    }
    return merge(g);
  }

  /* ------------------------------------------------- прочая мелочёвка */
  /* Витая пружина вдоль Z */
  function spring(R, wire, z0, z1, turns, seg) {
    const steps = Math.max(24, Math.round(turns * (seg || 20)));
    const rings = [], K = 6;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, a = t * turns * TAU, z = z0 + (z1 - z0) * t;
      const cx = Math.cos(a), cy = Math.sin(a);
      const ring = [];
      for (let k = 0; k < K; k++) {
        const b = k / K * TAU;
        ring.push([cx * (R + Math.cos(b) * wire), cy * (R + Math.cos(b) * wire), z + Math.sin(b) * wire]);
      }
      rings.push(ring);
    }
    return loft(rings, true, true);
  }

  /* Крышка батарейного отсека с накаткой и уплотнением */
  function batteryCap(r, z0, z1, mat) {
    const P = bag();
    P.add('battCap', mat || 'anod', lathe([
      { r: 0, z: z0 }, { r: r * 0.92, z: z0 }, { r: r, z: z0 + 0.8, s: true },
      { r: r, z: z1 - 0.6, s: true }, { r: r * 0.86, z: z1 }, { r: 0, z: z1 }
    ], 36, true));
    P.addAll(knurlBand({ r: r + 0.06, z0: z0 + 1.0, z1: z1 - 1.0, n: 26, depth: 0.32, mat: mat || 'anod' }));
    P.add('battSeal', 'rubber', tube(r * 0.80, r * 0.94, z0 - 0.7, z0 - 0.1, 30));
    return P.list;
  }

  /* Резиновая кнопка-«пятак» с рифлением, ось +Y */
  function padButton(r, y0, h, at) {
    const g = [
      tr(cylY(r, r * 0.96, y0, y0 + h, 24), at[0], 0, at[2]),
      tr(rx(lathe([{ r: 0, z: 0 }, { r: r * 0.96, z: 0 }, { r: r * 0.72, z: h * 0.45, s: true }, { r: 0, z: h * 0.55 }], 24, true), -PI / 2), at[0], y0 + h, at[2])
    ];
    return merge(g);
  }

  return {
    PI, TAU, D, MATS, RAIL,
    bag, boxZ, boxC, plateZY, cylX, cylY, sphere,
    railCrossSection, railStrip, railSlotZ, railClamp, hexHeadX, capScrew,
    knurlBand, ribsZ, threadHelix, lens, lensRing, reticleShapes, spring, batteryCap, padButton
  };
};

      P.add('fin', O.mat, tr(tube(R_BODY - 0.2, R_BODY + 1.3, -1.0, 1.0, 40), 0, 0, Z_LENS + 34 + i * 6));
    P.addAll(knurlBand({ r: R_BODY + 0.05, z0: Z_LENS + 70, z1: Z_TAIL - 8, n: 34, depth: 0.42, mat: O.mat }));
    P.addAll(tailCap(R_BODY + 0.8, Z_TAIL, 9, O.mat));

    P.add('ringMount', O.mat, tr(tube(R_BODY, R_BODY + 3.4, -9, 9, 36), 0, 0, -10));
    P.add('ringGap', O.mat, boxC(0, -R_BODY - 3.0, -10, 8.0, 7.0, 18, 1.0, 0.3));
    P.add('ringScrew', 'steel', tr(rx(capScrew(3.0, 8, 1.5), PI), 0, -R_BODY - 6.6, -10));
    P.add('mountArm', O.mat, boxC(0, -Y / 2 - 1, -10, 16, Y - 8, 22, 1.6, 0.3));
    P.add('mountFoot', O.mat, boxC(0, -Y + 4.0, -10, 24, 8.0, 40, 1.6, 0.3));
    P.add('remotePad', 'rubber', tr(boxC(0, 0, 0, 22, 4.2, 30, 3.0, 0.4), 0, -Y + 3.0, 42));
    P.add('remoteCable', 'rubber', (() => {
      const rings = [];
      for (let i = 0; i <= 18; i++) {
        const t = i / 18, z = 24 + t * 20, y = -Y + 6 + Math.sin(t * PI) * 5.5, x = (1 - t) * (R_BODY + 1.5);
        const ring = [];
        for (let k = 0; k < 7; k++) { const b = k / 7 * TAU; ring.push([x + Math.cos(b) * 1.5, y + Math.sin(b) * 1.5, z]); }
        rings.push(ring);
      }
      return loft(rings, true, true);
    })());

    const lift = G.mTrans(0, Y, 0);
    for (const p of P.list) G.transform(p.geo, lift);
    for (const p of railClamp({ len: 40, style: 'thumb', side: 1, lugs: [-10.16, 10.16], base: 4.0, width: 24 }))
      P.add(p.name, p.mat, tr(p.geo, 0, 0, -10));

    return { parts: P.list, meta: {
      slot: 'tactical', name: 'Тактический фонарь', short: 'ФОНАРЬ', weight: 168,
      emitter: { pos: [0, Y, Z_LENS + 4], dir: [0, 0, -1], type: 'light',
        hotAngle: 0.125, spillAngle: 0.40, color: 0xfff1dc, lumens: 1000 },
      toggle: ['off', 'low', 'high', 'strobe'],
      glass: ['lens'], emissive: ['led'],
      stats: { adsSpeed: -2, hipSpread: 0, stealth: -15, visibility: 40 } } };
  };

  /* ==================================================================
     2. ЛЦУ / ИК-блок: корпус 40×35×75, видимый и ИК каналы, винты пристрелки
     ================================================================== */
  OUT.laser_dbal = function (o) {
    const O = Object.assign({ mat: 'od' }, o || {});
    const P = bag();
    const BW = 40, BH = 35, BL = 75, CLAMP_H = 12.6;
    const BY = CLAMP_H + BH / 2, TOP = BY + BH / 2, EMIT_Y = BY + 4;
    const ZF = -BL / 2, ZB = BL / 2;

    P.add('body', O.mat, boxC(0, BY, 0, BW, BH, BL, 3.0, 0.8));
    /* облегчающие карманы: неглубокая утопленная панель с рамкой по контуру */
    for (const s of [-1, 1]) {
      const px = s * (BW / 2 - 0.9);
      P.add('pocket', 'anodMatt', boxC(px, BY, 2, 1.8, BH - 13, BL - 24, 3.0, 0.4));
      for (const dy of [-1, 1])
        P.add('pocketEdge', O.mat, boxC(s * (BW / 2 + 0.15), BY + dy * (BH - 12) / 2, 2, 0.9, 1.8, BL - 22, 0.4, 0.15));
      for (const dz of [-1, 1])
        P.add('pocketEdge', O.mat, boxC(s * (BW / 2 + 0.15), BY, 2 + dz * (BL - 22) / 2, 0.9, BH - 11, 1.8, 0.4, 0.15));
    }
    for (const [dx, nm, mat] of [[-9.5, 'emitVis', 'laserRed'], [9.5, 'emitIR', 'laserIR']]) {
      P.add('emitWell', O.mat, tr(cyl(7.5, 7.5, ZF, ZF + 4, 24, true), dx, EMIT_Y, 0));
      P.add('emitBore', 'bore', tr(tube(5.6, 6.0, ZF - 0.4, ZF + 3.6, 24), dx, EMIT_Y, 0));
      P.add(nm, mat, tr(cyl(3.6, 3.6, ZF + 1.0, ZF + 1.4, 20, true), dx, EMIT_Y, 0));
      P.add(nm + 'Lens', 'glassAR', tr(lens(3.9, 1.4, 0.2, 0.2, 20), dx, EMIT_Y, ZF + 2.0));
    }
    for (const [pos, dir] of [[[-9.5, TOP, ZF + 16], 'up'], [[BW / 2, EMIT_Y, ZF + 16], 'right']]) {
      const g = [cyl(4.5, 4.5, 0, 1.6, 22, true), cyl(2.5, 2.5, 1.6, 4.0, 20, true),
        boxZ(-2.3, -0.4, 2.3, 0.4, 3.6, 4.2, 0.1, 0), boxZ(-0.4, -2.3, 0.4, 2.3, 3.6, 4.2, 0.1, 0)];
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU;
        g.push(tr(cyl(0.34, 0.34, 0.2, 1.0, 8, true), Math.cos(a) * 5.6, Math.sin(a) * 5.6, 0));
      }
      let m = merge(g);
      m = dir === 'up' ? rx(m, -PI / 2) : ry(m, PI / 2);
      P.add('zeroScrew', 'steelDk', tr(m, pos[0], pos[1], pos[2]));
    }
    P.add('modeDial', 'steelDk', tr(lathe([{ r: 0, z: 0 }, { r: 8.5, z: 0 },
      { r: 8.5, z: 4.5, s: true }, { r: 7.0, z: 5.4 }, { r: 0, z: 5.4 }], 28, true), 0, BY, ZB));
    for (const k of knurlBand({ r: 8.55, z0: 0.8, z1: 4.0, n: 24, depth: 0.38, mat: 'steelDk' }))
      P.add(k.name, k.mat, tr(k.geo, 0, BY, ZB));
    P.add('modePointer', 'mark', boxC(0, BY + 6.2, ZB + 3.0, 1.4, 4.4, 1.0, 0.2, 0.1));
    for (let i = 0; i < 4; i++) {
      const a = D(-60 + i * 40);
      P.add('modeMark', 'mark', tr(cyl(0.45, 0.45, 0, 1.0, 8, true),
        Math.sin(a) * 10.5, BY + Math.cos(a) * 10.5, ZB + 0.2));
    }
    P.add('battDoor', O.mat, boxC(0, CLAMP_H + 3.0, ZB - 22, BW - 8, 5.0, 30, 2.0, 0.3));
    P.add('battScrew', 'steel', tr(rx(capScrew(3.0, 6, 1.4), PI), 0, CLAMP_H + 1.0, ZB - 34));
    P.add('pushButton', 'rubber', tr(padButton(5.0, 0, 2.0, [0, 0, 0]), -12, TOP, ZB - 12));
    P.add('remotePort', 'steelDk', tr(ry(cyl(3.0, 3.0, 0, 4.0, 16, true), -PI / 2), -BW / 2 - 2, BY - 8, ZB - 8));

    for (const p of railClamp({ len: 66, style: 'thumb', side: 1, lugs: [-20.32, -10.16, 0, 10.16], base: 4.2, width: 30 }))
      P.add(p.name, p.mat, p.geo);

    return { parts: P.list, meta: {
      slot: 'tactical', name: 'ЛЦУ / ИК-блок', short: 'ЛЦУ', weight: 260,
      emitter: { pos: [-9.5, EMIT_Y, ZF], dir: [0, 0, -1], type: 'laser',
        color: 0xff2020, divergence: 0.0006, beamR: 0.9 },
      emitterIR: { pos: [9.5, EMIT_Y, ZF], dir: [0, 0, -1], type: 'ir', color: 0x330404 },
      toggle: ['off', 'visible', 'ir', 'ir_illum'],
      glass: ['emitVisLens', 'emitIRLens'], emissive: ['emitVis', 'emitIR'],
      stats: { adsSpeed: -1, hipSpread: -22, precision: 4, stealth: -10 } } };
  };

  /* ==================================================================
     3. Комбо-блок «свет + лазер»
     ================================================================== */
  OUT.combo_light_laser = function () {
    const P = bag();
    const W = 46, H = 30, L = 82, CY = 6.0 + H / 2;

    P.add('body', 'anod', boxC(0, CY, 0, W, H, L, 3.4, 0.8));
    P.add('lightTube', 'anod', tr(lathe([{ r: 0, z: -L / 2 - 6 }, { r: 13.0, z: -L / 2 - 6 },
      { r: 13.0, z: -L / 2 + 2, s: true }, { r: 11.5, z: -L / 2 + 6 }, { r: 0, z: -L / 2 + 6 }], 34, true), -11.5, CY, 0));
    P.add('reflector', 'steel', (() => {
      const pr = [];
      for (let i = 0; i <= 18; i++) { const rr = 1.2 + 9.4 * (i / 18); pr.push({ r: rr, z: -L / 2 + 14 - rr * rr / 9, s: true }); }
      for (let i = 18; i >= 0; i--) { const rr = 1.2 + 9.4 * (i / 18); pr.push({ r: rr, z: -L / 2 + 14.5 - rr * rr / 9, s: true }); }
      return tr(lathe(pr, 40, true), -11.5, CY, 0);
    })());
    P.add('lightLens', 'glass', tr(lens(10.6, 2.0, 0, 0, 30), -11.5, CY, -L / 2 - 1.5));
    P.add('led', 'lampHot', tr(cyl(1.8, 1.8, 0, 0.8, 14, true), -11.5, CY, -L / 2 + 13.5));
    P.add('laserWell', 'anod', tr(cyl(6.8, 6.8, -L / 2 - 4, -L / 2 + 3, 24, true), 12.0, CY + 2, 0));
    P.add('laserBore', 'bore', tr(tube(4.8, 5.2, -L / 2 - 4.4, -L / 2 + 2.6, 22), 12.0, CY + 2, 0));
    P.add('laserDiode', 'laserRed', tr(cyl(3.2, 3.2, -L / 2 - 2.6, -L / 2 - 2.2, 18, true), 12.0, CY + 2, 0));
    P.add('laserLens', 'glassAR', tr(lens(3.4, 1.2, 0.2, 0.2, 18), 12.0, CY + 2, -L / 2 - 1.6));
    for (const [dx, nm] of [[-11.5, 'swLight'], [12.0, 'swLaser']])
      P.add(nm, 'rubber', tr(padButton(4.4, 0, 1.8, [0, 0, 0]), dx, CY + H / 2, L / 2 - 10));
    P.add('modeSlider', 'steelDk', boxC(0, CY + H / 2 + 1.0, L / 2 - 28, 7.0, 4.0, 16, 1.2, 0.3));
    for (const p of batteryCap(9.0, 0, 6.0, 'anod'))
      P.add(p.name, p.mat, tr(rx(p.geo, -PI / 2), 0, 6.5, L / 2 - 6));
    for (const p of railClamp({ len: 60, style: 'thumb', side: 1, lugs: [-10.16, 0, 10.16], base: 4.2, width: 30 }))
      P.add(p.name, p.mat, p.geo);

    return { parts: P.list, meta: {
      slot: 'tactical', name: 'Комбо-блок свет+лазер', short: 'КОМБО', weight: 310,
      emitter: { pos: [-11.5, CY, -L / 2 - 2], dir: [0, 0, -1], type: 'light',
        hotAngle: 0.14, spillAngle: 0.44, color: 0xfff0d8, lumens: 800 },
      emitterLaser: { pos: [12.0, CY + 2, -L / 2 - 2], dir: [0, 0, -1], type: 'laser', color: 0xff2020 },
      toggle: ['off', 'light', 'laser', 'both'],
      glass: ['lightLens', 'laserLens'], emissive: ['led', 'laserDiode'],
      stats: { adsSpeed: -3, hipSpread: -18, stealth: -18, visibility: 35 } } };
  };

  /* ==================================================================
     4. Вертикальная передняя рукоятка: колонна с «талией» и насечкой
     ================================================================== */
  OUT.grip_vertical = function (o) {
    const O = Object.assign({ mat: 'fde', len: 108 }, o || {});
    const P = bag();
    const L = O.len, TOP = -4.0;

    const rings = [], N = 26;
    for (let i = 0; i <= N; i++) {
      const t = i / N, y = TOP - t * L;
      const waist = 1 - 0.14 * Math.sin(t * PI) + 0.10 * Math.pow(t, 2.4);
      const a = 13.6 * waist, b = 15.4 * waist, ring = [];
      for (let k = 0; k < 28; k++) {
        const th = k / 28 * TAU, cs = Math.cos(th), sn = Math.sin(th), p = 2.7;
        ring.push([a * Math.sign(cs) * Math.pow(Math.abs(cs), 2 / p), y,
          b * Math.sign(sn) * Math.pow(Math.abs(sn), 2 / p)]);
      }
      rings.push(ring);
    }
    P.add('column', O.mat, loft(rings, true, true));
    P.add('capBottom', O.mat, tr(rx(lathe([{ r: 0, z: 0 }, { r: 13.2, z: 0 },
      { r: 13.6, z: 2.6, s: true }, { r: 12.0, z: 4.4 }, { r: 0, z: 4.4 }], 30, true), PI / 2),
      0, TOP - L - 0.4, 0));
    P.add('capScrew', 'steel', tr(rx(capScrew(3.0, 7, 1.4), PI), 0, TOP - L - 4.8, 0));
    for (let i = 0; i < 14; i++) {
      const y = TOP - 14 - i * (L - 26) / 14;
      for (const sz of [-1, 1])
        P.add('grooveRib', O.mat, tr(ry(cyl(1.15, 1.15, -11.5, 11.5, 8, false), PI / 2), 0, y, sz * 14.6));
    }
    for (const sx of [-1, 1])
      P.add('fingerSwell', O.mat, tr(sphere(6.2, 14), sx * 12.0, TOP - L * 0.42, 0));
    P.add('flange', O.mat, boxC(0, TOP - 3.0, 0, 26, 7.0, 44, 2.2, 0.4));
    /* рукоятка строится «свисающей», а хранится в общей системе (тело вверх от планки) */
    flipUp(P.list);
    for (const p of railClamp({ len: 42, style: 'crossbolt', side: 1, lugs: [-10.16, 10.16], base: 0.6, width: 24 }))
      P.add(p.name, p.mat, p.geo);

    return { parts: P.list, meta: {
      slot: 'under', name: 'Вертикальная рукоятка', short: 'VFG', weight: 96,
      gripNode: [0, -(TOP - L * 0.55), 0], handPose: 'vertical', flipForUnder: true,
      stats: { vertRecoil: -12, horizRecoil: -6, hipSpread: -4, adsSpeed: -3, mobility: -2 } } };
  };

  /* ==================================================================
     5. Угловая рукоятка AFG
     ================================================================== */
  OUT.grip_angled = function (o) {
    const O = Object.assign({ mat: 'poly' }, o || {});
    const P = bag();
    const prof = [[-52, -2], [16, -2], [20, -8], [16, -34], [-16, -40], [-52, -18]];
    P.add('body', O.mat, plateZY(prof, -13.0, 13.0));
    for (let i = 0; i < 12; i++) {
      const t = i / 11, z = -44 + t * 52, y = -6 - t * 24;
      P.add('rib', O.mat, boxC(0, y, z, 26, 1.6, 2.6, 0.5, 0.15));
    }
    P.add('thumbRest', O.mat, tr(sphere(8.0, 16), 0, -6.0, 14.0));
    P.add('flange', O.mat, boxC(0, -2.2, -16, 26, 5.0, 52, 2.0, 0.4));
    flipUp(P.list);
    for (const p of railClamp({ len: 50, style: 'crossbolt', side: 1, lugs: [-10.16, 10.16], base: 0.6, width: 24 }))
      P.add(p.name, p.mat, tr(p.geo, 0, 0, -16));

    return { parts: P.list, meta: {
      slot: 'under', name: 'Угловая рукоятка', short: 'AFG', weight: 62,
      gripNode: [0, 22, -14], handPose: 'angled', flipForUnder: true,
      stats: { vertRecoil: -6, horizRecoil: -10, hipSpread: -2, adsSpeed: 2, mobility: 0 } } };
  };

  /* ==================================================================
     6. Упор кисти
     ================================================================== */
  OUT.handstop = function () {
    const P = bag();
    P.add('body', 'poly', plateZY([[-16, -2], [14, -2], [16, -10], [8, -24], [-10, -22], [-16, -10]], -11, 11));
    for (let i = 0; i < 5; i++)
      P.add('rib', 'poly', boxC(0, -8 - i * 3.0, 6 - i * 2.0, 22, 1.4, 2.2, 0.4, 0.15));
    P.add('flange', 'poly', boxC(0, -2.0, -2, 24, 4.4, 30, 1.8, 0.3));
    flipUp(P.list);
    for (const p of railClamp({ len: 28, style: 'crossbolt', side: 1, lugs: [0], base: 0.6, width: 22 }))
      P.add(p.name, p.mat, tr(p.geo, 0, 0, -2));
    return { parts: P.list, meta: {
      slot: 'under', name: 'Упор кисти', short: 'STOP', weight: 28,
      gripNode: [0, 14, -4], handPose: 'extended', flipForUnder: true,
      stats: { vertRecoil: -2, horizRecoil: -4, hipSpread: -6, adsSpeed: 3, mobility: 2 } } };
  };

  /* ==================================================================
     7. Сошки: качание, складывание, выдвижные ноги с фиксатором
     ================================================================== */
  OUT.bipod = function (o) {
    const O = Object.assign({ mat: 'anod' }, o || {});
    const P = bag();
    const PIVOT_Y = -18.0;

    P.add('head', O.mat, boxC(0, -9.0, 0, 30, 18, 46, 3.0, 0.5));
    P.add('panAxis', 'steel', tr(cylY(4.0, 4.0, -22, 4, 20), 0, 0, 0));
    P.add('tiltLock', 'steelDk', tr(cylX(5.0, 5.0, 15, 21, 18), 0, -9.0, 12));
    P.addAll(knurlBand({ r: 5.0, a0: 15.4, a1: 20.6, n: 20, depth: 0.34, axis: 'x', at: [0, -9.0, 12], mat: 'steelDk' }));
    P.add('legAxis', 'steel', tr(cylX(3.2, 3.2, -26, 26, 18), 0, PIVOT_Y, -6));

    for (const s of [-1, 1]) {
      const ox = s * 15.0;
      const legParts = [
        ['legTube', O.mat, cyl(7.0, 7.0, -96, -4, 24, true)],
        ['legTubeIn', 'bore', tube(5.4, 5.8, -95, -6, 22)],
        ['legButton', 'steelDk', tr(rx(cyl(3.6, 3.6, -8.8, -6.6, 16, true), PI / 2), 0, 0, -88)],
        ['legSpring', 'steel', spring(4.4, 0.8, -144, -99, 9)],
        ['legExt', 'steel', cyl(5.2, 5.2, -150, -92, 20, true)],
        ['foot', 'rubber', lathe([{ r: 0, z: -162 }, { r: 8.4, z: -162 },
          { r: 8.8, z: -156, s: true }, { r: 6.2, z: -150 }, { r: 0, z: -150 }], 26, true)],
        ['footTread', 'rubber', tube(5.0, 8.6, -163.4, -161.6, 26)]
      ];
      for (let i = 0; i < 5; i++)
        legParts.push(['legHole', 'bore', tr(rx(cyl(2.0, 2.0, -7.6, -6.4, 12, true), PI / 2), 0, 0, -30 - i * 14.34)]);
      for (const [n, m, g0] of legParts) {
        let g = rx(g0, -PI / 2);
        g = rz(g, s * D(12));
        P.add(n, m, tr(g, ox, PIVOT_Y, -6));
      }
      P.add('legYoke', O.mat, boxC(ox, PIVOT_Y + 4, -6, 7.0, 16, 12, 1.4, 0.3));
    }

    P.add('mountBase', O.mat, boxC(0, -2.6, 0, 26, 6.0, 48, 2.0, 0.4));
    flipUp(P.list);
    for (const p of railClamp({ len: 46, style: 'thumb', side: 1, lugs: [-10.16, 10.16], base: 0.6, width: 26 }))
      P.add(p.name, p.mat, p.geo);

    return { parts: P.list, meta: {
      slot: 'under', name: 'Сошки', short: 'СОШКИ', weight: 380, flipForUnder: true,
      deploy: { pivot: [0, -PIVOT_Y, -6], axis: 'x', foldedAngle: 86, deployedAngle: 0,
        parts: ['legTube', 'legTubeIn', 'legHole', 'legButton', 'legSpring', 'legExt', 'foot', 'footTread'] },
      heightRange: [152, 224], panRange: 32, tiltRange: 28,
      stats: { vertRecoil: -34, horizRecoil: -28, hipSpread: 14, adsSpeed: -8, mobility: -10, proneBonus: 40 } } };
  };

  return OUT;
};

__def("mags_stocks", function (module, exports) {
/* ============================================================================
   Магазины, приклады, цевья и боковые модули.

   Магазин: начало координат — плоскость шахты (верх магазина), корпус растёт
   вниз по −Y, изгиб задаётся радиусом. Приклад: начало — торец коробки,
   растёт в +Z. Цевьё: начало — стык со ствольной коробкой.
   ========================================================================== */
module.exports = function (G, C) {
  const { PI, TAU, D } = C;
  const { tr, rx, ry, rz, merge, extrude, lathe, cyl, tube, loft, mBasis } = G;
  const { bag, boxC, boxZ, plateZY, cylX, cylY, sphere, railStrip, railClamp,
    capScrew, knurlBand, spring, padButton, RAIL } = C;

  const OUT = {};

  /* --------------------------------------------------------------------
     Изогнутый магазин: дуга радиуса R, сечение ширина W × глубина Dz.
     cap — ёмкость, влияет на длину; window — окна контроля патронов.
     -------------------------------------------------------------------- */
  function curvedMag(o) {
    const O = Object.assign({ R: 380, len: 172, W: 26, Dz: 64, cap: 30,
      tilt: 5, mat: 'poly', window: false, ribs: 7, floorplate: true }, o || {});
    const P = bag();
    const HW = O.W / 2, HD = O.Dz / 2;
    const T0 = [-Math.sin(D(O.tilt)), -Math.cos(D(O.tilt))];
    const CEN = [O.R * T0[1], -O.R * T0[0]];
    const rot = (v, a) => [v[0] * Math.cos(a) + v[1] * Math.sin(a), -v[0] * Math.sin(a) + v[1] * Math.cos(a)];
    /* s ∈ [0..1] вдоль магазина; кадр даёт точку и нормаль дуги в (z,y) */
    function frame(s) {
      const phi = s * O.len / O.R;
      const rp = rot([-CEN[0], -CEN[1]], phi);
      return { P: [CEN[0] + rp[0], CEN[1] + rp[1]], T: rot(T0, phi) };
    }
    /* кольцо сечения магазина в мировых координатах */
    const ring = (s, shrink, nSeg) => {
      const f = frame(s), T = f.T, N = [-T[1], T[0]];
      const out = [], n = nSeg || 4;
      const w = HW * (1 - shrink * 0.10), d = HD * (1 - shrink * 0.06);
      const corners = [[-w, -d], [w, -d], [w, d], [-w, d]];
      for (const [x, v] of corners) {
        /* скругление углов — по 3 точки на угол */
        out.push([x, f.P[1] + v * N[1], f.P[0] + v * N[0]]);
        out.push([x, f.P[1] + v * N[1], f.P[0] + v * N[0]]);
      }
      return out;
    };
    /* корпус лофтом по дуге, с сужением книзу */
    const rings = [];
    const NS = 16;
    for (let i = 0; i <= NS; i++) {
      const s = i / NS;
      const f = frame(s), T = f.T, N = [-T[1], T[0]];
      const taper = 1 - 0.045 * s;
      const w = HW * taper, d = HD * taper;
      const rr = [];
      const pts = [];
      const R2 = 3.2;
      /* прямоугольник со скруглёнными углами в плоскости (x, N) */
      for (const [cx, cv, a0] of [[-w + R2, -d + R2, PI], [w - R2, -d + R2, -PI / 2],
        [w - R2, d - R2, 0], [-w + R2, d - R2, PI / 2]]) {
        for (let k = 0; k <= 4; k++) {
          const a = a0 + k / 4 * (PI / 2);
          pts.push([cx + Math.cos(a) * R2, cv + Math.sin(a) * R2]);
        }
      }
      for (const [x, v] of pts) rr.push([x, f.P[1] + v * N[1], f.P[0] + v * N[0]]);
      rings.push(rr);
    }
    P.add('magBody', O.mat, loft(rings, true, true));

    /* рёбра жёсткости поперёк корпуса */
    for (let i = 1; i <= O.ribs; i++) {
      const s = i / (O.ribs + 1);
      const f = frame(s), T = f.T, N = [-T[1], T[0]];
      const rr = [];
      for (const ds of [-0.022, 0.022]) {
        const g = frame(s + ds), Tg = g.T, Ng = [-Tg[1], Tg[0]];
        const row = [];
        const w = HW * 1.03, d = HD * 1.02;
        for (let k = 0; k < 20; k++) {
          const a = k / 20 * TAU;
          const cx = Math.cos(a) * w, cv = Math.sin(a) * d * 0.98;
          row.push([cx, g.P[1] + cv * Ng[1], g.P[0] + cv * Ng[0]]);
        }
        rr.push(row);
      }
      P.add('magRib', O.mat, loft(rr, false, false));
    }

    /* горловина: губки подачи и зацеп за шахту */
    const f0 = frame(0), N0 = [f0.T[1] * -1, f0.T[0]];
    P.add('magMouth', 'steelDk', boxC(0, -3.0, -2.0, O.W + 0.6, 8.0, O.Dz * 0.94, 2.0, 0.4));
    P.add('magLugFront', 'steelDk', boxC(0, -9.0, -HD + 3.0, O.W - 6, 10.0, 5.0, 1.0, 0.3));
    P.add('magLugRear', 'steelDk', boxC(0, -12.0, HD - 4.0, O.W - 8, 14.0, 6.0, 1.2, 0.3));

    /* окна контроля патронов */
    if (O.window) for (let i = 0; i < 4; i++) {
      const s = 0.25 + i * 0.16;
      const f = frame(s), T = f.T, N = [-T[1], T[0]];
      P.add('magWindow', 'bore', tr(rz(boxC(0, 0, 0, 3.0, 22, 8.0, 1.0, 0.2), 0),
        HW - 0.6, f.P[1], f.P[0]));
    }

    /* пятка и подаватель */
    if (O.floorplate) {
      const fe = frame(1.0), Te = fe.T, Ne = [-Te[1], Te[0]];
      P.add('magFloor', 'steelDk', tr(rz(boxC(0, 0, 0, O.W + 2.4, 6.0, O.Dz + 1.0, 2.2, 0.4),
        Math.atan2(Te[0], -Te[1])), 0, fe.P[1] - 1.0, fe.P[0]));
      P.add('magFloorLatch', 'steelDk', tr(boxC(0, 0, 0, 8.0, 4.0, 6.0, 0.8, 0.2),
        0, fe.P[1] + 4.0, fe.P[0] - HD + 5));
    }
    const fF = frame(0.06), NF = [-fF.T[1], fF.T[0]];
    P.add('magFollower', 'poly', tr(boxC(0, 0, 0, O.W - 4.0, 7.0, O.Dz - 6.0, 1.5, 0.3),
      0, fF.P[1], fF.P[0]));

    return { parts: P.list, frame, meta: { cap: O.cap, len: O.len } };
  }
