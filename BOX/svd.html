  hint.textContent = 'TAB — панель · 1…9 — слот · ← → — модуль · B — сошки/приклад · L — фонарь · K — ЛЦУ';
  host.append(warn, list, slots, hint);
  document.body.appendChild(host);

  const statBox = document.createElement('div'); statBox.id = 'custStats';
  document.body.appendChild(statBox);

  let active = null, prevStats = null, flash = {};

  function renderSlots(defs, cfg) {
    slots.innerHTML = '';
    defs.forEach((s, i) => {
      const cur = cfg[s.key];
      const el = document.createElement('div');
      el.className = 'cslot' + (active === s.key ? ' on' : '') + (cur ? '' : ' empty');
      const k = document.createElement('div'); k.className = 'k';
      k.textContent = (i < 9 ? (i + 1) + ' · ' : '') + s.label;
      const v = document.createElement('div'); v.className = 'v';
      v.textContent = cur ? opts.nameOf(cur) : '—';
      v.title = v.textContent;
      el.append(k, v);
      el.onclick = () => { active = s.key; render(); };
      slots.appendChild(el);
      if (active === s.key) requestAnimationFrame(() => {
        el.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderOptions(cfg) {
    list.innerHTML = '';
    if (!active) return;
    let selected = null;
    for (const o of opts.optionsFor(active)) {
      const el = document.createElement('div');
      const isSel = (cfg[active] || null) === o.key;
      el.className = 'copt' + (isSel ? ' sel' : '') + (o.fits === false ? ' bad' : '');
      el.textContent = o.label;
      el.title = o.fits === false ? 'Не подходит этому слоту' : o.label;
      el.onclick = () => { if (o.fits !== false) { opts.setModule(active, o.key); render(); } };
      list.appendChild(el);
      if (isSel) selected = el;
    }
    if (selected) requestAnimationFrame(() => {
      selected.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }

  function renderStats() {
    const st = opts.getStats();
    statBox.innerHTML = '';
    for (const d of STAT_DEFS) {
      if (st[d.k] === undefined) continue;
      const v = st[d.k], pv = prevStats ? prevStats[d.k] : undefined;
      const changed = pv !== undefined && Math.abs(v - pv) > 1e-6;
      let cls = 'cstat';
      if (changed) cls += ((v > pv) === d.up) ? ' up' : ' dn';
      const row = document.createElement('div');
      row.className = cls;
      const name = document.createElement('span'); name.textContent = d.label;
      const val = document.createElement('b');
      val.textContent = v.toFixed(d.d);
      if (changed) {
        const diff = document.createElement('i');
        const delta = v - pv;
        diff.textContent = (delta > 0 ? '▲' : '▼') + Math.abs(delta).toFixed(d.d);
        val.appendChild(diff);
      }
      row.append(name, val);
      statBox.appendChild(row);
    }
  }

  function render() {
    const cfg = opts.getConfig(), defs = opts.getSlots();
    if (active && !defs.some((s) => s.key === active)) active = null;
    renderSlots(defs, cfg);
    renderOptions(cfg);
    renderStats();
    const w = opts.getWarnings();
    warn.textContent = w && w.length ? w.join(' · ') : '';
  }

  return {
    render,
    markStats() { prevStats = Object.assign({}, opts.getStats()); },
    setActive(k) { active = k; render(); },
    getActive() { return active; },
    toggle(on) {
      const show = on !== false;
      host.classList.toggle('hidden', !show);
      statBox.style.display = show ? '' : 'none';
      if (show) render();
    },
    visible() { return !host.classList.contains('hidden'); }
  };
}


/* ---- интеграция кастомизации для «svd» ---- */
const ATTACH_DEF = __ATTACH.SLOTS["svd"];
const ATTACH_STATE = {
  config: Object.assign({}, ATTACH_DEF.defaults),
  asm: null, view: null, ui: null,
  toggles: { light: 0, laser: 0, ir: 0, deploy: {} }
};
/* деталь базовой модели -> слот, который её заменяет (для точечного скрытия) */
const ATTACH_HIDE_BY_NAME = {};

/* Список модулей, подходящих слоту (для интерфейса). */
function attachOptionsFor(slotKey) {
  const slot = attachSlots().find((s) => s.key === slotKey);
  if (!slot) return [];
  const accepts = slot.accepts || [slot.key];
  const out = [{ key: null, label: '— НЕТ —', fits: true }];
  for (const key of __ATTACH.REG.keys()) {
    let meta;
    try { meta = __ATTACH.REG.meta(key); } catch (e) { continue; }
    if (accepts.indexOf(meta.slot) < 0) continue;
    const fit = __ATTACH.SYS.checkFit(slot, Object.assign({ key }, meta),
      { caliber: ATTACH_DEF.caliber }, {});
    out.push({ key, label: meta.name, fits: fit.ok });
  }
  return out;
}

/* Слоты: статические из описания + динамические от цевья. */
function attachSlots() {
  const base = ATTACH_DEF.slots.slice();
  if (ATTACH_STATE.asm && ATTACH_STATE.asm.slotsDynamic)
    for (const d of ATTACH_STATE.asm.slotsDynamic)
      if (!base.some((b) => b.key === d.key)) base.push(d);
  return base;
}

function attachNameOf(key) {
  try { return __ATTACH.REG.meta(key).name; } catch (e) { return String(key); }
}

/* Пересборка: снять старую группу, собрать новую, вернуть узлы. */
function attachRebuild(THREE, parent, baseParts, weaponNodes) {
  if (ATTACH_STATE.view) {
    parent.remove(ATTACH_STATE.view.root);
    ATTACH_STATE.view.dispose();
  }
  const weapon = {
    caliber: ATTACH_DEF.caliber, weight: ATTACH_DEF.weight,
    ballistics: ATTACH_DEF.ballistics, stats: {},
    base: baseParts || [], nodes: weaponNodes || {}, slots: attachSlots()
  };
  const asm = __ATTACH.SYS.assemble(weapon, __ATTACH.REG, ATTACH_STATE.config);
  const view = __ATTACH.ADAPTER.build(THREE, asm, { scale: 0.001 });
  parent.add(view.root);
  ATTACH_STATE.asm = asm;
  ATTACH_STATE.view = view;
  /* вернуть прежние состояния переключателей */
  view.setBeam('light', ATTACH_STATE.toggles.light);
  view.setBeam('laser', ATTACH_STATE.toggles.laser);
  view.setBeam('ir', ATTACH_STATE.toggles.ir);
  for (const k in ATTACH_STATE.toggles.deploy) view.setDeploy(k, ATTACH_STATE.toggles.deploy[k]);
  return asm;
}

/* Скрытие заменяемых деталей базовой модели: зоны включаются по конфигурации.
   Вызывается после каждой пересборки, поэтому снятие модуля возвращает
   исходную деталь на место. */
function attachOcclude(THREE, host) {
  if (!host) return null;
  return __ATTACH.OCC.apply(THREE, host, "svd", ATTACH_STATE.config, {
    names: ATTACH_HIDE_BY_NAME, groups: {}
  });
}

/* Публичный API: смена модулей из консоли, автотестов и внешнего интерфейса.
   Реальная функция подстановки регистрируется интеграцией оружия. */
window.ATTACH = {
  set(slotKey, moduleKey) {
    if (!ATTACH_STATE.apply) throw new Error('система ещё не готова');
    ATTACH_STATE.apply(slotKey, moduleKey);
    return window.__ATTACH_DEBUG();
  },
  get: () => Object.assign({}, ATTACH_STATE.config),
  slots: () => attachSlots().map((s) => s.key),
  options: (slotKey) => attachOptionsFor(slotKey),
  preset: {
    save: () => __ATTACH.SYS.presetCodec().encode(ATTACH_STATE.config),
    load(code) {
      const cfg = __ATTACH.SYS.presetCodec().decode(code);
      for (const k of attachSlots().map((s) => s.key))
        window.ATTACH.set(k, cfg[k] || null);
      return window.__ATTACH_DEBUG();
    }
  },
  beam: (kind, level) => ATTACH_STATE.view.setBeam(kind, level),
  deploy: (slotKey, t) => ATTACH_STATE.view.setDeploy(slotKey, t),
  stats: () => (ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {})
};

/* Отладочный хук: состояние сборки доступно из консоли и автотестов. */
window.__ATTACH_DEBUG = () => ({
  weapon: "svd",
  config: ATTACH_STATE.config,
  modules: ATTACH_STATE.asm ? Object.keys(ATTACH_STATE.asm.modules) : [],
  parts: ATTACH_STATE.asm ? ATTACH_STATE.asm.parts.length : 0,
  errors: ATTACH_STATE.asm ? ATTACH_STATE.asm.errors : [],
  warnings: ATTACH_STATE.asm ? ATTACH_STATE.asm.warnings : [],
  stats: ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {}
});

/* Управление с клавиатуры: TAB — панель, цифры — слот, стрелки — перебор. */
function attachBindKeys(onChange) {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const ui = ATTACH_STATE.ui;
    if (e.code === 'Tab') { e.preventDefault(); if (ui) ui.toggle(!ui.visible()); return; }
    if (e.code === 'KeyL') { ATTACH_STATE.toggles.light = ATTACH_STATE.toggles.light ? 0 : 1;
      ATTACH_STATE.view.setBeam('light', ATTACH_STATE.toggles.light); return; }
    if (e.code === 'KeyK') { ATTACH_STATE.toggles.laser = ATTACH_STATE.toggles.laser ? 0 : 1;
      ATTACH_STATE.view.setBeam('laser', ATTACH_STATE.toggles.laser); return; }
    if (e.code === 'KeyB') {
      for (const sk in ATTACH_STATE.asm.modules) {
        const m = ATTACH_STATE.asm.modules[sk];
        if (!(m.meta.deploy || m.meta.fold || m.meta.flipAxis)) continue;
        const cur = ATTACH_STATE.toggles.deploy[sk] || 0;
        const next = cur > 0.5 ? 0 : 1;
        ATTACH_STATE.toggles.deploy[sk] = next;
        ATTACH_STATE.view.setDeploy(sk, next);
      }
      return;
    }
    if (!ui || !ui.visible()) return;
    const slots = attachSlots();
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= slots.length) { ui.setActive(slots[n - 1].key); return; }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      const act = ui.getActive();
      if (!act) return;
      e.preventDefault();
      const opts = attachOptionsFor(act).filter((o) => o.fits);
      const cur = ATTACH_STATE.config[act] || null;
      let i = opts.findIndex((o) => o.key === cur);
      if (i < 0) i = 0;
      i = (i + (e.code === 'ArrowRight' ? 1 : opts.length - 1)) % opts.length;
      onChange(act, opts[i].key);
      ui.render();
    }
  });
}


/* ---- мост системы модулей к движку «svd» ---- */
const ATTACH_RAW = __ATTACH.RAW;
const ATTACH_SCALE = 0.001;

function attachAssemble() {
  const weapon = {
    caliber: ATTACH_DEF.caliber, weight: ATTACH_DEF.weight,
    ballistics: ATTACH_DEF.ballistics, stats: {}, base: [], nodes: {}, slots: attachSlots()
  };
  const asm = __ATTACH.SYS.assemble(weapon, __ATTACH.REG, ATTACH_STATE.config);
  ATTACH_STATE.asm = asm;
  return asm;
}

ATTACH_STATE.apply = function (slotKey, moduleKey) {
  ATTACH_STATE.ui && ATTACH_STATE.ui.markStats();
  ATTACH_STATE.config[slotKey] = moduleKey;
  if (typeof attachRebuildRaw === 'function') attachRebuildRaw();
  else attachAssemble();
  ATTACH_STATE.ui && ATTACH_STATE.ui.render();
};

function attachConvert() {
  const asm = ATTACH_STATE.asm || attachAssemble();
  return ATTACH_RAW.convert(asm, { fmt: "pnti",
    engine: "svd", scale: ATTACH_SCALE });
}


/* СВД: add(mesh, mat, node, opt) — mat в формате Mat, узлы уже созданы. */
function attachBuildModules(add) {
  const parts = attachConvert();
  ATTACH_BATCHES.length = 0;
  for (const p of parts) {
    const m = new Mesh();
    m.p = p.mesh.p; m.n = p.mesh.n; m.t = p.mesh.t; m.e = p.mesh.e; m.i = p.mesh.i;
    const mat = new Mat({ base: p.mat.base, metal: p.mat.metal, rough: p.mat.rough,
      kind: p.mat.kind, wear: p.mat.wear, axis: p.mat.axis,
      opacity: p.glass ? 0.22 : 1, emis: p.mat.emis, aoStr: 1, name: p.matKey });
    const b = add(m, mat, p.slot === 'mag' ? 'mag' : 'body', {});
    if (b) ATTACH_BATCHES.push({ batch: b, slot: p.slot });
  }
}
const ATTACH_BATCHES = [];
/* Пересборка без перезапуска: прячем старые батчи и грузим новые. */
function attachRebuildRaw() {
  for (const e of ATTACH_BATCHES) e.batch.visible = false;
  attachAssemble();
  attachBuildModules(function (mesh, mat, nodeName, opt) {
    return R.addMesh(mesh, mat, nodeName === 'mag' ? NODES.mag : NODES.body,
      Object.assign({ tag: 'rifle' }, opt || {}));
  });
  return ATTACH_STATE.asm;
}

/* ATTACH:END svd */

function buildAll() {
  initMats();
  rifleRoot = mkNode('rifle');
  var body = mkNode('body', rifleRoot), bolt = mkNode('bolt', rifleRoot), trig = mkNode('trig', rifleRoot);
  var mag = mkNode('mag', rifleRoot), safety = mkNode('safety', rifleRoot), dust = mkNode('dust', rifleRoot);
  var scope = mkNode('scope', rifleRoot);
  var rsl = mkNode('rsl', rifleRoot);
  var range = mkNode('range'), studio = mkNode('studio');
  for (var i = 0; i < 4; i++) mkNode('target' + i);
  var N = {
    body: body, bolt: bolt, trig: trig, mag: mag, safety: safety, dust: dust,
    scope: scope, rsl: rsl, range: range, studio: studio
  };
  for (i = 0; i < 4; i++) N['target' + i] = NODES['target' + i];
  function addRifle(mesh, mat, node, opt) { opt = opt || {}; opt.tag = 'rifle'; return R.addMesh(mesh, mat, node, opt); }
  buildSVD(addRifle, N);
  buildSVD2(addRifle, N);
  /* ATTACH: детали модулей идут в те же узлы, что и базовая винтовка */
  attachBuildModules(function (mesh, mat, nodeName, opt) {
    return addRifle(mesh, mat, nodeName === 'mag' ? N.mag : N.body, opt);
  });
  buildEnvironment(function (mesh, mat, node, opt) { return R.addMesh(mesh, mat, node, opt); }, N);
  initShells(function (mesh, mat, node, opt) { return R.addMesh(mesh, mat, node, opt); }, function (nm) { return mkNode(nm); });
  for (i = 0; i < 4; i++) Mcopy(Mtrans((i % 2 ? 1 : -1) * (0.6 + i * 0.9), 0, -TARGETS[i].dist), NODES['target' + i].local);
}

/* ---------- события оружия ---------- */
function fire() {
  if (APP.reloading > 0) return;
  var t = APP.time;
  if (t - APP.lastShot < 0.16) return;
  if (APP.ammo <= 0) {
    if (t - APP.lastShot < 0.35) return;
    APP.lastShot = t; APP.trigT = 0.001; AU.dryFire();
    return;
  }
  APP.lastShot = t; APP.ammo--; APP.trigT = 0.001;
  APP.cycling = 0.001;
  APP.recoilV += 3.4; APP.recoilPV += 12.5;
  APP.shake = 1.0; APP.flash = 1.0;
  AU.shot();
  var mp = muzzleWorld(), md = riflePickDir();
  PS.muzzleBurst(mp, md);
  APP.shotsFired = (APP.shotsFired || 0) + 1;
  if (APP.env === 1) {
    var gy = GROUND_Y;
    PS.dustKick([mp[0] + md[0] * 0.6, gy + 0.02, mp[2] + md[2] * 0.6], md);
  }
  APP.muzzleLight = 1.0;
  // траектория и попадание
  registerHit();
  if (APP.ammo === 0) APP.boltLocked = true;
  updateHud();
}
/* Затвор досылается только если магазин был отстрелян досуха и рама
   встала на затворную задержку. При частичной смене магазина патрон уже
   в патроннике — рукоятку не трогаем, перезарядка заметно короче. */
function reload() {
  if (APP.reloading > 0 || APP.ammo === APP.MAXAMMO) return;
  APP.reloadBolt = !!APP.boltLocked;
  APP.reloadT = 0;
  APP.reloading = APP.reloadBolt ? RL.ENDB : RL.END;
  AU.reload(0, APP.reloadBolt);
}
/* Реальная траектория: луч строится от оптической оси прицела (туда же смотрит стрелок),
   а падение пули и снос ветром добавляются как поправки относительно линии прицеливания.
   Значит, угольник сетки даёт точное попадание только при верно выставленном барабанчике. */
function registerHit() {
  var origin = APP.sight === 'iron'
    ? localToWorld([0, mm(41), mm(-233)])
    : localToWorld([0, mm(72), mm(-260)]);
  var dir = riflePickDir();
  var best = null, bestT = 1e9;
  for (var i = 0; i < TARGETS.length; i++) {
    var tg = TARGETS[i], nd = NODES['target' + i];
    var tz = nd.local[14], tx = nd.local[12];
    if (dir[2] >= -0.0001) continue;
    var tt = (tz - origin[2]) / dir[2];
    if (tt < 1 || tt > bestT) continue;
    var px = origin[0] + dir[0] * tt + windDrift(tt);
    var py = origin[1] + dir[1] * tt + impactOffset(tt, DRUM * 100);
    var lx = px - tx, ly = py - tg.cy;
    if (Math.abs(lx) < tg.w / 2 && Math.abs(ly) < tg.h / 2) { best = { t: tt, x: px, y: py, z: tz, tg: tg, lx: lx, ly: ly }; bestT = tt; }
  }
  if (best) {
    var d = best.t;
    setTimeout(function () {
      PS.hitPuff([best.x, best.y, best.z + 0.02], [0, 0, 1], 'wood');
      APP.hits.push({ x: best.x, y: best.y, z: best.z + 0.016, s: 0.014 * best.tg.scale, seed: Math.random() * 9 });
      if (APP.hits.length > 60) APP.hits.shift();
      var r = Math.hypot(best.lx, best.ly) / (0.235 * best.tg.scale);
      var score = r < 0.13 ? 10 : r < 0.36 ? 9 : r < 0.58 ? 8 : r < 0.8 ? 7 : 6;
      showHit(best.tg.dist, score);
    }, tof(d) * 1000);
    AU.impact(d, 'wood');
  }
}

/* ---------- позиции ---------- */
function localToWorld(l) {
  var w = rifleRoot.world, o = [0, 0, 0];
  o[0] = w[0] * l[0] + w[4] * l[1] + w[8] * l[2] + w[12];
  o[1] = w[1] * l[0] + w[5] * l[1] + w[9] * l[2] + w[13];
  o[2] = w[2] * l[0] + w[6] * l[1] + w[10] * l[2] + w[14];
  return o;
}
function muzzleWorld() { return localToWorld([0, 0, mm(-905)]); }
function riflePickDir() {
  var w = rifleRoot.world;
  var d = [-w[8], -w[9], -w[10]];
  var L = Math.hypot(d[0], d[1], d[2]) || 1;
  return [d[0] / L, d[1] / L, d[2] / L];
}

/* ---------- обновление ---------- */
function update(dt) {
  APP.time += dt;
  // отдача — демпфированная пружина
  var k = 340, c = 21;
  APP.recoilV += (-k * APP.recoilZ - c * APP.recoilV) * dt;
  APP.recoilZ += APP.recoilV * dt;
  APP.recoilPV += (-260 * APP.recoilP - 17 * APP.recoilPV) * dt;
  APP.recoilP += APP.recoilPV * dt;
  APP.shake = Math.max(0, APP.shake - dt * 3.4);
  APP.flash = Math.max(0, APP.flash - dt * 22);
  APP.muzzleLight = Math.max(0, APP.muzzleLight - dt * 20);
  if (APP.trigT > 0) { APP.trigT += dt; if (APP.trigT > 0.16) APP.trigT = 0; }

  // цикл автоматики
  if (APP.cycling > 0) {
    APP.cycling += dt;
    var T = APP.cycling;
    if (T < 0.055) APP.boltBack = (T / 0.055);
    else if (T < 0.115) APP.boltBack = 1;
    else if (T < 0.185) APP.boltBack = 1 - (T - 0.115) / 0.07;
    else { APP.boltBack = 0; APP.cycling = 0; }
    if (APP.boltLocked && T > 0.055) APP.boltBack = 1;
    if (!APP.ejected && T > 0.052) {
      APP.ejected = 1;
      var ep = localToWorld([mm(34), mm(14), mm(-140)]);
      var w = rifleRoot.world;
      var rx = [w[0], w[1], w[2]], uy = [w[4], w[5], w[6]], fz = [-w[8], -w[9], -w[10]];
      var sp = 3.1 + Math.random() * 1.1;
      ejectShell(ep, [rx[0] * sp + uy[0] * 1.5 + fz[0] * 0.5, rx[1] * sp + uy[1] * 1.5 + 1.0, rx[2] * sp + uy[2] * 1.5 + fz[2] * 0.5], 26);
      AU.shell();
    }
  } else APP.ejected = 0;

  /* ---- перезарядка ----
     Магазин СВД ставится качанием: сначала передний зацеп в гнездо,
     потом доворот назад до щелчка защёлки. Поэтому вращение идёт вокруг
     точки переднего зацепа, а не вокруг центра магазина. */
  var magDrop = 0, magRot = 0, magHide = 0, magTug = 0;
  if (APP.reloading > 0) {
    APP.reloading -= dt; APP.reloadT += dt;
    var T2 = APP.reloadT, u;
    if (T2 < RL.TIP0) { magRot = smoothstep(0, RL.TIP0, T2) * 0.05; }
    else if (T2 < RL.TIP1) { u = (T2 - RL.TIP0) / (RL.TIP1 - RL.TIP0); magRot = 0.05 + u * 0.26; magDrop = u * u * 0.012; }
    else if (T2 < RL.OUT1) { u = (T2 - RL.TIP1) / (RL.OUT1 - RL.TIP1); magRot = 0.31 + u * 0.22; magDrop = 0.012 + u * u * 0.30; }
    else if (T2 < RL.IN0) { magHide = 1; }
    else if (T2 < RL.SEAT) { u = (T2 - RL.IN0) / (RL.SEAT - RL.IN0); magRot = 0.36; magDrop = (1 - u) * 0.13; }
    else if (T2 < RL.LOCK) { u = (T2 - RL.SEAT) / (RL.LOCK - RL.SEAT); magRot = 0.36 * (1 - u * u); magDrop = 0; }
    else { magRot = 0; magDrop = 0; }
    // короткий контрольный рывок ладонью после посадки
    if (T2 >= RL.TUG && T2 < RL.TUG2 + 0.06)
      magTug = Math.sin(Math.min(1, (T2 - RL.TUG) / 0.14) * PI * 2) * mm(1.6);
    if (APP.reloadBolt) {
      if (T2 >= RL.BOLT0 && T2 < RL.BOLT1) APP.boltBack = smoothstep(RL.BOLT0, RL.BOLT1, T2);
      else if (T2 >= RL.BOLT1 && T2 < RL.BOLT2) APP.boltBack = 1;
      else if (T2 >= RL.BOLT2 && T2 < RL.BOLT3) APP.boltBack = 1 - (T2 - RL.BOLT2) / (RL.BOLT3 - RL.BOLT2);
      else if (T2 >= RL.BOLT3) APP.boltBack = 0;
    }
    var done = APP.reloadBolt ? RL.BOLT3 : RL.LOCK;
    if (T2 >= done && APP.ammo !== APP.MAXAMMO) { APP.ammo = APP.MAXAMMO; APP.boltLocked = false; updateHud(); }
    if (APP.reloading <= 0) { APP.reloading = 0; APP.ammo = APP.MAXAMMO; APP.boltLocked = false; updateHud(); }
  } else if (APP.boltLocked) APP.boltBack = 1;

  /* ---- смена прицела ----
     ПСО-1 НИКУДА НЕ СНИМАЕТСЯ. Меняется только положение головы стрелка:
     при работе с открытым прицелом щека сползает по гребню вниз-вперёд,
     и глаз уходит ПОД кронштейн, на линию мушка—целик (+41 мм над каналом).
     sightT — только доля этого перемещения глаза, к геометрии отношения нет. */
  var sTgt = APP.sight === 'iron' ? 1 : 0;
  APP.sightT += (sTgt - APP.sightT) * Math.min(1, dt * 6);
  if (Math.abs(APP.sightT - sTgt) < 0.002) APP.sightT = sTgt;

  /* ---- хомутик секторного прицела едет по планке вслед за дистанцией ---- */
  var slz = mm(-248) - (DRUM - 1) / 9 * mm(44);
  Mcopy(Mtrans(0, 0, slz), NODES.rsl.local);

  // узлы
  var rz = -APP.recoilZ * 0.022, rp = APP.recoilP * 0.0038;
  if (APP.mode === 'inspect') {
    if (APP.autoSpin) APP.targetYaw += dt * 0.12;
    APP.yaw += (APP.targetYaw - APP.yaw) * Math.min(1, dt * 9);
    APP.pitch += (APP.targetPitch - APP.pitch) * Math.min(1, dt * 9);
    APP.dist += (APP.targetDist - APP.dist) * Math.min(1, dt * 7);
    Mmuls2(rifleRoot.local, Mtrans(0, 0.02 + rz * 0.3, -0.16 - rz), MrotX(-rp * 0.5));
  } else {
    APP.aimYaw += (APP.aimYawT - APP.aimYaw) * Math.min(1, dt * 12);
    APP.aimPitch += (APP.aimPitchT - APP.aimPitch) * Math.min(1, dt * 12);
    var sway = APP.time * 0.7;
    var swx = Math.sin(sway * 0.9) * 0.0016 + Math.sin(sway * 2.3) * 0.0006;
    var swy = Math.cos(sway * 0.7) * 0.0013 + Math.sin(sway * 1.7) * 0.0005;
    Mmuls2(rifleRoot.local,
      MrotY(APP.aimYaw + swx), MrotX(APP.aimPitch + swy - rp),
      Mtrans(0, -mm(72), mm(-120) - rz));
  }
  Mcopy(Mtrans(0, 0, APP.boltBack * mm(100)), NODES.bolt.local);
  Mmuls2(NODES.trig.local, Mtrans(0, 0, 0), MrotX(0));
  if (APP.trigT > 0) {
    var ta = Math.sin(Math.min(1, APP.trigT / 0.06) * PI) * 0.30;
    Mmuls2(NODES.trig.local, Mtrans(0, mm(-46), mm(-14)), MrotX(-ta), Mtrans(0, mm(46), mm(14)));
  }
  // вращение вокруг переднего зацепа магазина (z ≈ −185, y ≈ −34)
  var magM = M();
  if (magHide) Mcopy(Mtrans(0, -3, 0), magM);
  else Mmuls2(magM,
    Mtrans(0, mm(-34), mm(-185)), MrotX(magRot),
    Mtrans(0, mm(34) - magDrop + magTug, mm(185)));
  Mcopy(magM, NODES.mag.local);

  NODES.range.visible = true;
  R.batches.forEach(function (b) {
    if (b.node === NODES.range || b.node === NODES.studio) b.visible = (b.node === NODES.range) === (APP.env === 1);
    if (b.node.name && b.node.name.indexOf('target') === 0) b.visible = APP.env === 1;
  });

  PS.update(dt);
  updateShells(dt);
  for (var i = 0; i < R.nodes.length; i++) R.nodes[i].update();
}
function smoothstep(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

/* ---------- камера ---------- */
function getCamera(aspect) {
  var cam = { pos: [0, 0, 0], view: M(), proj: M(), fov: 34 };
  if (APP.mode === 'inspect') {
    var d = APP.dist, cy = Math.cos(APP.pitch), sy = Math.sin(APP.pitch);
    var cx = Math.cos(APP.yaw), sx = Math.sin(APP.yaw);
    var tgt = [0, 0.0, -0.16];
    cam.pos = [tgt[0] + d * cy * sx, tgt[1] + d * sy, tgt[2] + d * cy * cx];
    var sh = APP.shake * APP.shake * 0.02;
    cam.pos[0] += Math.sin(APP.time * 61) * sh; cam.pos[1] += Math.cos(APP.time * 73) * sh;
    Mlook(cam.pos, tgt, [0, 1, 0], cam.view);
    cam.fov = 30;
  } else {
    /* Одна и та же винтовка, одна и та же прикладка — двигается только глаз.
         ПСО-1:    глаз на оптической оси, +72 мм, вынос зрачка 70 мм.
         открытый: глаз опускается ПОД кронштейн на линию мушка—целик, +41 мм,
                   и подаётся вперёд к гребню; прицел остаётся на винтовке
                   и честно закрывает верх кадра, как в жизни. */
    var se = APP.sightT * APP.sightT * (3 - 2 * APP.sightT);
    var eye = localToWorld([0,
      lerp(mm(72), GEO.Y_IRON, se),
      lerp(mm(122), mm(88), se)]);
    var fwd = riflePickDir();
    var sh2 = APP.shake * APP.shake * lerp(0.014, 0.017, se);
    eye[0] += Math.sin(APP.time * 67) * sh2; eye[1] += Math.cos(APP.time * 89) * sh2;
    cam.pos = eye;
    Mlook(eye, [eye[0] + fwd[0], eye[1] + fwd[1], eye[2] + fwd[2]], [0, 1, 0], cam.view);
    cam.fov = lerp(36, 30, se) + APP.shake * APP.shake * 1.6;
  }
  Mpersp(rad(cam.fov), aspect, 0.02, 2200, cam.proj);
  return cam;
}

/* ---------- рендер ---------- */
var VP = M(), IVP = M(), SVP = M(), tmpM = M();
function lightDirs() {
  if (APP.env === 1) return { key: v3n([0.42, 0.62, 0.66]), keyCol: [3.4, 3.05, 2.55], fill: v3n([-0.5, 0.35, -0.4]), fillCol: [0.34, 0.42, 0.58], rim: v3n([-0.3, 0.25, -0.9]), rimCol: [0.5, 0.55, 0.62], sun: v3n([0.42, 0.62, 0.66]) };
  return { key: v3n([-0.55, 0.72, 0.42]), keyCol: [2.6, 2.5, 2.35], fill: v3n([0.78, 0.36, -0.5]), fillCol: [0.30, 0.36, 0.5], rim: v3n([-0.3, 0.35, -0.89]), rimCol: [0.7, 0.6, 0.5], sun: v3n([-0.55, 0.72, 0.42]) };
}
function v3n(a) { var l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; }

function renderScenePass(vp, view, proj, camPos, opts) {
  var p = R.pScene, L = lightDirs();
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uVP, false, vp);
  gl.uniform3fv(p.u.uCam, camPos);
  gl.uniform1i(p.u.uEnvMode, APP.env);
  gl.uniform3fv(p.u.uSunDir, L.sun);
  gl.uniform3fv(p.u.uKeyDir, L.key); gl.uniform3fv(p.u.uKeyCol, L.keyCol);
  gl.uniform3fv(p.u.uFillDir, L.fill); gl.uniform3fv(p.u.uFillCol, L.fillCol);
  gl.uniform3fv(p.u.uRimDir, L.rim); gl.uniform3fv(p.u.uRimCol, L.rimCol);
  gl.uniformMatrix4fv(p.u.uShadowVP, false, SVP);
  gl.uniform2f(p.u.uRes, opts.res[0], opts.res[1]);
  gl.uniform1i(p.u.uUseAO, opts.ao ? 1 : 0);
  gl.uniform1f(p.u.uFogDens, APP.env === 1 ? 0.00062 : 0.0);
  gl.uniform3f(p.u.uFogCol, 0.30, 0.335, 0.375);
  var mw = muzzleWorld();
  gl.uniform3fv(p.u.uMuzzlePos, mw);
  var ml = APP.muzzleLight * APP.muzzleLight;
  gl.uniform3f(p.u.uMuzzleCol, ml * 34, ml * 21, ml * 8);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.shadowTex); gl.uniform1i(p.u.uShadow, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, opts.ao ? R.aoTex2 : R.whiteTex); gl.uniform1i(p.u.uAOTex, 1);
  R.drawBatches(p, { skipTag: opts.skipRifle ? 'rifle' : null });
}

function drawSky(invVP, camPos) {
  var p = R.pSky;
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uInvVP, false, invVP);
  gl.uniform3fv(p.u.uCam, camPos);
  gl.uniform1i(p.u.uEnvMode, APP.env);

  gl.depthMask(false); gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}

function renderFrame(dt) {
  var W = R.size[0], H = R.size[1], aspect = W / H;
  var cam = getCamera(aspect);
  Mmul(cam.proj, cam.view, VP);
  Minv(VP, IVP);

  /* ---- тени ---- */
  var L = lightDirs();
  var ctr = APP.mode === 'inspect' ? [0, 0, -0.16] : localToWorld([0, 0, mm(-300)]);
  var sd = 1.35, lp = [ctr[0] + L.key[0] * 4, ctr[1] + L.key[1] * 4, ctr[2] + L.key[2] * 4];
  var lv = M(), lo = M();
  Mlook(lp, ctr, [0, 1, 0], lv);
  Mortho(-sd, sd, -sd, sd, 0.5, 9, lo);
  Mmul(lo, lv, SVP);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboShadow);
  gl.viewport(0, 0, R.shadowSize, R.shadowSize);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
  gl.useProgram(R.pDepth);
  gl.uniformMatrix4fv(R.pDepth.u.uVP, false, SVP);
  R.drawBatches(R.pDepth, { shadowOnly: true, noMat: true });
  gl.cullFace(gl.BACK);

  /* ---- prepass + SSAO ---- */
  var useAO = APP.ssao && GLX.hdr && APP.quality > 0;
  if (useAO) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboND);
    gl.viewport(0, 0, R.ndSize[0], R.ndSize[1]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(R.pNrm);
    gl.uniformMatrix4fv(R.pNrm.u.uVP, false, VP);
    gl.uniformMatrix4fv(R.pNrm.u.uView, false, cam.view);
    R.drawBatches(R.pNrm, { noMat: true });
    gl.disable(gl.DEPTH_TEST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO);
    gl.viewport(0, 0, R.ndSize[0], R.ndSize[1]);
    var ps = R.pSSAO; gl.useProgram(ps);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.ndTex); gl.uniform1i(ps.u.uND, 0);
    gl.uniform2f(ps.u.uRes, R.ndSize[0], R.ndSize[1]);
    gl.uniform1f(ps.u.uP00, cam.proj[0]); gl.uniform1f(ps.u.uP11, cam.proj[5]);
    gl.uniform1f(ps.u.uRadius, APP.mode === 'inspect' ? 0.035 : 0.05);
    gl.uniformMatrix4fv(ps.u.uProj, false, cam.proj);
    gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // размытие
    var pb = R.pBlur; gl.useProgram(pb);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO2);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.aoTex); gl.uniform1i(pb.u.uTex, 0);
    gl.uniform2f(pb.u.uDir, 1.4 / R.ndSize[0], 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO);
    gl.bindTexture(gl.TEXTURE_2D, R.aoTex2);
    gl.uniform2f(pb.u.uDir, 0, 1.4 / R.ndSize[1]); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // итог в aoTex2
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO2);
    gl.bindTexture(gl.TEXTURE_2D, R.aoTex);
    gl.uniform2f(pb.u.uDir, 0, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.DEPTH_TEST);
  }

  /* ---- вид в прицел (только ПСО-1: у открытого прицел�� нет увеличения) ---- */
  var scopeOn = APP.mode === 'aim' && APP.sight === 'pso' && APP.sightT < 0.5;
  if (scopeOn) {
    var sEye = localToWorld([0, mm(72), mm(-260)]);
    var fwd = riflePickDir();
    var sView = M(), sProj = M(), sVP = M(), sInv = M();
    Mlook(sEye, [sEye[0] + fwd[0], sEye[1] + fwd[1], sEye[2] + fwd[2]], [0, 1, 0], sView);
    Mpersp(rad(6.0), 1, 0.05, 2400, sProj);
    Mmul(sProj, sView, sVP); Minv(sVP, sInv);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboScope);
    gl.viewport(0, 0, R.scopeSize, R.scopeSize);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawSky(sInv, sEye);
    renderScenePass(sVP, sView, sProj, sEye, { res: [R.scopeSize, R.scopeSize], ao: false, skipRifle: true });
    drawHitDecals(sVP, sEye, fwd);
    PS.draw(sVP, sEye, [sView[0], sView[4], sView[8]], [sView[1], sView[5], sView[9]]);
  }

  /* ---- основной проход ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboMS);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(IVP, cam.pos);
  renderScenePass(VP, cam.view, cam.proj, cam.pos, { res: [W, H], ao: useAO, skipRifle: false });
  drawHitDecals(VP, cam.pos, riflePickDir());
  PS.draw(VP, cam.pos, [cam.view[0], cam.view[4], cam.view[8]], [cam.view[1], cam.view[5], cam.view[9]]);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, R.fboMS);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, R.fboScene);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);

  /* ---- комбинирование с картинкой прицела ---- */
  gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboComb);
  gl.viewport(0, 0, W, H);
  var pc = R.pComb; gl.useProgram(pc);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.sceneTex); gl.uniform1i(pc.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.scopeTex); gl.uniform1i(pc.u.uScope, 1);
  gl.uniform2f(pc.u.uRes, W, H);

  /* ---- bloom ---- */
  var pbr = R.pBright; gl.useProgram(pbr);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.combTex); gl.uniform1i(pbr.u.uTex, 0);
  gl.uniform1f(pbr.u.uThr, GLX.hdr ? 1.0 : 0.78);

  var pb2 = R.pBlur; gl.useProgram(pb2);

    gl.uniform2f(pb2.u.uDir, 1.6 / chain[ci][2][0], 1.0 / chain[ci][2][1]);

  gl.viewport(0, 0, R.brSize[1][0], R.brSize[1][1]);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbr0);
  gl.viewport(0, 0, R.brSize[0][0], R.brSize[0][1]);
  gl.bindTexture(gl.TEXTURE_2D, R.br1);
  gl.uniform2f(pb2.u.uDir, 1.0 / R.brSize[0][0], 0.6 / R.brSize[0][1]);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);

  /* ---- финал ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  var pp = R.pPost; gl.useProgram(pp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.combTex); gl.uniform1i(pp.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.br0); gl.uniform1i(pp.u.uBloom, 1);
  gl.uniform1f(pp.u.uExp, (APP.env === 1 ? 1.02 : 1.25) * (1 + APP.flash * 0.55));
  gl.uniform1f(pp.u.uTime, APP.time);
  gl.uniform1f(pp.u.uVig, APP.mode === 'aim' ? 0.30 : 0.42);
  gl.uniform1f(pp.u.uGrain, 0.016);
  gl.uniform1f(pp.u.uBloomAmt, 0.55);
  gl.uniform1f(pp.u.uShakeCA, APP.shake * APP.shake * 0.004);
  gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);
}

/* пробоины на мишенях */
function drawHitDecals(vp, camPos) {
  if (!APP.hits.length || APP.env !== 1) return;
  var p = R.pPart;
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uVP, false, vp);
  gl.uniform3f(p.u.uRight, 1, 0, 0); gl.uniform3f(p.u.uUp, 0, 1, 0);

/* ===== 09_boot.js ===== */
/* ===================== БАЛЛИСТИКА, UI, СЕТКА, ЗАПУСК ===================== */
var SCOPE_R = 0.315;          // радиус круга прицела (доля высоты экрана)
var SCOPE_H = 0.072;          // превышение оптической оси ПСО-1 над каналом ствола, м
var IRON_H = 0.041;           // превышение линии мушка—целик над каналом ствола, м
/* Превышение линии прицеливания зависит от того, через что целятся: через оптику
   оно вдвое больше, поэтому одна и та же точка прицеливания даёт разные точки попадания. */
function sightH() { return APP.sight === 'iron' ? IRON_H : SCOPE_H; }
 var V0 = 830, KDRAG = 0.00088, GACC = 9.81;
function tof(d) { return (Math.exp(KDRAG * d) - 1) / (KDRAG * V0); }
function bdrop(d) { var t = tof(d); return 0.5 * GACC * t * t; }
function theta(Z) { var h = sightH(); return (bdrop(Z) + h) / Z; }
function impactOffset(d, Z) { var h = sightH(); return theta(Z) * d - bdrop(d) - h; }
var WIND = 1.6;
function windDrift(d) { return WIND * (tof(d) - d / V0); }

/* ---------- сетка ПСО-1 ---------- */
var MILU = 3.0;  // единиц viewBox на одну тысячную
function buildReticle() {
  var s = [], W = 1.7;
  function ln(x1, y1, x2, y2, w) { s.push('<line x1="' + x1.toFixed(2) + '" y1="' + y1.toFixed(2) + '" x2="' + x2.toFixed(2) + '" y2="' + y2.toFixed(2) + '" stroke-width="' + (w || W) + '"/>'); }
  function txt(x, y, t, sz) { s.push('<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" font-size="' + (sz || 8) + '">' + t + '</text>'); }

  /* главный угольник — вершина в точке прицеливания (0,0) */
  var L = 4.2 * MILU;
  s.push('<path d="M ' + (-L) + ' ' + L * 0.92 + ' L 0 0 L ' + L + ' ' + L * 0.92 + '" fill="none" stroke-width="' + (W * 1.15) + '" stroke-linecap="round" stroke-linejoin="miter"/>');

  /* дополнительные угольники 1100 / 1200 / 1300 м */
  [[3.6, 2.6], [7.2, 2.3], [10.8, 2.0]].forEach(function (c) {
    var y = c[0] * MILU, l = c[1] * MILU;
    s.push('<path d="M ' + (-l) + ' ' + (y + l * 0.9) + ' L 0 ' + y + ' L ' + l + ' ' + (y + l * 0.9) + '" fill="none" stroke-width="' + (W * 0.95) + '"/>');
  });

  /* горизонтальная шкала боковых поправок: по 10 тысячных в каждую сторону */
  for (var side = -1; side <= 1; side += 2) {
    ln(side * 4.6 * MILU, 0, side * 10 * MILU, 0, W);
    for (var m = 1; m <= 10; m++) {
      var x = side * m * MILU;
      if (m < 5) continue;
      var big = (m % 5 === 0);
      ln(x, 0, x, big ? 3.1 * MILU : 1.5 * MILU, big ? W : W * 0.8);
      if (big) txt(x - (side < 0 ? 3.6 : 3.6), -2.6, String(m), 7.6);
    }
    for (m = 5; m <= 10; m++) { }
  }
  // мелкие штрихи между 5 и 10 тысячными
  for (side = -1; side <= 1; side += 2)
    for (var mm2 = 6; mm2 <= 9; mm2++) ln(side * mm2 * MILU, 0, side * mm2 * MILU, 1.5 * MILU, W * 0.7);

  /* дальномерная шкала (цель высотой 1,7 м) */
  var bx0 = -30 * MILU * 0.8, by = -8.6 * MILU;
  var pts = [], labels = [2, 4, 6, 8, 10];
  var span = 17 * MILU;
  for (var i = 0; i <= 16; i++) {
    var r = 200 + (1000 - 200) * (i / 16);
    var mil = 1.7 / r * 1000;
    var x = bx0 + span * (i / 16);
    pts.push([x, by - mil * MILU]);
  }
  var dpath = 'M ' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
  for (i = 1; i < pts.length; i++) dpath += ' L ' + pts[i][0].toFixed(2) + ' ' + pts[i][1].toFixed(2);
  s.push('<path d="' + dpath + '" fill="none" stroke-width="' + W + '"/>');
  ln(bx0, by, bx0 + span, by, W);
  ln(bx0, by, bx0, pts[0][1], W);
  labels.forEach(function (lb) {
    var t = (lb * 100 - 200) / 800;
    var x = bx0 + span * t;
    ln(x, by, x, by + 1.6 * MILU, W * 0.8);
    txt(x - 3.2, by + 5.2 * MILU, String(lb), 7.6);
  });

  return s.join('');
}
function mountReticle() {
  var g = document.getElementById('ret-g');
  g.innerHTML = buildReticle();
}
function doResize(force) {
  var w = Math.max(2, window.innerWidth), h = Math.max(2, window.innerHeight);
  var dpr = Math.min(window.devicePixelRatio || 1, APP.quality > 0 ? 2 : 1.2);
  R.cssSize = [w, h];
  if (force) R.size = [0, 0];
  R.resize(w, h, dpr);
  layoutReticle();
}
function layoutReticle() {
  var svg = document.getElementById('reticle');
  if (!R.cssSize) R.cssSize = [window.innerWidth, window.innerHeight];
  var h = R.cssSize[1], w = R.cssSize[0];
  var d = 2 * SCOPE_R * h;
  svg.style.width = d + 'px'; svg.style.height = d + 'px';
  svg.style.left = (w * 0.5 - d / 2) + 'px';
  svg.style.top = (h * 0.5 - d / 2) + 'px';
}

/* ---------- HUD ---------- */
function updateHud() {
  var pips = '';
  for (var i = 0; i < APP.MAXAMMO; i++) pips += '<i class="' + (i < APP.ammo ? 'on' : '') + '"></i>';
  document.getElementById('ammo-pips').innerHTML = pips;
  document.getElementById('ammo-num').textContent = APP.ammo + ' / ' + APP.MAXAMMO;
  var d = document.getElementById('drum');
  if (d) d.textContent = DRUM + ' — ' + (DRUM * 100) + ' м';
  var dl = document.getElementById('drum-l');
  if (dl) dl.textContent = APP.sight === 'iron' ? 'Прицельная планка' : 'Барабанчик';
  var sg = document.getElementById('sight-v');
  if (sg) sg.textContent = APP.sight === 'iron' ? 'Открытый' : 'ПСО-1 4×24';
}
var hitTimer = null;
function showHit(dist, score) {
  var el = document.getElementById('hit');
  el.innerHTML = '<b>' + score + '</b><span>попадание · ' + dist + ' м</span>';
  el.classList.add('show');
  clearTimeout(hitTimer);
  hitTimer = setTimeout(function () { el.classList.remove('show'); }, 1400);
}
function toast(t) {
  var el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 1500);
}

/* ---------- режимы ---------- */
var DRUM = 1;
function setMode(m) {
  APP.mode = m;
  document.body.classList.toggle('aiming', m === 'aim');
  document.getElementById('btn-aim').classList.toggle('active', m === 'aim');
  if (m === 'aim') { APP.autoSpin = false; AU.setAmbience(1); } else AU.setAmbience(0.3);
}
/* Переключение прицельных приспособлений.
   ПСО-1 остаётся на кронштейне всегда — переключается только то, ЧЕМ целятся:
   глаз либо на оптической оси, либо уходит вниз под кронштейн, на механику. */
function toggleSight() {
  APP.sight = APP.sight === 'pso' ? 'iron' : 'pso';
  var iron = APP.sight === 'iron';
  var b = document.getElementById('btn-sight');
  b.textContent = iron ? 'Открытый' : 'ПСО-1 4×';
  b.classList.toggle('active', iron);
  document.body.classList.toggle('irons', iron);
  var ret = document.getElementById('reticle');
  if (ret) ret.style.display = iron ? 'none' : '';
  AU.ready && AU.safety();
  toast(iron ? 'Открытый прицел — смотрим под кронштейном ПСО-1' : 'ПСО-1 4×24 — глаз на оптической оси');
  updateHud();
}
function setEnv(e) {
  APP.env = e;
  document.getElementById('btn-env').textContent = e === 1 ? 'Стрельбище' : 'Студия';
  AU.ready && AU.setEnv(e === 1 ? 'outdoor' : 'studio');
  if (e === 0 && APP.mode === 'aim') setMode('inspect');
  document.getElementById('btn-aim').style.display = e === 1 ? '' : 'none';
}

/* ---------- ввод ---------- */
function initInput(canvas) {
  var dragging = false, px = 0, py = 0, moved = 0;
  function down(e) {
    if (e.button === 2) { e.preventDefault(); if (APP.env === 1) setMode(APP.mode === 'aim' ? 'inspect' : 'aim'); return; }
    dragging = true; moved = 0; px = e.clientX; py = e.clientY;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!dragging) return;
    var dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (APP.mode === 'inspect') {
      APP.autoSpin = false;
      APP.targetYaw -= dx * 0.006; APP.targetPitch += dy * 0.005;
      APP.targetPitch = Math.max(-0.9, Math.min(1.1, APP.targetPitch));
    } else {
      APP.aimYawT -= dx * 0.00042; APP.aimPitchT += dy * 0.00042;
      APP.aimYawT = Math.max(-0.30, Math.min(0.30, APP.aimYawT));
      APP.aimPitchT = Math.max(-0.12, Math.min(0.14, APP.aimPitchT));
    }
  }
  function up(e) {
    if (dragging && moved < 6 && e.button === 0 && e.target === canvas) { unlock(); fire(); }
    dragging = false;
  }
  canvas.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (APP.mode === 'inspect') {
      APP.targetDist = Math.max(0.55, Math.min(3.2, APP.targetDist * (1 + Math.sign(e.deltaY) * 0.09)));
      APP.autoSpin = false;
    } else {
      DRUM = Math.max(1, Math.min(10, DRUM - Math.sign(e.deltaY)));
      updateHud(); AU.ready && AU.safety();
      toast('Барабанчик дистанции: ' + (DRUM * 100) + ' м');
    }
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); unlock(); fire(); }
    else if (k === 'r' || k === 'к') { unlock(); reload(); }
    else if (k === 'tab') { e.preventDefault(); if (APP.env === 1) setMode(APP.mode === 'aim' ? 'inspect' : 'aim'); }
    else if (k === '1') setEnv(0);
    else if (k === '2') setEnv(1);
    else if (k === 'm' || k === 'ь') toggleSound();
    else if (k === 'v' || k === 'м') { unlock(); toggleSight(); }
  });
}
function unlock() {
  if (!AU.ready) { if (AU.init()) { AU.setEnv(APP.env === 1 ? 'outdoor' : 'studio'); AU.startAmbience(); AU.setAmbience(APP.mode === 'aim' ? 1 : 0.3); } }
  AU.resume();
}
function toggleSound() {
  unlock();
  AU.setMuted(!AU.muted);
  document.getElementById('btn-snd').classList.toggle('off', AU.muted);
  document.getElementById('btn-snd').textContent = AU.muted ? 'Звук выкл.' : 'Звук вкл.';
}

/* ---------- запуск ---------- */
var lastT = 0, acc = 0, lowFrames = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  var t = ts * 0.001;
  var dt = Math.min(0.05, lastT ? t - lastT : 0.016);
  lastT = t;
  APP.frames++; APP.fpsT += dt;
  if (APP.fpsT > 0.5) {
    APP.fps = APP.frames / APP.fpsT; APP.frames = 0; APP.fpsT = 0;
    var f = document.getElementById('fps');
    if (f) f.textContent = Math.round(APP.fps) + ' fps';
    if (APP.fps < 26) { lowFrames++; if (lowFrames === 2 && APP.quality > 0) { APP.quality = 0; APP.ssao = false; doResize(true); toast('Качество снижено для плавности'); } }
    else lowFrames = 0;
  }
  try {
    update(dt);
    renderFrame(dt);
  } catch (err) { fatal(err); throw err; }
}
function fatal(err) {
  var el = document.getElementById('err');
  if (!el) return;
  el.style.display = 'block';
  el.innerHTML = '<b>Ошибка</b><pre>' + String(err && err.stack || err).replace(/</g, '&lt;') + '</pre>';
}
function boot() {
  var canvas = document.getElementById('c');
  try {
    if (!glInit(canvas)) {
      document.getElementById('err').style.display = 'block';
      document.getElementById('err').innerHTML = '<b>WebGL2 недоступен</b><pre>Включите аппаратное ускорение в браузере.</pre>';
      return;
    }
    R.init(canvas);
    buildAll();
    doResize(true);
    mountReticle();
    updateHud();
    setEnv(1);
    setMode('inspect');
    // дип-линк на ракурс: ?az=45&el=12&dist=1.1&mode=aim
    try {
      var qp = new URLSearchParams(location.search), q = window.__QA || {};
      function gv(k) { return q[k] !== undefined ? q[k] : (qp.has(k) ? qp.get(k) : undefined); }
      if (gv('az') !== undefined) APP.yaw = rad(parseFloat(gv('az')));
      if (gv('el') !== undefined) APP.pitch = rad(parseFloat(gv('el')));
      if (gv('dist') !== undefined) APP.dist = parseFloat(gv('dist'));
      if (gv('env') !== undefined) setEnv(parseInt(gv('env'), 10) ? 1 : 0);
      if (gv('mode') === 'aim') setMode('aim');
      if (gv('drum') !== undefined) { DRUM = parseInt(gv('drum'), 10); updateHud(); }
      if (gv('sight') === 'iron') { toggleSight(); APP.sightT = 1; }
    } catch (e) { }
    initInput(canvas);
    window.addEventListener('resize', function () { doResize(); });
    document.getElementById('btn-fire').addEventListener('click', function () { unlock(); fire(); });
    document.getElementById('btn-reload').addEventListener('click', function () { unlock(); reload(); });
    document.getElementById('btn-aim').addEventListener('click', function () { unlock(); setMode(APP.mode === 'aim' ? 'inspect' : 'aim'); });
    document.getElementById('btn-sight').addEventListener('click', function () { unlock(); toggleSight(); });
    document.getElementById('btn-env').addEventListener('click', function () { unlock(); setEnv(APP.env === 1 ? 0 : 1); });
    document.getElementById('btn-snd').addEventListener('click', toggleSound);
    document.getElementById('btn-ret').addEventListener('click', function () {
      var svg = document.getElementById('reticle');
      svg.classList.toggle('lit');
      this.classList.toggle('active');
    });
    document.getElementById('loading').style.display = 'none';
    requestAnimationFrame(loop);
  } catch (e) { fatal(e); }
}
window.addEventListener('error', function (e) { fatal(e.error || e.message); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
