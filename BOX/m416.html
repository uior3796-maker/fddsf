r .14s}\n.copt:hover{background:rgba(32,36,42,.94)}\n.copt.sel{border-color:#e8b45c;color:#ffd79a;background:rgba(232,180,92,.16)}\n.copt.bad{opacity:.38;border-style:dashed;cursor:not-allowed}\n\n#custStats{position:fixed;left:18px;top:84px;z-index:20;pointer-events:none;\n  width:238px;display:flex;flex-direction:column;gap:2px;\n  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}\n.cstat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;\n  padding:4px 10px;border-radius:5px;background:rgba(10,12,15,.78);\n  border-left:2px solid rgba(255,255,255,.18);font-size:11.5px;line-height:1.35}\n.cstat span{color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.cstat b{font-weight:600;font-variant-numeric:tabular-nums;color:#f0f2f5;white-space:nowrap}\n.cstat.up{border-left-color:#63c97a}\n.cstat.up b{color:#96e6a6}\n.cstat.dn{border-left-color:#e07a6a}\n.cstat.dn b{color:#f0a598}\n.cstat i{font-style:normal;font-size:10px;margin-left:5px;opacity:.85}\n\n#custHint{text-align:center;padding:0 16px 10px;font-size:11px;line-height:1.5;\n  color:rgba(255,255,255,.34);letter-spacing:.02em}\n#custWarn{text-align:center;padding:0 16px 6px;font-size:11.5px;line-height:1.45;\n  color:#e8b45c;min-height:16px}\n@media (max-width:760px){\n  .cslot{width:112px}\n  #custStats{width:190px;top:70px;left:10px}\n}\n";
const STAT_DEFS = [{"k":"vertRecoil","label":"Подброс","up":false,"d":2},{"k":"horizRecoil","label":"Увод","up":false,"d":2},{"k":"hipSpread","label":"Разброс от бедра","up":false,"d":2},{"k":"adsTime","label":"Вскидка, с","up":false,"d":3},{"k":"mobility","label":"Подвижность","up":true,"d":0},{"k":"reloadTime","label":"Перезарядка, с","up":false,"d":3},{"k":"muzzleVelocity","label":"Скорость, м/с","up":true,"d":0},{"k":"effectiveRange","label":"Дальность, м","up":true,"d":0},{"k":"loudness","label":"Громкость","up":false,"d":0},{"k":"flashVisible","label":"Заметность вспышки","up":false,"d":0},{"k":"weight","label":"Масса, г","up":false,"d":0},{"k":"magCap","label":"Ёмкость","up":true,"d":0}];

function createCustomizer(opts) {
  const style = document.createElement('style');
  style.textContent = CUST_CSS;
  document.head.appendChild(style);

  const host = document.createElement('div'); host.id = 'cust';
  const warn = document.createElement('div'); warn.id = 'custWarn';
  const list = document.createElement('div'); list.id = 'custList';
  const slots = document.createElement('div'); slots.id = 'custSlots';
  const hint = document.createElement('div'); hint.id = 'custHint';
  hint.textContent = 'TAB — панель · 1…9 — слот · ← → — модуль · B — сошки/приклад · L — фонарь · K — ЛЦУ';
  host.append(warn, list, slots, hint);
  document.body.appendChild(host);

  const statBox = document.createElement('div'); statBox.id = 'custStats';
  document.body.appendChild(statBox);

  let active = null, prevStats = null, flash = {};

  function renderSlots(defs, cfg) {
    slots.innerHTML = '';
    defs.forEach((s, i) => {
      const cur = cfg[s.key];
      const el = document.createElement('div');
      el.className = 'cslot' + (active === s.key ? ' on' : '') + (cur ? '' : ' empty');
      const k = document.createElement('div'); k.className = 'k';
      k.textContent = (i < 9 ? (i + 1) + ' · ' : '') + s.label;
      const v = document.createElement('div'); v.className = 'v';
      v.textContent = cur ? opts.nameOf(cur) : '—';
      v.title = v.textContent;
      el.append(k, v);
      el.onclick = () => { active = s.key; render(); };
      slots.appendChild(el);
      if (active === s.key) requestAnimationFrame(() => {
        el.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderOptions(cfg) {
    list.innerHTML = '';
    if (!active) return;
    let selected = null;
    for (const o of opts.optionsFor(active)) {
      const el = document.createElement('div');
      const isSel = (cfg[active] || null) === o.key;
      el.className = 'copt' + (isSel ? ' sel' : '') + (o.fits === false ? ' bad' : '');
      el.textContent = o.label;
      el.title = o.fits === false ? 'Не подходит этому слоту' : o.label;
      el.onclick = () => { if (o.fits !== false) { opts.setModule(active, o.key); render(); } };
      list.appendChild(el);
      if (isSel) selected = el;
    }
    if (selected) requestAnimationFrame(() => {
      selected.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }

  function renderStats() {
    const st = opts.getStats();
    statBox.innerHTML = '';
    for (const d of STAT_DEFS) {
      if (st[d.k] === undefined) continue;
      const v = st[d.k], pv = prevStats ? prevStats[d.k] : undefined;
      const changed = pv !== undefined && Math.abs(v - pv) > 1e-6;
      let cls = 'cstat';
      if (changed) cls += ((v > pv) === d.up) ? ' up' : ' dn';
      const row = document.createElement('div');
      row.className = cls;
      const name = document.createElement('span'); name.textContent = d.label;
      const val = document.createElement('b');
      val.textContent = v.toFixed(d.d);
      if (changed) {
        const diff = document.createElement('i');
        const delta = v - pv;
        diff.textContent = (delta > 0 ? '▲' : '▼') + Math.abs(delta).toFixed(d.d);
        val.appendChild(diff);
      }
      row.append(name, val);
      statBox.appendChild(row);
    }
  }

  function render() {
    const cfg = opts.getConfig(), defs = opts.getSlots();
    if (active && !defs.some((s) => s.key === active)) active = null;
    renderSlots(defs, cfg);
    renderOptions(cfg);
    renderStats();
    const w = opts.getWarnings();
    warn.textContent = w && w.length ? w.join(' · ') : '';
  }

  return {
    render,
    markStats() { prevStats = Object.assign({}, opts.getStats()); },
    setActive(k) { active = k; render(); },
    getActive() { return active; },
    toggle(on) {
      const show = on !== false;
      host.classList.toggle('hidden', !show);
      statBox.style.display = show ? '' : 'none';
      if (show) render();
    },
    visible() { return !host.classList.contains('hidden'); }
  };
}


/* ---- интеграция кастомизации для «m416» ---- */
const ATTACH_DEF = __ATTACH.SLOTS["m416"];
const ATTACH_STATE = {
  config: Object.assign({}, ATTACH_DEF.defaults),
  asm: null, view: null, ui: null,
  toggles: { light: 0, laser: 0, ir: 0, deploy: {} }
};
/* деталь базовой модели -> слот, который её заменяет (для точечного скрытия) */
const ATTACH_HIDE_BY_NAME = {};

/* Список модулей, подходящих слоту (для интерфейса). */
function attachOptionsFor(slotKey) {
  const slot = attachSlots().find((s) => s.key === slotKey);
  if (!slot) return [];
  const accepts = slot.accepts || [slot.key];
  const out = [{ key: null, label: '— НЕТ —', fits: true }];
  for (const key of __ATTACH.REG.keys()) {
    let meta;
    try { meta = __ATTACH.REG.meta(key); } catch (e) { continue; }
    if (accepts.indexOf(meta.slot) < 0) continue;
    const fit = __ATTACH.SYS.checkFit(slot, Object.assign({ key }, meta),
      { caliber: ATTACH_DEF.caliber }, {});
    out.push({ key, label: meta.name, fits: fit.ok });
  }
  return out;
}

/* Слоты: статические из описания + динамические от цевья. */
function attachSlots() {
  const base = ATTACH_DEF.slots.slice();
  if (ATTACH_STATE.asm && ATTACH_STATE.asm.slotsDynamic)
    for (const d of ATTACH_STATE.asm.slotsDynamic)
      if (!base.some((b) => b.key === d.key)) base.push(d);
  return base;
}

function attachNameOf(key) {
  try { return __ATTACH.REG.meta(key).name; } catch (e) { return String(key); }
}

/* Пересборка: снять старую группу, собрать новую, вернуть узлы. */
function attachRebuild(THREE, parent, baseParts, weaponNodes) {
  if (ATTACH_STATE.view) {
    parent.remove(ATTACH_STATE.view.root);
    ATTACH_STATE.view.dispose();
  }
  const weapon = {
    caliber: ATTACH_DEF.caliber, weight: ATTACH_DEF.weight,
    ballistics: ATTACH_DEF.ballistics, stats: {},
    base: baseParts || [], nodes: weaponNodes || {}, slots: attachSlots()
  };
  const asm = __ATTACH.SYS.assemble(weapon, __ATTACH.REG, ATTACH_STATE.config);
  const view = __ATTACH.ADAPTER.build(THREE, asm, { scale: 0.001 });
  parent.add(view.root);
  ATTACH_STATE.asm = asm;
  ATTACH_STATE.view = view;
  /* вернуть прежние состояния переключателей */
  view.setBeam('light', ATTACH_STATE.toggles.light);
  view.setBeam('laser', ATTACH_STATE.toggles.laser);
  view.setBeam('ir', ATTACH_STATE.toggles.ir);
  for (const k in ATTACH_STATE.toggles.deploy) view.setDeploy(k, ATTACH_STATE.toggles.deploy[k]);
  return asm;
}

/* Скрытие заменяемых деталей базовой модели: зоны включаются по конфигурации.
   Вызывается после каждой пересборки, поэтому снятие модуля возвращает
   исходную деталь на место. */
function attachOcclude(THREE, host) {
  if (!host) return null;
  return __ATTACH.OCC.apply(THREE, host, "m416", ATTACH_STATE.config, {
    names: ATTACH_HIDE_BY_NAME, groups: {}
  });
}

/* Публичный API: смена модулей из консоли, автотестов и внешнего интерфейса.
   Реальная функция подстановки регистрируется интеграцией оружия. */
window.ATTACH = {
  set(slotKey, moduleKey) {
    if (!ATTACH_STATE.apply) throw new Error('система ещё не готова');
    ATTACH_STATE.apply(slotKey, moduleKey);
    return window.__ATTACH_DEBUG();
  },
  get: () => Object.assign({}, ATTACH_STATE.config),
  slots: () => attachSlots().map((s) => s.key),
  options: (slotKey) => attachOptionsFor(slotKey),
  preset: {
    save: () => __ATTACH.SYS.presetCodec().encode(ATTACH_STATE.config),
    load(code) {
      const cfg = __ATTACH.SYS.presetCodec().decode(code);
      for (const k of attachSlots().map((s) => s.key))
        window.ATTACH.set(k, cfg[k] || null);
      return window.__ATTACH_DEBUG();
    }
  },
  beam: (kind, level) => ATTACH_STATE.view.setBeam(kind, level),
  deploy: (slotKey, t) => ATTACH_STATE.view.setDeploy(slotKey, t),
  stats: () => (ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {})
};

/* Отладочный хук: состояние сборки доступно из консоли и автотестов. */
window.__ATTACH_DEBUG = () => ({
  weapon: "m416",
  config: ATTACH_STATE.config,
  modules: ATTACH_STATE.asm ? Object.keys(ATTACH_STATE.asm.modules) : [],
  parts: ATTACH_STATE.asm ? ATTACH_STATE.asm.parts.length : 0,
  errors: ATTACH_STATE.asm ? ATTACH_STATE.asm.errors : [],
  warnings: ATTACH_STATE.asm ? ATTACH_STATE.asm.warnings : [],
  stats: ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {}
});

/* Управление с клавиатуры: TAB — панель, цифры — слот, стрелки — перебор. */
function attachBindKeys(onChange) {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const ui = ATTACH_STATE.ui;
    if (e.code === 'Tab') { e.preventDefault(); if (ui) ui.toggle(!ui.visible()); return; }
    if (e.code === 'KeyL') { ATTACH_STATE.toggles.light = ATTACH_STATE.toggles.light ? 0 : 1;
      ATTACH_STATE.view.setBeam('light', ATTACH_STATE.toggles.light); return; }
    if (e.code === 'KeyK') { ATTACH_STATE.toggles.laser = ATTACH_STATE.toggles.laser ? 0 : 1;
      ATTACH_STATE.view.setBeam('laser', ATTACH_STATE.toggles.laser); return; }
    if (e.code === 'KeyB') {
      for (const sk in ATTACH_STATE.asm.modules) {
        const m = ATTACH_STATE.asm.modules[sk];
        if (!(m.meta.deploy || m.meta.fold || m.meta.flipAxis)) continue;
        const cur = ATTACH_STATE.toggles.deploy[sk] || 0;
        const next = cur > 0.5 ? 0 : 1;
        ATTACH_STATE.toggles.deploy[sk] = next;
        ATTACH_STATE.view.setDeploy(sk, next);
      }
      return;
    }
    if (!ui || !ui.visible()) return;
    const slots = attachSlots();
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= slots.length) { ui.setActive(slots[n - 1].key); return; }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      const act = ui.getActive();
      if (!act) return;
      e.preventDefault();
      const opts = attachOptionsFor(act).filter((o) => o.fits);
      const cur = ATTACH_STATE.config[act] || null;
      let i = opts.findIndex((o) => o.key === cur);
      if (i < 0) i = 0;
      i = (i + (e.code === 'ArrowRight' ? 1 : opts.length - 1)) % opts.length;
      onChange(act, opts[i].key);
      ui.render();
    }
  });
}

/* ATTACH:END m416 */

function buildM416(THREE, opts = {}) {

  const mm = x => x / 1000;                        // мм -> метры
  const G = [], MT = [];                           // реестры для dispose()
  const reg = g => { G.push(g); return g; };
  const regM = m => { MT.push(m); return m; };

  const BORE = mm(70);                             // ось канала ствола — 70 мм над origin
  const fde = !!opts.fde;

  // ---------- МАТЕРИАЛЫ ----------
  const anodized  = regM(new THREE.MeshStandardMaterial({ color: fde ? 0x8a7a5c : 0x1c1e21, metalness: 0.62, roughness: 0.50 }));
  const polymer   = regM(new THREE.MeshStandardMaterial({ color: fde ? 0x8a7a5c : 0x22252a, metalness: 0.00, roughness: 0.70 }));
  const phosphate = regM(new THREE.MeshStandardMaterial({ color: 0x2a2d30, metalness: 0.70, roughness: 0.62 }));
  const steelDark = regM(new THREE.MeshStandardMaterial({ color: 0x17191c, metalness: 0.80, roughness: 0.45 }));
  const brass     = regM(new THREE.MeshStandardMaterial({ color: 0xb08d3f, metalness: 0.90, roughness: 0.30 }));
  const rubber    = regM(new THREE.MeshStandardMaterial({ color: 0x131518, metalness: 0.00, roughness: 0.93 }));
  const mark      = regM(new THREE.MeshStandardMaterial({ color: 0x8d939a, metalness: 0.35, roughness: 0.55 }));

  // ---------- БАЗОВЫЕ ХЕЛПЕРЫ ----------
  const BEV = { bevelEnabled: true, bevelThickness: mm(0.4), bevelSize: mm(0.4), bevelSegments: 3, curveSegments: 16 };

  function mesh(g, mat) { const m = new THREE.Mesh(reg(g), mat); m.castShadow = true; m.receiveShadow = true; return m; }

  // Базовое выдавливание: профиль в XY, толщина по Z, центрировано. Фаска 0.4 мм на всех кромках.
  function ex(shape, depth, mat, o) {
    const cfg = Object.assign({ depth: depth, steps: 1 }, BEV, o || {});
    const g = new THREE.ExtrudeGeometry(shape, cfg);
    g.translate(0, 0, -depth / 2);
    return mesh(g, mat);
  }
  // Сечение X/Y, длина вдоль Z
  const bodyXY = (s, len, mat, o) => ex(s, len, mat, o);
  // Боковой профиль: x фигуры -> Z, y -> Y, ширина по X. Отверстия в фигуре = сквозные по X.
  function bodyYZ(s, width, mat, o) { const m = ex(s, width, mat, o); m.rotation.y = -Math.PI / 2; return m; }
  // План: x фигуры -> X, y -> Z, высота по Y. Отверстия = сквозные по Y.
  function bodyXZ(s, h, mat, o) { const m = ex(s, h, mat, o); m.rotation.x = Math.PI / 2; return m; }

  // Цилиндр/труба вдоль Z с фасками по торцам (Lathe)
  function tubeZ(rOut, rIn, len, mat, seg, ch) {
    const c = ch === undefined ? mm(0.5) : ch, p = [], h = len / 2, hole = rIn > 0;
    if (hole) { p.push(new THREE.Vector2(rIn, -h), new THREE.Vector2(rIn, h), new THREE.Vector2(rIn + c, h)); }
    else p.push(new THREE.Vector2(0, h));
    p.push(new THREE.Vector2(rOut - c, h), new THREE.Vector2(rOut, h - c), new THREE.Vector2(rOut, -h + c), new THREE.Vector2(rOut - c, -h));
    if (hole) p.push(new THREE.Vector2(rIn + c, -h), new THREE.Vector2(rIn, -h)); else p.push(new THREE.Vector2(0, -h));
    p.reverse();                                     // обход против часовой — нормали наружу
    const g = new THREE.LatheGeometry(p, seg || 32);
    g.rotateX(Math.PI / 2);
    return mesh(g, mat);
  }
  function tubeX(rOut, rIn, len, mat, seg, ch) { const m = tubeZ(rOut, rIn, len, mat, seg, ch); m.geometry.rotateY(Math.PI / 2); return m; }
  function tubeY(rOut, rIn, len, mat, seg, ch) { const m = tubeZ(rOut, rIn, len, mat, seg, ch); m.geometry.rotateX(-Math.PI / 2); return m; }
  // Произвольный профиль вращения вокруг оси Z: pts = [[r, z], ...]
  function latheZ(pts, mat, seg) {
    const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
    const g = new THREE.LatheGeometry(v, seg || 48);
    g.rotateX(Math.PI / 2);
    return mesh(g, mat);
  }

  // Скруглённый прямоугольник в любой Path/Shape
  function rrTo(p, w, h, r, cx, cy) {
    cx = cx || 0; cy = cy || 0;
    r = Math.min(r, Math.min(w, h) / 2 - 1e-6);
    const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
    p.moveTo(x0 + r, y0);
    p.lineTo(x1 - r, y0); p.quadraticCurveTo(x1, y0, x1, y0 + r);
    p.lineTo(x1, y1 - r); p.quadraticCurveTo(x1, y1, x1 - r, y1);
    p.lineTo(x0 + r, y1); p.quadraticCurveTo(x0, y1, x0, y1 - r);
    p.lineTo(x0, y0 + r); p.quadraticCurveTo(x0, y0, x0 + r, y0);
    p.closePath();
    return p;
  }
  const roundRect = (w, h, r, cx, cy) => rrTo(new THREE.Shape(), w, h, r, cx, cy);
  const roundHole = (s, w, h, r, cx, cy) => { s.holes.push(rrTo(new THREE.Path(), w, h, r, cx, cy)); return s; };
  // Сквозное круглое отверстие
  function hole(s, r, cx, cy) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, true); s.holes.push(p); return s; }
  function circleShape(r, cx, cy) { const s = new THREE.Shape(); s.absarc(cx || 0, cy || 0, r, 0, Math.PI * 2, false); return s; }
  function hexShape(r, cx, cy, rot) {
    cx = cx || 0; cy = cy || 0; rot = rot || 0;
    const s = new THREE.Shape();
    for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; i ? s.lineTo(x, y) : s.moveTo(x, y); }
    s.closePath(); return s;
  }
  // Кольцевой сектор (стенка между прорезями пламегасителя)
  function sector(rIn, rOut, a0, a1) {
    const s = new THREE.Shape();
    s.absarc(0, 0, rOut, a0, a1, false);
    s.absarc(0, 0, rIn, a1, a0, true);
    s.closePath(); return s;
  }

  // ---------- ПРОЦЕДУРНЫЕ BufferGeometry: насечка, рифлёние, гравировка ----------
  function quad(a, p1, p2, p3, p4) {
    a.push(p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2]);
    a.push(p1[0], p1[1], p1[2], p3[0], p3[1], p3[2], p4[0], p4[1], p4[2]);
  }

      i ? s.lineTo(x, y) : s.moveTo(x, y);

    s.closePath();
    return s;

  ramp(g1, t, 0.95 * v, 0.0004, 0.007);
  n1.connect(bp).connect(g1).connect(comp); g1.connect(echoBus);
  n1.start(t); n1.stop(t + 0.03);
  const n2 = nz(p), lp = ac.createBiquadFilter(), g2 = ac.createGain();      // 2) тело 220 мс
  lp.type = 'lowpass'; lp.Q.value = 1.2;
  lp.frequency.setValueAtTime(7000 * p, t);
  lp.frequency.exponentialRampToValueAtTime(380, t + 0.22);
  ramp(g2, t, 0.8 * v, 0.002, 0.22);
  n2.connect(lp).connect(g2).connect(comp);
  const gt = ac.createGain();                                               // 4) хвост в конволюцию
  ramp(gt, t, 0.55 * v, 0.004, 0.34 * tk);
  lp.connect(gt); gt.connect(echoBus);
  n2.start(t); n2.stop(t + 0.42 * tk);
  const o = ac.createOscillator(), g3 = ac.createGain();                    // 3) сухой низ
  o.type = 'sine';
  o.frequency.setValueAtTime(175 * p, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.075);
  ramp(g3, t, 0.42 * v, 0.004, 0.16);
  o.connect(g3).connect(comp);
  o.start(t); o.stop(t + 0.2);
}
function sndClack(delay, vol, freq, dur) {
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0);
  const n = nz(1), bp = ac.createBiquadFilter(), g = ac.createGain();
  bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.5;
  ramp(g, t, vol, 0.0008, dur);
  n.connect(bp).connect(g).connect(comp); g.connect(echoBus);
  n.start(t); n.stop(t + dur + 0.05);
}
function sndBoing(delay) {                                                   // фирменный звук AR: пружина в трубке
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = 320;
  lfo.type = 'sine'; lfo.frequency.value = 25; lg.gain.value = 60;          // вибрато 25 Гц
  lfo.connect(lg); lg.connect(o.frequency);
  ramp(g, t, 0.15, 0.004, 0.12);
  o.connect(g).connect(comp);
  o.start(t); o.stop(t + 0.16); lfo.start(t); lfo.stop(t + 0.16);
}
function sndCaseRing(delay) {                                                // звон падающей гильзы
  const ac = audio(); if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  [2600, 3400, 5200].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * (0.97 + Math.random() * 0.06);
    const t = t0 + i * 0.012;
    ramp(g, t, 0.07, 0.001, 0.06);
    o.connect(g).connect(comp); g.connect(echoBus);
    o.start(t); o.stop(t + 0.09);
  });
}
const sndDry = () => { sndClack(0, 0.5, 3100, 0.035); };                     // сухой щелчок вхолостую
const sndMagBtn = () => { sndClack(0, 0.32, 2600, 0.03); };
const sndMagIn = () => { sndClack(0, 0.55, 900, 0.09); sndClack(0.01, 0.3, 2200, 0.05); };
const sndBoltSlam = () => { sndClack(0, 0.85, 1500, 0.09); sndClack(0.004, 0.6, 3600, 0.05); sndBoing(0.01); };
const sndCycle = () => { sndClack(0.012, 0.28, 1900, 0.05); sndBoing(0.016); };

// ---------- СОСТОЯНИЕ И АНИМАЦИЯ ----------
const RZ = 0.011, RA = 1.5 * Math.PI / 180, BOLT = 0.09;                    // 11 мм, 1.5 градуса, 90 мм
const magRelease = gun && gun.getObjectByName('magRelease');
const boltCatch = gun && gun.getObjectByName('boltCatch');
let ammo = 30, firing = false, reloading = false, boltHeld = false;
let shotT = 1e9, boltT = 1e9, flashT = 1e9, relT = 1e9, lastShot = -1e9, shake = 0, relBolt = 1e9;
let magVisible = true, magY = 0;
function shoot(now) {
  if (!gun || reloading) return;
  if (ammo <= 0) { boltHeld = true; firing = false; sndDry(); return; }
  ammo--; lastShot = now;
  shotT = 0; boltT = 0; flashT = 0; shake = 0.002;                          // камера дрожит на 2 мм
  flash.rotation.z = Math.random() * Math.PI * 2;
  const s = 0.8 + Math.random() * 0.5;
  flash.scale.setScalar(s);
  sndShot(); sndCycle();
  ejectCase(); sndCaseRing(0.25 + Math.random() * 0.25);
  if (ammo === 0) boltHeld = true;
}
function startFire() { if (!reloading) { firing = true; shoot(performance.now()); } }
function startReload() {
  if (!gun || reloading) return;
  reloading = true; firing = false; relT = 0; relBolt = 1e9;
  sndMagBtn();
}

let prev = performance.now();
const camOff = new THREE.Vector3();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  const ms = dt * 1000;
  shotT += ms; boltT += ms; flashT += ms; relT += ms; relBolt += ms;

  if (firing && !reloading && now - lastShot >= 75) shoot(now);             // 800 выстрелов/мин

  if (gun) {
    let tiltZ = 0, tiltX = 0;
    if (reloading) {
      const t = relT;
      const k = t < 1900 ? Math.min(1, t / 170) : Math.max(0, 1 - (t - 1900) / 200);
      tiltZ = -0.20 * k; tiltX = 0.05 * k;                                   // наклон оружия
      if (magRelease) magRelease.position.x = t < 260 ? -0.0022 : 0;
      if (t < 100) { magY = 0; magVisible = true; }
      else if (t < 800) {                                                    // магазин падает СТРОГО ВНИЗ
        const f = (t - 100) / 700;
        magY = -2.6 * f * f;
        magVisible = magY > -0.34;
      } else if (t < 960) {                                                  // новый магазин снизу вертикально
        const f = (t - 800) / 160;
        magY = -0.19 * (1 - f) * (1 - f);
        magVisible = true;
        if (magY > -0.001 && relBolt > 1e8) { magY = 0; }
      } else { magY = 0; magVisible = true; }
      if (t >= 960 && t - ms < 960) sndMagIn();                              // чёткий удар ладони
      if (t >= 1700 && t - ms < 1700) { sndBoltSlam(); relBolt = 0; }        // удар по затворной задержке
      if (boltCatch) boltCatch.position.x = (t >= 1700 && t < 1840) ? 0.0018 : 0;
      if (t >= 2100 && t - ms < 2100) { ammo = 30; boltHeld = false; }
      if (t >= 2300) { reloading = false; relT = 1e9; }
    } else {
      if (magRelease) magRelease.position.x = 0;
      if (boltCatch) boltCatch.position.x = 0;
      magY = 0; magVisible = true;
    }
    parts.magazine.position.y = magY;
    parts.magazine.visible = magVisible;

    let kick = 0;                                                            // отдача считается от ИСХОДНОЙ позы
    if (shotT <= 75) kick = shotT <= 28 ? shotT / 28 : Math.pow(1 - (shotT - 28) / 47, 2);
    gun.position.set(0, 0, RZ * kick);
    gun.rotation.set(RA * kick + tiltX, 0, tiltZ);

    let bz = 0;
    if (relBolt <= 30) bz = BOLT * (1 - relBolt / 30);                       // срыв вперёд за 30 мс
    else if (boltHeld && !(reloading && relT >= 1700)) bz = BOLT;            // затворная задержка
    else if (boltT <= 73) bz = boltT <= 38 ? BOLT * (boltT / 38) : BOLT * (1 - (boltT - 38) / 35);
    parts.bolt.position.z = bz;

    const want = (firing && !reloading && ammo >= 0 && shotT < 60) ? 0.30 : 0;
    parts.trigger.rotation.x += (want - parts.trigger.rotation.x) * Math.min(1, dt * 22);

    if (flashT <= 28) {
      flash.visible = true;
      flashLight.intensity = 26 * (1 - flashT / 28);
    } else if (flash.visible) { flash.visible = false; flashLight.intensity = 0; }
  }

  for (let i = cases.length - 1; i >= 0; i--) {                              // гильзы по параболе, 1.2 с
    const c = cases[i];
    c.life += dt;
    c.v.y -= 9.81 * dt;
    c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.w.x * dt; c.m.rotation.y += c.w.y * dt; c.m.rotation.z += c.w.z * dt;
    if (c.life > 1.2) { scene.remove(c.m); cases.splice(i, 1); }
  }

  if (homing) {
    camera.position.lerp(homePos, 0.14);
    controls.target.lerp(homeTarget, 0.14);
    if (camera.position.distanceTo(homePos) < 0.0015) { camera.position.copy(homePos); controls.target.copy(homeTarget); homing = 0; }
  }
  controls.update();

  shake = Math.max(0, shake - dt * 0.02);
  if (shake > 0.00002) {
    camOff.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(shake * 2);
    camera.position.add(camOff);
    renderer.render(scene, camera);
    camera.position.sub(camOff);
  } else {
    renderer.render(scene, camera);
  }
}
requestAnimationFrame(tick);

// ---------- ИНТЕРФЕЙС ----------
const fireBtn = document.getElementById('fire');
const reloadBtn = document.getElementById('reload');
const sndBtn = document.getElementById('snd');
const sndWave = document.getElementById('sndWave');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireBtn.classList.add('on'); audio(); startFire(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  fireBtn.addEventListener(ev, () => { fireBtn.classList.remove('on'); firing = false; }));
reloadBtn.addEventListener('pointerdown', e => { e.preventDefault(); reloadBtn.classList.add('on'); audio(); startReload(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  reloadBtn.addEventListener(ev, () => reloadBtn.classList.remove('on')));
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { fireBtn.classList.add('on'); audio(); startFire(); } }
  else if (e.code === 'KeyR') { reloadBtn.classList.add('on'); audio(); startReload(); }
});
addEventListener('keyup', e => {
  if (e.code === 'Space') { fireBtn.classList.remove('on'); firing = false; }
  else if (e.code === 'KeyR') reloadBtn.classList.remove('on');
});
sndBtn.addEventListener('click', () => {
  muted = !muted;
  sndWave.style.display = muted ? 'none' : '';
  if (!muted) audio();
});
</script>
</body>
</html>
